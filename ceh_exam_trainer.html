<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEH Master Exam Trainer</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07080f;--panel:#0d0f1a;--card:#111320;--border:#1a1f35;
  --accent:#ff6b35;--accent2:#00d4ff;--warn:#ffcc00;--danger:#ff3366;
  --correct:#00ff9d;--wrong:#ff3366;--text:#ccd6f6;--dim:#4a5580;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;}
.header{background:linear-gradient(135deg,#090b18,#0d1025);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
.logo{font-family:'Rajdhani',sans-serif;font-size:1.4rem;font-weight:700;letter-spacing:.12em;color:var(--accent);}
.logo span{color:var(--accent2);}
.score-bar{display:flex;gap:20px;align-items:center;}
.score-item{text-align:center;}
.score-item .num{font-family:'Share Tech Mono',monospace;font-size:1.2rem;font-weight:700;}
.score-item .lbl{font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);}
.num.green{color:var(--correct);}
.num.red{color:var(--wrong);}
.num.blue{color:var(--accent2);}
.layout{display:grid;grid-template-columns:265px 1fr;min-height:calc(100vh - 62px);}
.sidebar{background:var(--panel);border-right:1px solid var(--border);padding:18px 14px;overflow-y:auto;}
.sidebar h3{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:10px;}
.topic-btn{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;margin-bottom:3px;background:transparent;border:1px solid transparent;border-radius:6px;cursor:pointer;text-align:left;font-family:'Inter',sans-serif;font-size:.75rem;color:var(--text);transition:all .15s;}
.topic-btn:hover{background:rgba(255,107,53,.06);border-color:var(--border);}
.topic-btn.active{background:rgba(255,107,53,.1);border-color:var(--accent);color:var(--accent);}
.topic-btn .t-num{font-family:'Share Tech Mono',monospace;font-size:.68rem;color:var(--dim);min-width:18px;}
.sidebar-divider{border:none;border-top:1px solid var(--border);margin:12px 0;}
.mode-btn{display:block;width:100%;padding:8px 10px;margin-bottom:5px;background:transparent;border:1px solid var(--border);border-radius:6px;cursor:pointer;text-align:left;font-family:'Inter',sans-serif;font-size:.75rem;color:var(--dim);transition:all .15s;}
.mode-btn:hover{color:var(--text);border-color:var(--accent);}
.mode-btn.active{color:var(--accent);border-color:var(--accent);background:rgba(255,107,53,.07);}
.main-content{overflow-y:auto;}
.content{padding:26px;max-width:880px;}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:26px;margin-bottom:18px;}
.q-meta{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
.badge{font-size:.63rem;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:4px;font-weight:600;}
.badge-topic{background:rgba(255,107,53,.12);color:var(--accent);}
.badge-easy{background:rgba(0,255,157,.12);color:var(--correct);}
.badge-medium{background:rgba(255,204,0,.12);color:var(--warn);}
.badge-hard{background:rgba(255,51,102,.12);color:var(--danger);}
.badge-type{background:rgba(255,255,255,.05);color:var(--dim);}
.q-num{font-family:'Share Tech Mono',monospace;font-size:.7rem;color:var(--dim);margin-left:auto;}
.q-text{font-size:.97rem;line-height:1.75;color:var(--text);margin-bottom:20px;}
.q-code{background:#040509;border:1px solid var(--border);border-radius:6px;padding:13px 16px;margin:12px 0;font-family:'Share Tech Mono',monospace;font-size:.8rem;color:#88bbdd;line-height:1.7;white-space:pre-wrap;}
.options{display:flex;flex-direction:column;gap:9px;}
.option{display:flex;align-items:flex-start;gap:13px;padding:13px 16px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,.02);cursor:pointer;transition:all .15s;font-size:.88rem;line-height:1.5;}
.option:hover:not(.disabled){border-color:var(--accent);background:rgba(255,107,53,.05);}
.option.disabled{cursor:default;pointer-events:none;}
.option.correct{border-color:var(--correct);background:rgba(0,255,157,.08);}
.option.wrong{border-color:var(--wrong);background:rgba(255,51,102,.08);}
.option.reveal{border-color:var(--correct);background:rgba(0,255,157,.05);}
.opt-letter{width:27px;height:27px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Share Tech Mono',monospace;font-size:.72rem;font-weight:700;border:1px solid var(--border);color:var(--dim);transition:all .15s;}
.option.correct .opt-letter{background:var(--correct);color:#000;border-color:var(--correct);}
.option.wrong .opt-letter{background:var(--wrong);color:#fff;border-color:var(--wrong);}
.option.reveal .opt-letter{background:rgba(0,255,157,.2);color:var(--correct);border-color:var(--correct);}
.option.selected:not(.correct):not(.wrong) .opt-letter{background:var(--accent);color:#fff;border-color:var(--accent);}
.feedback{margin-top:18px;padding:16px 18px;border-radius:8px;line-height:1.75;font-size:.86rem;display:none;}
.feedback.show{display:block;}
.feedback.fb-correct{border:1px solid var(--correct);background:rgba(0,255,157,.06);}
.feedback.fb-wrong{border:1px solid var(--wrong);background:rgba(255,51,102,.06);}
.feedback-title{font-family:'Rajdhani',sans-serif;font-size:.95rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-bottom:7px;}
.fb-correct .feedback-title{color:var(--correct);}
.fb-wrong .feedback-title{color:var(--wrong);}
.feedback strong{color:var(--accent2);}
.hint-box{background:rgba(255,204,0,.06);border:1px solid rgba(255,204,0,.25);border-radius:8px;padding:13px 16px;margin-top:13px;font-size:.83rem;color:#ffdd55;line-height:1.6;display:none;}
.hint-box.show{display:block;}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px;}
.btn-primary{padding:10px 26px;background:var(--accent);color:#fff;border:none;border-radius:6px;font-family:'Rajdhani',sans-serif;font-size:.92rem;font-weight:700;letter-spacing:.08em;cursor:pointer;text-transform:uppercase;transition:opacity .15s,transform .1s;}
.btn-primary:hover{opacity:.85;transform:translateY(-1px);}
.btn-primary:disabled{opacity:.3;cursor:not-allowed;transform:none;}
.btn-secondary{padding:10px 18px;background:transparent;color:var(--dim);border:1px solid var(--border);border-radius:6px;font-family:'Rajdhani',sans-serif;font-size:.88rem;letter-spacing:.06em;cursor:pointer;transition:all .15s;}
.btn-secondary:hover{color:var(--text);border-color:var(--dim);}
.btn-hint-style{padding:10px 16px;background:transparent;color:var(--warn);border:1px solid rgba(255,204,0,.3);border-radius:6px;font-family:'Rajdhani',sans-serif;font-size:.88rem;cursor:pointer;transition:all .15s;}
.btn-hint-style:hover{background:rgba(255,204,0,.07);}
.progress-wrap{margin-bottom:20px;}
.progress-bar-bg{height:4px;background:var(--border);border-radius:2px;margin-top:7px;}
.progress-fill{height:4px;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px;transition:width .4s ease;}
.progress-labels{display:flex;justify-content:space-between;font-size:.72rem;color:var(--dim);}
.home-screen{padding:36px 26px;max-width:880px;}
.home-screen h1{font-family:'Rajdhani',sans-serif;font-size:2rem;font-weight:700;color:var(--accent);margin-bottom:5px;}
.home-screen p{color:var(--dim);font-size:.88rem;margin-bottom:26px;line-height:1.75;}
.mode-select-row{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap;}
.mode-opt{padding:9px 16px;background:var(--card);border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:.83rem;color:var(--dim);transition:all .15s;}
.mode-opt:hover{border-color:var(--accent);color:var(--text);}
.mode-opt.active{border-color:var(--accent);background:rgba(255,107,53,.08);color:var(--accent);}
.topic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:12px;margin-bottom:26px;}
.topic-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px 18px;cursor:pointer;transition:all .15s;}
.topic-card:hover{border-color:var(--accent);transform:translateY(-2px);}
.tc-icon{font-size:1.5rem;margin-bottom:8px;}
.tc-title{font-family:'Rajdhani',sans-serif;font-size:.95rem;font-weight:600;color:var(--text);margin-bottom:3px;}
.tc-desc{font-size:.73rem;color:var(--dim);line-height:1.5;}
.btn-start{padding:12px 36px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-family:'Rajdhani',sans-serif;font-size:1.05rem;font-weight:700;letter-spacing:.1em;cursor:pointer;text-transform:uppercase;transition:all .15s;}
.btn-start:hover{opacity:.85;transform:translateY(-2px);}
.results-wrap{text-align:center;padding:40px 20px;}
.results-wrap h2{font-family:'Rajdhani',sans-serif;font-size:1.9rem;font-weight:700;color:var(--accent);margin-bottom:6px;}
.grade-circle{width:115px;height:115px;border-radius:50%;border:4px solid var(--accent2);display:flex;align-items:center;justify-content:center;margin:22px auto;flex-direction:column;}
.grade-pct{font-family:'Share Tech Mono',monospace;font-size:1.7rem;color:var(--accent2);}
.grade-lbl{font-size:.62rem;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;}
.results-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin:22px 0;max-width:460px;margin-left:auto;margin-right:auto;}
.stat-box{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:13px;}
.stat-num{font-family:'Share Tech Mono',monospace;font-size:1.3rem;}
.stat-lbl{font-size:.62rem;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;margin-top:3px;}
.ai-zone{margin-top:22px;border-top:1px solid var(--border);padding-top:18px;}
.ai-zone-label{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:11px;}
@keyframes spin{to{transform:rotate(360deg);}}
.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:middle;margin-right:8px;}
@media(max-width:700px){.layout{grid-template-columns:1fr;}.sidebar{display:none;}.content,.home-screen{padding:14px;}}
</style>
</head>
<body>

<div class="header">
  <div class="logo">CEH <span>MASTER</span> TRAINER</div>
  <div class="score-bar">
    <div class="score-item"><div class="num green" id="h-correct">0</div><div class="lbl">Correct</div></div>
    <div class="score-item"><div class="num red" id="h-wrong">0</div><div class="lbl">Wrong</div></div>
    <div class="score-item"><div class="num blue" id="h-total">0</div><div class="lbl">Total</div></div>
    <div class="score-item"><div class="num" id="h-pct" style="color:var(--warn)">--</div><div class="lbl">Score %</div></div>
  </div>
</div>

<div class="layout">
  <div class="sidebar">
    <h3>Domains</h3>
    <button class="topic-btn active" data-topic="all">🎯 All Domains</button>
    <button class="topic-btn" data-topic="0"><span class="t-num">1</span> Ethical Hacking Essentials</button>
    <button class="topic-btn" data-topic="1"><span class="t-num">2</span> Reconnaissance &amp; Footprinting</button>
    <button class="topic-btn" data-topic="2"><span class="t-num">3</span> Scanning &amp; Enumeration</button>
    <button class="topic-btn" data-topic="3"><span class="t-num">4</span> Sniffing &amp; Evasion</button>
    <button class="topic-btn" data-topic="4"><span class="t-num">5</span> System Hacking</button>
    <button class="topic-btn" data-topic="5"><span class="t-num">6</span> Malware &amp; Trojans</button>
    <button class="topic-btn" data-topic="6"><span class="t-num">7</span> Wireless Hacking</button>
    <button class="topic-btn" data-topic="7"><span class="t-num">8</span> Web Application Attacks</button>
    <button class="topic-btn" data-topic="8"><span class="t-num">9</span> Cryptography</button>
    <button class="topic-btn" data-topic="9"><span class="t-num">10</span> Social Engineering</button>
    <button class="topic-btn" data-topic="10"><span class="t-num">11</span> DoS &amp; Session Hijacking</button>
    <button class="topic-btn" data-topic="11"><span class="t-num">12</span> Cloud &amp; IoT Security</button>
    <hr class="sidebar-divider">
    <h3>Mode</h3>
    <button class="mode-btn active" id="mb-study" data-mode="study">📚 Study Mode</button>
    <button class="mode-btn" id="mb-exam" data-mode="exam">⏱ Exam Mode</button>
    <hr class="sidebar-divider">
    <h3>Session</h3>
    <button class="mode-btn" id="btn-reset">🔄 Reset Session</button>
  </div>
  <div class="main-content">
    <div id="app-root"></div>
  </div>
</div>

<script>

const QUESTION_BANK=[
// -- TOPIC 0: Ethical Hacking Essentials --
{topic:0,diff:'easy',type:'Multiple Choice',
q:'Which of the following BEST describes the primary goal of ethical hacking?',
opts:['To break into systems for personal gain','To improve an organization\'s security posture by identifying vulnerabilities before malicious attackers do','To develop new malware for testing purposes','To monitor employee activity on corporate networks'],
ans:1,hint:'Think about what differentiates a white hat from a black hat  --  it\'s consent and purpose.',
correct_fb:'<strong>Ethical hacking</strong> is performed with explicit permission to <strong>identify and remediate vulnerabilities</strong> before malicious actors can exploit them. The goal is always to improve security posture, not to cause harm. The CEH exam emphasizes that ethical hackers always operate with written authorization.',
wrong_fb:'The correct answer is <strong>improving security posture through authorized vulnerability discovery</strong>. Ethical hackers are hired to find weaknesses. Without explicit permission and defined scope, it becomes illegal hacking regardless of intent. Key differentiators: written consent, defined scope, no malicious intent, and reporting findings to the client.'},

{topic:0,diff:'easy',type:'Multiple Choice',
q:'In the CEH methodology, what is the correct order of the five attack phases?',
opts:['Scanning -> Reconnaissance -> Gaining Access -> Maintaining Access -> Covering Tracks','Reconnaissance -> Scanning -> Gaining Access -> Maintaining Access -> Covering Tracks','Gaining Access -> Scanning -> Reconnaissance -> Maintaining Access -> Covering Tracks','Reconnaissance -> Gaining Access -> Scanning -> Covering Tracks -> Maintaining Access'],
ans:1,hint:'You must know your target exists before you can probe it, and probe it before you attack it.',
correct_fb:'The CEH methodology follows: <strong>1. Reconnaissance</strong> (footprinting/information gathering) -> <strong>2. Scanning & Enumeration</strong> (active probing) -> <strong>3. Gaining Access</strong> (exploitation) -> <strong>4. Maintaining Access</strong> (persistence, rootkits, zombies) -> <strong>5. Covering Tracks</strong> (hiding evidence). This order is critical to memorize for the exam.',
wrong_fb:'Correct order: <strong>Reconnaissance -> Scanning -> Gaining Access -> Maintaining Access -> Covering Tracks</strong>. Logic: you cannot scan what you haven\'t discovered; you cannot exploit what you haven\'t scanned. Covering tracks always comes last  --  you hide evidence of what you\'ve already done.'},

{topic:0,diff:'medium',type:'Multiple Choice',
q:'A penetration tester is given credentials and full knowledge of the target environment before testing. Which test type is this?',
opts:['Black-box test','Gray-box test','White-box test','Red team exercise'],
ans:2,hint:'Think about what "white box" means  --  full visibility into the system.',
correct_fb:'<strong>White-box testing</strong> (also called crystal box or glass box) gives the tester complete knowledge of the environment: network diagrams, source code, credentials, and architecture. This simulates a threat from a knowledgeable insider or a compromised administrator. It\'s the most thorough but least realistic simulation of an external attacker.',
wrong_fb:'<strong>White-box testing</strong> = full knowledge provided. <strong>Black-box</strong> = no prior knowledge (simulates external attacker). <strong>Gray-box</strong> = partial knowledge (simulates average internal user). The CEH exam tests all three  --  know which simulates which threat model.'},

{topic:0,diff:'medium',type:'Multiple Choice',
q:'What is a Business Impact Analysis (BIA) used for?',
opts:['Testing disaster recovery procedures under simulated attack','Identifying which systems and processes are critical to continued operation and assessing the impact of their loss','Calculating the cost of a penetration test engagement','Documenting security incidents after they occur'],
ans:1,hint:'BIA looks forward at what would happen if systems were disrupted.',
correct_fb:'A <strong>BIA (Business Impact Analysis)</strong> identifies all systems and processes critical to an organization\'s operation, determines the maximum tolerable downtime (MTD) for each, and evaluates existing security controls. It assigns value to assets and identifies overlooked vulnerabilities. The BIA feeds into the BCP (Business Continuity Plan) and DRP (Disaster Recovery Plan).',
wrong_fb:'<strong>BIA</strong> = identifying critical systems + impact of loss + MTD. Remember: BIA -> BCP -> DRP. The BIA tells you WHAT is critical; the BCP tells you HOW to continue; the DRP tells you HOW to recover a specific resource. ALE (Annualized Loss Expectancy) = SLE x ARO and is a mathematical formula, not an analysis process.'},

{topic:0,diff:'hard',type:'Multiple Choice',
q:'Which of the following BEST represents the relationship between risk, vulnerability, and threat?',
opts:['Risk = Threat x Asset Value','Risk = Threat x Vulnerability x Asset Value','Risk = Vulnerability / Threat','Risk = Threat + Vulnerability - Control'],
ans:1,hint:'Risk requires all three elements  --  a threat must exploit a vulnerability to impact an asset.',
correct_fb:'<strong>Risk = Threat x Vulnerability x Asset Value</strong>. A threat alone creates no risk if there\'s no vulnerability to exploit. A vulnerability alone creates no risk if nothing threatens it. Asset value determines the magnitude of potential loss. This formula underpins all risk management frameworks tested on the CEH exam.',
wrong_fb:'<strong>Risk = Threat x Vulnerability x Asset Value</strong>. Remove any factor and risk approaches zero. Example: highly valuable asset (high AV) with a known vulnerability (high V) but no known threat actors (low T) = lower risk. This is why threat intelligence, vulnerability assessments, AND asset valuation are all required for proper risk management.'},

{topic:0,diff:'easy',type:'Multiple Choice',
q:'What differentiates a white hat hacker from a black hat hacker?',
opts:['Technical skill level  --  white hats are more skilled','Permission and intent  --  white hats have authorization and good intent; black hats do not','The tools used  --  white hats use different tools','The targets chosen  --  white hats only attack small companies'],
ans:1,hint:'The hat color represents intent and legality, not skill.',
correct_fb:'<strong>White hats</strong> = authorized, ethical, good intent (hired penetration testers, security researchers with permission). <strong>Black hats</strong> = unauthorized, malicious, criminal intent (crackers). <strong>Gray hats</strong> = hack without permission but typically disclose findings without causing harm  --  still illegal. The distinction is always about <strong>authorization and intent</strong>, never about skill level.',
wrong_fb:'<strong>Permission and intent</strong> separate white from black hats. White hats operate with written consent and defined scope. Black hats operate without permission for personal gain or malicious purposes. Gray hats hack without permission but typically don\'t cause damage and may disclose findings. All hat colors can possess equal technical skill.'},

{topic:0,diff:'medium',type:'Multiple Choice',
q:'Annualized Loss Expectancy (ALE) is calculated as:',
opts:['ALE = Single Loss Expectancy (SLE) + Annualized Rate of Occurrence (ARO)','ALE = SLE x ARO','ALE = Asset Value x Exposure Factor x ARO','ALE = (Asset Value - Salvage Value) x ARO'],
ans:1,hint:'ALE represents the expected loss per year from a specific threat.',
correct_fb:'<strong>ALE = SLE x ARO</strong>. Where <strong>SLE (Single Loss Expectancy)</strong> = Asset Value x Exposure Factor (the cost of ONE loss event), and <strong>ARO (Annualized Rate of Occurrence)</strong> = how many times per year the event is expected. Example: server worth $10,000 with 50% exposure factor = SLE of $5,000. If it fails twice per year (ARO=2), ALE = $10,000. This drives security investment decisions.',
wrong_fb:'<strong>ALE = SLE x ARO</strong>. Full formula chain: Asset Value x Exposure Factor = SLE. SLE x ARO = ALE. If ALE ($10,000/year) > cost of control ($2,000/year), implement the control. This is the fundamental cost-benefit analysis of security investment tested throughout the CEH exam.'},

{topic:0,diff:'hard',type:'Multiple Choice',
q:'Which phase of the CEH attack methodology involves setting up rootkits and backdoors for future access?',
opts:['Scanning','Gaining Access','Maintaining Access','Covering Tracks'],
ans:2,hint:'After getting in, an attacker wants to ensure they can return.',
correct_fb:'<strong>Maintaining Access</strong> is where attackers install <strong>rootkits, backdoors, Trojans, and zombie configurations</strong> to preserve future access. This phase also includes privilege escalation. The attacker ensures they can return even if the initial vulnerability is patched. Rootkits hide the attacker\'s presence; backdoors provide re-entry; zombies are compromised machines used for DDoS or other attacks.',
wrong_fb:'<strong>Maintaining Access</strong> = rootkits, backdoors, privilege escalation, and zombie configuration. Gaining Access = initial exploitation (buffer overflow, password crack). Covering Tracks = clearing logs, hiding files, timestomping. Scanning = discovering live hosts, open ports, and vulnerabilities. These phases are sequential and each has specific tools and techniques.'},

{topic:0,diff:'medium',type:'Multiple Choice',
q:'Which type of pen test simulates an external attacker with NO prior knowledge of the target?',
opts:['White-box','Gray-box','Black-box','Crystal-box'],
ans:2,hint:'No knowledge = complete outsider perspective.',
correct_fb:'<strong>Black-box testing</strong> simulates an external attacker with absolutely no prior knowledge of the target. The tester must perform all phases from scratch: reconnaissance, scanning, enumeration, and then exploitation. It takes the most time and is typically most expensive, but provides the most realistic simulation of an external threat. It does NOT simulate internal threats.',
wrong_fb:'<strong>Black-box</strong> = no prior knowledge, simulates external attacker. White-box = full knowledge (credentials, diagrams, source code). Gray-box = partial knowledge (simulates average employee). Crystal-box is another name for white-box. The CEH exam specifically asks which type tests which threat model.'},

{topic:0,diff:'hard',type:'Multiple Choice',
q:'Which of the following is NOT a valid legal document required before a penetration test?',
opts:['Statement of Work (SOW)','Non-Disclosure Agreement (NDA)','Rules of Engagement (ROE)','Certificate of Ethical Hacking (CEH)'],
ans:3,hint:'Three of these are real legal/contractual documents used in pen testing.',
correct_fb:'A <strong>Certificate of Ethical Hacking</strong> is a certification/credential, not a legal document used in an engagement. Required pen test documents include: <strong>SOW</strong> (defines scope and deliverables), <strong>NDA</strong> (protects confidential information discovered), <strong>ROE</strong> (defines what is/isn\'t allowed during testing), and a <strong>written authorization/permission letter</strong>. Without these, testing is illegal.',
wrong_fb:'<strong>CEH certification</strong> is a personal credential, not a legal engagement document. Real required documents: SOW (scope/deliverables), NDA (confidentiality), Rules of Engagement (boundaries), and written authorization. The authorization letter is the most critical  --  it legally protects both the tester and the client. Always get it in writing before touching anything.'},

{topic:0,diff:'medium',type:'Multiple Choice',
q:'What is the Security, Functionality, and Usability triangle in CEH?',
opts:['Adding more security always increases functionality and usability','As security increases, functionality and usability typically decrease  --  there is a balance to strike','Security and usability are always inversely proportional to each other regardless of functionality','Functionality is independent of security and usability'],
ans:1,hint:'Think about what happens to user experience when you add more security controls.',
correct_fb:'The <strong>Security-Functionality-Usability triangle</strong> illustrates that these three elements are in tension. Adding more security controls (authentication, encryption, access restrictions) typically reduces functionality (fewer features available) and usability (harder to use). The goal of security professionals is to find the optimal balance  --  not maximum security at the expense of all functionality.',
wrong_fb:'<strong>The triangle shows trade-offs</strong>: more security -> less functionality and usability. Example: requiring 20-character passwords with MFA (high security) makes systems harder to use. Removing all authentication (maximum functionality/usability) has zero security. Real-world security means finding the acceptable balance for the organization\'s risk tolerance.'},

// -- TOPIC 1: Reconnaissance & Footprinting --
{topic:1,diff:'easy',type:'Multiple Choice',
q:'What is the primary goal of footprinting in ethical hacking?',
opts:['Gaining unauthorized access to target systems','Collecting as much information as possible about the target to plan an attack','Installing malware on target machines','Scanning for open ports on the target network'],
ans:1,hint:'Footprinting is the first step  --  it\'s all about information gathering before any active contact.',
correct_fb:'<strong>Footprinting</strong> (passive reconnaissance) is the systematic process of gathering information about a target  --  IP ranges, domain names, employee names, technologies used, physical locations, and more. The goal is to build a comprehensive picture of the target WITHOUT directly interacting with their systems. This intelligence guides all subsequent attack phases.',
wrong_fb:'<strong>Footprinting = information gathering</strong> about the target. It\'s passive reconnaissance  --  you collect data from public sources (WHOIS, DNS, job postings, social media, Google hacking) without touching the target systems. Active reconnaissance (scanning) comes later. Footprinting provides the intelligence needed to identify attack vectors.'},

{topic:1,diff:'medium',type:'Multiple Choice',
q:'Which Google hacking operator would an attacker use to find all pages on a specific site?',
opts:['inurl:target.com','site:target.com','intext:target.com','link:target.com'],
ans:1,hint:'You want to scope the search specifically to one domain.',
correct_fb:'"<strong>site:target.com</strong>" restricts Google search results to pages hosted on target.com. This is a fundamental Google hacking (Google Dorking) operator. Combined with others: "site:target.com filetype:pdf" finds all PDFs on the site; "site:target.com intext:password" searches for pages containing the word password on that site. The Johnny Long Google Hacking Database (GHDB) contains thousands of useful dorks.',
wrong_fb:'"<strong>site:target.com</strong>" limits results to one domain. Other key operators: <strong>inurl:</strong> searches within URLs, <strong>intitle:</strong> searches page titles, <strong>intext:</strong> searches body text, <strong>filetype:</strong> filters by file type, <strong>cache:</strong> shows cached versions. These "Google dorks" are a major reconnaissance tool tested heavily on the CEH exam.'},

{topic:1,diff:'medium',type:'Multiple Choice',
q:'A colleague searches Google for: intitle:intranet inurl:intranet intext:"finance". What will the results show?',
opts:['All pages with intranet in the URL only','All pages with intranet in title AND URL, AND finance in the page text','All pages having finance in the URL','No results  --  Google hacks cannot be combined'],
ans:1,hint:'Each operator is additive  --  all conditions must be met simultaneously.',
correct_fb:'Google hacking operators are <strong>combined additively</strong>  --  all conditions must match. This search finds pages with "intranet" in the title (<strong>intitle:</strong>) AND "intranet" in the URL (<strong>inurl:</strong>) AND "finance" in the body text (<strong>intext:</strong>). This would surface internal finance intranet pages accidentally indexed by Google  --  extremely valuable reconnaissance data.',
wrong_fb:'Google dork operators can be combined and ALL must match. "<strong>intitle:intranet</strong>" + "<strong>inurl:intranet</strong>" + "<strong>intext:\"finance\"</strong>" = pages where title contains intranet, URL contains intranet, AND body text contains finance. Each operator narrows the result set further. Combining multiple operators is a powerful technique for finding specific sensitive content.'},

{topic:1,diff:'easy',type:'Multiple Choice',
q:'Which tool is commonly used for WHOIS lookups and DNS reconnaissance?',
opts:['Nmap','Netcat','nslookup / dig','Wireshark'],
ans:2,hint:'This is specifically a DNS query tool, not a port scanner or sniffer.',
correct_fb:'<strong>nslookup</strong> and <strong>dig</strong> are standard DNS query tools. They perform forward/reverse DNS lookups, query specific record types (A, MX, NS, TXT, SOA), and can attempt zone transfers. WHOIS lookups reveal domain registration data, nameservers, registrant contact information, and IP range ownership  --  all valuable footprinting data obtainable without touching the target.',
wrong_fb:'<strong>nslookup/dig</strong> = DNS reconnaissance. Nmap = port scanning. Netcat = raw TCP/UDP connections (the "Swiss army knife" of networking). Wireshark = packet capture. For WHOIS: use whois command-line tool or websites like whois.domaintools.com. DNS records to know: A (IPv4), AAAA (IPv6), MX (mail), NS (nameserver), PTR (reverse), SOA (authority), TXT (various), CNAME (alias).'},

{topic:1,diff:'hard',type:'Multiple Choice',
q:'An attacker attempts a DNS zone transfer against a target\'s nameserver. If successful, what information is obtained?',
opts:['Only the A records for the target domain','A complete list of all DNS records in the zone  --  including all hostnames and IP addresses','The administrative password for the DNS server','Only MX records and mail server configurations'],
ans:1,hint:'A zone transfer is designed to replicate the ENTIRE zone file between nameservers.',
correct_fb:'A successful <strong>DNS zone transfer (AXFR)</strong> returns the <strong>complete zone file</strong>  --  all records including A, AAAA, MX, NS, CNAME, TXT, PTR, and SOA records. This gives an attacker a complete map of ALL internal and external hostnames and their IP addresses. Organizations should restrict zone transfers to only authorized secondary nameservers. This is a massive information leak.',
wrong_fb:'<strong>Zone transfer = complete zone file</strong> (all record types). Attackers use "dig axfr @nameserver target.com" or nslookup to attempt this. Properly secured DNS servers restrict zone transfers by IP address. The CEH exam tests zone transfer prevention: use split-horizon DNS, restrict AXFR to trusted IPs only, and implement DNSSEC for record integrity.'},

{topic:1,diff:'medium',type:'Multiple Choice',
q:'Which of the following is an example of PASSIVE reconnaissance?',
opts:['Performing an Nmap port scan against the target','Running Nikto against the target web server','Reading the target company\'s annual report and LinkedIn profiles','Sending crafted packets to enumerate the target\'s OS'],
ans:2,hint:'Passive means you never directly interact with or touch the target systems.',
correct_fb:'<strong>Passive reconnaissance</strong> collects information without directly interacting with the target. Reading public documents (annual reports, press releases, LinkedIn, job postings), WHOIS lookups, DNS queries against public nameservers, and Google hacking are all passive. The target has NO way to detect passive reconnaissance. Active reconnaissance (Nmap, Nikto, sending packets) directly contacts the target and may be logged.',
wrong_fb:'<strong>Passive = no direct contact with target</strong>. Examples: WHOIS, Google dorking, social media research, public DNS queries, Shodan searches, reviewing job postings (reveals technology stack), reading SEC filings. Active = direct contact (Nmap scans, web crawling, sending packets). Passive is completely undetectable; active may generate IDS/firewall alerts.'},

{topic:1,diff:'hard',type:'Multiple Choice',
q:'What does the Wayback Machine (archive.org) allow an attacker to do during reconnaissance?',
opts:['Intercept live web traffic to the target','View historical versions of target websites to find information that may have been removed','Automatically crack passwords from historical data','Map the target\'s physical network infrastructure'],
ans:1,hint:'The internet never forgets  --  removed content may still be cached.',
correct_fb:'The <strong>Wayback Machine (archive.org)</strong> stores historical snapshots of websites. An attacker can view older versions of a target\'s site to find: previously exposed credentials or API keys, old employee directories, deprecated admin pages, removed configuration files, and historical IP addresses. Content removed from a live site today may be preserved in archives for years.',
wrong_fb:'<strong>Wayback Machine = historical web snapshots</strong>. If a company accidentally posted credentials and removed them, the Wayback Machine may still have the cached version. Other useful OSINT sources: Shodan (internet-connected device database), Maltego (relationship mapping), theHarvester (email/domain gathering), LinkedIn (employee enumeration), and Recon-ng (modular reconnaissance framework).'},

{topic:1,diff:'medium',type:'Multiple Choice',
q:'Which tool is specifically designed for email address harvesting and OSINT gathering?',
opts:['Nmap','theHarvester','Metasploit','Aircrack-ng'],
ans:1,hint:'The tool name literally contains the word "harvester".',
correct_fb:'<strong>theHarvester</strong> is an OSINT tool that gathers email addresses, hostnames, IPs, and virtual hosts from public sources including Google, Bing, LinkedIn, Shodan, and others. It\'s a key reconnaissance tool for building target email lists for phishing campaigns and identifying employee information. Usage: "theHarvester -d target.com -b google" to search Google for target.com data.',
wrong_fb:'<strong>theHarvester</strong> = email and OSINT harvesting. Other OSINT tools: <strong>Maltego</strong> (visual relationship mapping), <strong>Recon-ng</strong> (modular framework similar to Metasploit for OSINT), <strong>Shodan</strong> (internet device search engine), <strong>SpiderFoot</strong> (automated OSINT). Nmap = port scanner, Metasploit = exploitation framework, Aircrack-ng = wireless hacking.'},

{topic:1,diff:'hard',type:'Multiple Choice',
q:'What does usufy.py in the OSRFramework do?',
opts:['Verifies if a domain exists across multiple registries','Checks if an email username is registered with email providers','Verifies if a username/profile exists across up to 306 different platforms','Searches for profiles using full names on up to 7 platforms'],
ans:2,hint:'The "usu" in usufy stands for "username".',
correct_fb:'<strong>usufy.py</strong> checks if a username exists across up to 306 social media and online platforms simultaneously. The OSRFramework (Open Sources Research Framework) is a Python-based OSINT toolkit. <strong>domainfy.py</strong> = checks domains, <strong>mailfy.py</strong> = checks email accounts, <strong>searchfy.py</strong> = searches by full name on ~7 platforms. Together they build comprehensive target profiles.',
wrong_fb:'<strong>usufy.py = username verification</strong> across 306+ platforms. OSRFramework tools: usufy.py (usernames, 306 platforms), domainfy.py (domains, 1567+ registries), mailfy.py (email accounts), searchfy.py (full name search, ~7 platforms). This framework is specifically tested on the CEH exam. Similar commercial tools include Maltego and SpiderFoot.'},

{topic:1,diff:'medium',type:'Multiple Choice',
q:'Which Shodan search would help an attacker find unsecured webcams?',
opts:['search:webcam unsecured','has_screenshot:true','Net:webcam port:80','title:"webcam" has_screenshot:true'],
ans:3,hint:'Shodan indexes internet-connected devices  --  combine a title search with a screenshot indicator.',
correct_fb:'Shodan allows searching for internet-connected devices using various filters. "<strong>title:\"webcam\" has_screenshot:true</strong>" finds devices with "webcam" in their title that have screenshots available  --  indicating live, accessible video feeds. Shodan is a powerful reconnaissance tool that indexes service banners, reveals default credentials still in use, exposed industrial control systems, and misconfigured devices.',
wrong_fb:'Shodan filters for finding devices: <strong>title:</strong> (page title), <strong>port:</strong> (specific port), <strong>country:</strong> (by country), <strong>org:</strong> (by organization), <strong>has_screenshot:true</strong> (has a captured image). Shodan is called the "world\'s most dangerous search engine" because it catalogs internet-connected devices without any hacking required  --  pure passive reconnaissance.'},

// -- TOPIC 2: Scanning & Enumeration --
{topic:2,diff:'easy',type:'Multiple Choice',
q:'What type of Nmap scan sends SYN packets but never completes the TCP handshake?',
opts:['Full connect scan (-sT)','SYN stealth scan (-sS)','UDP scan (-sU)','Xmas scan (-sX)'],
ans:1,hint:'This scan is called "stealth" because it never completes the connection.',
correct_fb:'The <strong>SYN scan (-sS)</strong> sends a SYN packet and waits for the response: SYN-ACK = open, RST = closed, no response = filtered. It then sends RST instead of completing the handshake, so no full connection is established. This is the default Nmap scan (requires root privileges). It\'s "stealthy" because many older systems don\'t log half-open connections, though modern IDS/firewalls easily detect it.',
wrong_fb:'<strong>SYN scan (-sS)</strong> = sends SYN, receives SYN-ACK (open) or RST (closed), sends RST (never completes). Full connect (-sT) = completes the handshake, more detectable, used when no raw socket privileges. UDP scan (-sU) = tests UDP ports (slow). Xmas scan (-sX) = sets FIN, PSH, URG flags. SYN scan is the most common Nmap scan on the CEH exam.'},

{topic:2,diff:'medium',type:'Multiple Choice',
q:'Which Nmap scan type sets the FIN, PSH, and URG flags simultaneously?',
opts:['NULL scan (-sN)','FIN scan (-sF)','Xmas scan (-sX)','ACK scan (-sA)'],
ans:2,hint:'Think about what a "lit up Christmas tree" looks like  --  all lights on.',
correct_fb:'The <strong>Xmas scan (-sX)</strong> sets the FIN, PSH, and URG flags  --  "lighting up the packet like a Christmas tree." If the port is open, the target should NOT respond (per RFC 793). If closed, the target sends RST. This scan works against systems following RFC 793 strictly. Windows systems respond with RST for all ports regardless, making Xmas scans ineffective against Windows targets.',
wrong_fb:'<strong>Xmas scan</strong> = FIN + PSH + URG flags. <strong>NULL scan (-sN)</strong> = no flags set. <strong>FIN scan (-sF)</strong> = only FIN flag. These scans exploit the RFC 793 standard: closed ports send RST, open ports send no response. They bypass some stateless packet filters. Important: these scans do NOT work reliably against Windows  --  Windows sends RST for all ports.'},

{topic:2,diff:'medium',type:'Multiple Choice',
q:'What is the purpose of an ACK scan in Nmap (-sA)?',
opts:['To identify open ports by completing the TCP handshake','To map firewall rules  --  determines if ports are filtered or unfiltered, NOT whether they are open','To crash vulnerable services by sending malformed ACK packets','To enumerate SMB shares on Windows systems'],
ans:1,hint:'ACK scan does NOT tell you if a port is open  --  only whether it\'s filtered.',
correct_fb:'The <strong>ACK scan (-sA)</strong> is NOT used to identify open ports  --  it maps <strong>firewall rules</strong>. An ACK packet is sent: if RST is received, the port is <strong>unfiltered</strong> (firewall allows the packet through); if no response (or ICMP unreachable), it\'s <strong>filtered</strong> (firewall blocks it). Use ACK scan to understand what a firewall is blocking. Combine with SYN scan to fully understand the network.',
wrong_fb:'<strong>ACK scan = firewall rule mapping, NOT port status</strong>. RST response = unfiltered (firewall passes the packet). No response = filtered (firewall drops it). The ACK scan cannot distinguish between open and closed ports  --  only filtered vs unfiltered. This is a critical distinction the CEH exam tests frequently.'},

{topic:2,diff:'hard',type:'Scenario',
q:'An Nmap scan returns the following for a port:\n192.168.1.1  80/tcp  open  http\nWhat does this tell you?',
opts:['Port 80 is open and running HTTP, confirmed by three-way handshake','Port 80 appears open based on SYN-ACK response, and the service banner identifies it as HTTP','Port 80 is filtered by a firewall','Port 80 is closed but accessible through NAT'],
ans:1,hint:'Default Nmap scans use SYN and add service detection separately.',
correct_fb:'Open port 80 with "http" service means Nmap received a <strong>SYN-ACK</strong> response (indicating open), and service detection (-sV or banner grabbing) identified the service as HTTP. The default Nmap SYN scan identifies the port state; service version detection probes the service for its banner/version. The output shows port state + service identification.',
wrong_fb:'Nmap "open" = received SYN-ACK. The service label (http) comes from service detection. Port states: <strong>open</strong> (SYN-ACK received), <strong>closed</strong> (RST received), <strong>filtered</strong> (no response or ICMP unreachable), <strong>unfiltered</strong> (accessible but state unknown), <strong>open|filtered</strong> (can\'t tell  --  used for UDP/Xmas/NULL scans on open ports).'},

{topic:2,diff:'medium',type:'Multiple Choice',
q:'Which enumeration technique is used to extract usernames, shares, and services from Windows systems via null sessions?',
opts:['SNMP enumeration','NetBIOS enumeration','DNS enumeration','SMTP enumeration'],
ans:1,hint:'This is specific to Windows networking and uses port 139/445.',
correct_fb:'<strong>NetBIOS enumeration</strong> uses null sessions (anonymous connections) to extract: computer names, usernames, domain information, shares, and services from Windows systems. Tools include: nbtstat, nbtscan, enum4linux, and net view. A null session authenticates with an empty username and password. Modern Windows versions restrict null sessions by default, but misconfigured systems remain vulnerable.',
wrong_fb:'<strong>NetBIOS enumeration</strong> = Windows shares, users, and groups via null sessions. Other enumeration types: SNMP enumeration (community strings reveal device configs), DNS enumeration (zone transfers), SMTP enumeration (VRFY/EXPN commands reveal valid email addresses), LDAP enumeration (Active Directory users/groups). Each uses different ports and protocols.'},

{topic:2,diff:'hard',type:'Multiple Choice',
q:'An attacker uses Nmap with the -O flag. What is the attacker attempting?',
opts:['Open port detection only','Operating System fingerprinting','OSPF route enumeration','Output formatting to XML'],
ans:1,hint:'The -O flag is for a specific type of target identification.',
correct_fb:'<strong>Nmap -O</strong> enables <strong>OS fingerprinting</strong>  --  it analyzes TCP/IP stack behavior (TTL values, window sizes, TCP options, ICMP response characteristics) to determine the target\'s operating system. Accuracy improves with more open and closed ports discovered. Requires root privileges. Combine with -sV (service version detection) for comprehensive target profiling.',
wrong_fb:'<strong>Nmap -O = OS detection</strong>. Common Nmap flags to know: -sS (SYN scan), -sT (TCP connect), -sU (UDP), -sV (version detection), <strong>-O (OS detection)</strong>, -A (aggressive: OS + version + scripts + traceroute), -p (port range), -Pn (skip ping), -n (no DNS), --script (NSE scripts). The CEH exam frequently presents Nmap flags and asks for their purpose.'},

{topic:2,diff:'medium',type:'Multiple Choice',
q:'What SNMP community string is used by default on most network devices and is often left unchanged?',
opts:['private and secret','public and private','admin and password','read and write'],
ans:1,hint:'These are the two most famous default SNMP community strings  --  one for reading, one for writing.',
correct_fb:'Default SNMP community strings are "<strong>public</strong>" (read-only) and "<strong>private</strong>" (read-write). If administrators leave these unchanged, attackers can use them to read device configurations (with "public") or even modify them (with "private"). SNMP v1 and v2c transmit community strings in cleartext  --  easily sniffed. SNMPv3 adds authentication and encryption. Always change defaults.',
wrong_fb:'<strong>public</strong> (read-only) and <strong>private</strong> (read-write) are the default SNMP community strings. Tools like snmpwalk, snmpget, and Metasploit modules can enumerate entire device configurations using these strings. SNMP enumeration reveals: device type, OS version, running interfaces, routing tables, and connected devices. SNMPv3 is the only secure version  --  enforce it on all managed devices.'},

{topic:2,diff:'easy',type:'Multiple Choice',
q:'What is the purpose of the traceroute tool?',
opts:['To capture and analyze network packets','To map the path packets take from source to destination by discovering each hop','To crack passwords using route table information','To scan for open ports on remote systems'],
ans:1,hint:'Trace + route = tracing the route packets take.',
correct_fb:'<strong>Traceroute</strong> maps the path packets travel from source to destination. It works by sending packets with incrementally increasing TTL (Time To Live) values. When TTL=1, the first router sends ICMP "Time Exceeded" back (revealing its IP). TTL=2 reveals the second hop, and so on. This maps the entire route. Linux uses UDP; Windows (tracert) uses ICMP. Useful for network mapping and detecting firewalls.',
wrong_fb:'<strong>Traceroute = route mapping via TTL manipulation</strong>. Each hop decrements TTL by 1; when TTL reaches 0, the router sends ICMP Type 11 (Time Exceeded) back to the source. Linux traceroute uses UDP datagrams; Windows tracert uses ICMP Echo Requests. Firewalls that block ICMP will appear as "* * *" in the output (no response). This is a key reconnaissance tool.'},

{topic:2,diff:'medium',type:'Multiple Choice',
q:'Which tool is used to enumerate SMB shares and users on Linux/Unix systems?',
opts:['netstat','enum4linux','arp -a','ipconfig'],
ans:1,hint:'This tool is specifically designed for SMB/Samba enumeration on non-Windows systems.',
correct_fb:'<strong>enum4linux</strong> is a Linux-based tool for enumerating information from Windows and Samba systems via SMB (ports 139/445). It extracts: usernames, group memberships, share names, password policies, OS information, and printer information. It\'s essentially a wrapper around tools like smbclient, net, nmblookup, and rpcclient. Nessus and Metasploit also include SMB enumeration modules.',
wrong_fb:'<strong>enum4linux</strong> = SMB enumeration on Linux. Windows equivalent tools: nbtstat (NetBIOS stats), net view (list shares), rpcclient (RPC enumeration). For comprehensive SMB enumeration: enum4linux, Metasploit smb_enumshares, and nmap smb-enum-shares NSE script. SMB enumeration reveals attack surface for lateral movement, credential harvesting, and unauthorized share access.'},

// -- TOPIC 3: Sniffing & Evasion --
{topic:3,diff:'easy',type:'Multiple Choice',
q:'Which protocol is most vulnerable to sniffing attacks because it transmits data in cleartext?',
opts:['HTTPS','SSH','Telnet','SFTP'],
ans:2,hint:'This is the predecessor to SSH  --  it was never designed with security in mind.',
correct_fb:'<strong>Telnet</strong> transmits ALL data  --  including usernames, passwords, and commands  --  in <strong>cleartext</strong>. Anyone sniffing the network can capture complete Telnet sessions with tools like Wireshark. Always replace Telnet with SSH for encrypted remote access. Other cleartext protocols: HTTP (use HTTPS), FTP (use SFTP/FTPS), SMTP without TLS (use SMTPS), and SNMP v1/v2c (community strings sent cleartext).',
wrong_fb:'<strong>Telnet = cleartext</strong> (completely insecure). Other cleartext protocols: HTTP, FTP, SMTP (without TLS), POP3, IMAP, SNMPv1/v2c, Rlogin, Rsh. Secure replacements: SSH (Telnet), HTTPS (HTTP), SFTP/FTPS (FTP), SMTPS (SMTP), SNMPv3 (SNMPv1/2c). The CEH exam consistently tests which protocols are insecure and should be replaced.'},

{topic:3,diff:'medium',type:'Multiple Choice',
q:'What technique does MAC flooding use to capture traffic on a switched network?',
opts:['Sends thousands of fake MAC addresses to fill the switch\'s CAM table, causing it to behave like a hub','Modifies ARP tables to redirect traffic through the attacker\'s machine','Injects false DHCP responses to steal IP addresses','Captures traffic by enabling promiscuous mode on the NIC only'],
ans:0,hint:'The goal is to overwhelm the switch\'s memory so it can\'t make intelligent forwarding decisions.',
correct_fb:'<strong>MAC flooding</strong> overwhelms the switch\'s CAM (Content Addressable Memory) table with thousands of fake MAC addresses using tools like macof or Yersinia. When the table is full, the switch enters "fail-open" mode and broadcasts traffic to all ports (behaving like a hub), allowing the attacker to capture all traffic. Mitigation: port security limiting MAC addresses per port.',
wrong_fb:'<strong>MAC flooding = CAM table overflow -> switch acts as hub</strong>. Tools: macof, Yersinia. The CAM table stores MAC-to-port mappings. When full, the switch can\'t make forwarding decisions and floods all frames to all ports. Modern managed switches with port security configured are resistant to this attack. Different from ARP spoofing, which poisons ARP caches rather than CAM tables.'},

{topic:3,diff:'medium',type:'Multiple Choice',
q:'A correct Wireshark filter to capture traffic from IP 192.168.22.5 containing the string "HR_admin" is:',
opts:['ip.addr 192.168.22.5 && "HR_admin"','ip.addr==192.168.22.5 && tcp contains HR_admin','ip.addr 192.168.22.5 &&tcp string==HR_admin','ip.addr==192.168.22.5 + tcp contains HR_admin'],
ans:1,hint:'Wireshark uses == for equality and && for AND, with "contains" for string matching.',
correct_fb:'Correct Wireshark filter: "<strong>ip.addr==192.168.22.5 && tcp contains HR_admin</strong>". Key syntax rules: double equals (==) for comparison, double ampersand (&&) for AND, "contains" for substring matching in TCP payload. Other important filters: ip.src (source IP), ip.dst (destination IP), tcp.port==80, http.request, frame contains "password".',
wrong_fb:'Wireshark filter syntax: <strong>ip.addr==</strong> (double equals), <strong>&&</strong> (AND), <strong>tcp contains</strong> (string match). The "+" operator and single "=" are invalid in Wireshark. Without "==" the filter is invalid. Without "contains" you can\'t search payload strings. Use the expression builder in Wireshark to learn valid syntax. Common exam question: identify the correct vs incorrect filter syntax.'},

{topic:3,diff:'hard',type:'Multiple Choice',
q:'Which technique can an attacker use to capture traffic on a fully switched network without flooding the CAM table?',
opts:['MAC flooding only','ARP spoofing (ARP poisoning)','Enabling promiscuous mode only','DNS poisoning'],
ans:1,hint:'This technique poisons the ARP cache at layer 2 to redirect traffic.',
correct_fb:'<strong>ARP spoofing/poisoning</strong> sends false ARP replies to hosts, associating the attacker\'s MAC address with the gateway\'s IP. Victims send traffic to the attacker (thinking it\'s the gateway), who forwards it to the real gateway  --  a classic <strong>Man-in-the-Middle (MITM)</strong> attack. The switch continues to function normally; the deception happens at the ARP layer. Tools: Ettercap, arpspoof (dsniff), Cain & Abel.',
wrong_fb:'<strong>ARP spoofing = MITM without touching the switch</strong>. The attacker broadcasts fake ARP replies: "I am 192.168.1.1 (gateway), my MAC is [attacker MAC]." Victims update their ARP caches and send traffic to the attacker. Switch continues forwarding normally (based on MAC). Mitigations: Dynamic ARP Inspection (DAI), static ARP entries, VLAN segmentation, using encrypted protocols (SSL/TLS/SSH).'},

{topic:3,diff:'easy',type:'Multiple Choice',
q:'Why is it almost impossible to detect a passive sniffer on a network?',
opts:['Passive sniffers encrypt all captured traffic','A NIC in promiscuous mode only listens and never transmits, generating no detectable traffic','Passive sniffers only run for 30-second intervals','Modern firewalls automatically block all sniffing activity'],
ans:1,hint:'Passive = only receives, never sends. No transmission = no detection.',
correct_fb:'A <strong>passive sniffer</strong> places the NIC in <strong>promiscuous mode</strong> (accepts all packets, not just those addressed to it) and only listens  --  it never transmits anything. With no outgoing traffic generated, there is nothing for IDS or security tools to detect. This is fundamentally different from active attacks that generate traffic. Tools like Wireshark, tcpdump, and dsniff can operate entirely passively.',
wrong_fb:'<strong>Passive sniffing generates no traffic</strong> = nearly undetectable. The NIC in promiscuous mode silently accepts all frames passing on the wire. Detection methods that partially work: watch for NICs in promiscuous mode (locally), send non-broadcast pings and watch for replies (some sniffers respond), monitor ARP caches for changes (indicates ARP spoofing rather than passive sniffing).'},

{topic:3,diff:'hard',type:'Multiple Choice',
q:'An attacker uses IP fragmentation to evade an IDS. How does this work?',
opts:['Large packets bypass IDS because they are too big to inspect','Splitting attack payloads across multiple tiny IP fragments that the IDS cannot reassemble but the target system can','IP fragmentation disables the IDS temporarily','Fragmented packets are automatically permitted by all firewalls'],
ans:1,hint:'The attack payload is split across fragments  --  the IDS sees pieces, not the whole.',
correct_fb:'<strong>IP fragmentation evasion</strong> splits a malicious payload across multiple IP fragments. Some IDS systems inspect individual fragments but cannot reassemble them for full inspection, missing the attack. The target OS reassembles the fragments normally and processes the attack. Tools like fragroute can fragment attacks automatically. Modern IDS/IPS systems perform fragment reassembly to counter this.',
wrong_fb:'<strong>Fragmentation evasion = split payload across fragments</strong>. The IDS sees only harmless-looking individual fragments; the target reassembles them into the complete attack. Other IDS evasion techniques: TTL manipulation (fragments expire at IDS but reach target), polymorphic shellcode (changing attack signature), unicode encoding (web attacks), and session splicing (splitting across TCP segments).'},

{topic:3,diff:'medium',type:'Multiple Choice',
q:'Which two techniques can gather information from a fully switched network? (Choose two)',
opts:['DHCP starvation','MAC flooding','Promiscuous mode only','ARP spoofing'],
ans:1,hint:'Two of these actually capture traffic from a switched network; the others don\'t.',
correct_fb:'<strong>MAC flooding</strong> overwhelms the CAM table, turning the switch into a hub. <strong>ARP spoofing</strong> poisons ARP caches to redirect traffic through the attacker. Both allow traffic capture on switched networks. DHCP starvation is a DoS attack (exhausts DHCP pool)  --  doesn\'t capture traffic. Promiscuous mode alone only captures traffic already reaching your interface (not traffic on other switch segments).',
wrong_fb:'<strong>MAC flooding + ARP spoofing</strong> = the two switched network sniffing techniques. MAC flooding: fill CAM table -> switch floods all ports -> capture all traffic. ARP spoofing: poison ARP caches -> MITM -> capture targeted traffic. DHCP starvation = DoS (no IP addresses for new devices). Promiscuous mode alone = only captures traffic that reaches your port (doesn\'t redirect other hosts\' traffic to you).'},

// -- TOPIC 4: System Hacking --
{topic:4,diff:'easy',type:'Multiple Choice',
q:'Which password attack tries every possible combination of characters until the correct password is found?',
opts:['Dictionary attack','Brute-force attack','Rainbow table attack','Hybrid attack'],
ans:1,hint:'This attack is exhaustive  --  it tries every possible combination.',
correct_fb:'A <strong>brute-force attack</strong> systematically tries every possible character combination until the correct password is found. It is guaranteed to succeed eventually but is extremely time-consuming for complex passwords. Modern GPU-based tools can test billions of combinations per second. Mitigation: use long, complex passwords, account lockout policies, and multi-factor authentication.',
wrong_fb:'<strong>Brute-force</strong> = try every combination (exhaustive). <strong>Dictionary attack</strong> = try words from a wordlist (faster but misses non-word passwords). <strong>Rainbow table</strong> = precomputed hash lookups (fast but defeated by salting). <strong>Hybrid attack</strong> = dictionary + brute-force (adds numbers/symbols to dictionary words). <strong>Pass-the-hash</strong> = use captured NTLM hash without cracking it.'},

{topic:4,diff:'medium',type:'Multiple Choice',
q:'What is a rainbow table attack, and how is it defeated?',
opts:['It uses multiple password dictionaries simultaneously; defeated by using longer passwords','It uses precomputed hash tables to look up password hashes instantly; defeated by password salting','It captures network traffic to extract hashes; defeated by encryption','It generates random passwords until a match is found; defeated by account lockout'],
ans:1,hint:'Precomputed = the work was done beforehand; salting adds randomness to break that.',
correct_fb:'A <strong>rainbow table</strong> is a precomputed lookup table mapping password hashes to plaintext passwords. Instead of computing hashes during the attack, the attacker simply looks up the hash  --  extremely fast. <strong>Salting</strong> defeats rainbow tables by adding a unique random string to each password before hashing. Even if two users have the same password, their salted hashes are completely different, invalidating precomputed tables.',
wrong_fb:'<strong>Rainbow table = precomputed hash-to-password lookups</strong>. Defeat: <strong>salting</strong> (add unique random value per password before hashing). A salt means each password has a unique hash even if passwords are identical. Modern password storage always uses salted hashes (bcrypt, scrypt, Argon2). Unsalted MD5 and SHA1 hashes are trivially broken with rainbow tables  --  never use these for passwords.'},

{topic:4,diff:'hard',type:'Multiple Choice',
q:'In a pass-the-hash attack, what does the attacker use to authenticate?',
opts:['The plaintext password captured from a keylogger','The NTLM hash of the password, without ever knowing the actual plaintext password','A forged Kerberos ticket','A rainbow table lookup result'],
ans:1,hint:'Windows NTLM authentication can accept a hash directly without the plaintext.',
correct_fb:'<strong>Pass-the-hash (PtH)</strong> exploits NTLM authentication: Windows systems accept the <strong>password hash itself</strong> as the credential  --  the plaintext is never needed. An attacker extracts NTLM hashes from memory (using Mimikatz or Metasploit) and uses them directly to authenticate to other systems. Mitigation: Credential Guard, Protected Users group, disabling NTLM, using Kerberos, and network segmentation.',
wrong_fb:'<strong>Pass-the-hash = authenticate with hash, no plaintext needed</strong>. Tool: Mimikatz (extracts hashes from LSASS memory). The hash IS the credential in NTLM. Different from pass-the-ticket (uses Kerberos TGT). Mitigations: Microsoft Credential Guard, Protected Users security group, disabling NTLMv1, restricting admin shares, network segmentation. This is one of the most common lateral movement techniques in enterprise attacks.'},

{topic:4,diff:'medium',type:'Multiple Choice',
q:'What is steganography, and why would an attacker use it?',
opts:['Encrypting files to prevent unauthorized access','Hiding data within another file (image, audio, video) to conceal its existence during exfiltration','Converting binary data to ASCII for transmission','Compressing data to reduce bandwidth usage'],
ans:1,hint:'Steganography is about hiding the very existence of a message, not just securing it.',
correct_fb:'<strong>Steganography</strong> hides secret data within ordinary-looking carrier files (images, audio, video, documents). Unlike encryption (which hides the content but reveals that something is hidden), steganography conceals the existence of the message entirely. An attacker might embed exfiltrated data in an image uploaded to a public website, bypassing DLP tools that don\'t inspect file contents for hidden data.',
wrong_fb:'<strong>Steganography = hiding data within other data</strong>. Example: embed a company\'s source code inside an innocent-looking JPEG and upload it to Imgur. Security tools may not flag the image as suspicious. Tools: steghide, OpenStego, S-Tools. Detection (steganalysis) requires statistical analysis of files. Unlike cryptography (hides meaning), steganography hides the existence of the message.'},

{topic:4,diff:'hard',type:'Multiple Choice',
q:'Which tool is most associated with extracting credentials from Windows memory?',
opts:['John the Ripper','Hashcat','Mimikatz','Aircrack-ng'],
ans:2,hint:'This tool was famously used in major breaches and can dump LSASS memory.',
correct_fb:'<strong>Mimikatz</strong> (created by Benjamin Delpy) extracts credentials from Windows LSASS (Local Security Authority Subsystem Service) process memory. It can dump: plaintext passwords (if WDigest enabled), NTLM hashes, Kerberos tickets, and DPAPI keys. It\'s the primary tool for credential harvesting in Windows environments. Defenders counter with Credential Guard, Protected Users group, and enabling LSA Protection.',
wrong_fb:'<strong>Mimikatz = Windows credential dumping</strong>. What it extracts: plaintext passwords (WDigest), NTLM hashes (pass-the-hash), Kerberos tickets (pass-the-ticket), DPAPI keys. John the Ripper = password cracker (offline hash cracking). Hashcat = GPU-accelerated password cracker. Aircrack-ng = wireless password cracking. Mimikatz is the definitive post-exploitation credential tool for Windows.'},

{topic:4,diff:'medium',type:'Multiple Choice',
q:'What is the purpose of privilege escalation in the system hacking methodology?',
opts:['Acquiring additional user accounts on the network','Elevating access from a standard user account to administrator or root level','Increasing bandwidth allocation for the attacker','Migrating from one compromised system to another'],
ans:1,hint:'The attacker starts with limited access and wants unlimited access.',
correct_fb:'<strong>Privilege escalation</strong> elevates access from a lower-privilege account (standard user) to a higher-privilege account (administrator/root). <strong>Vertical escalation</strong>: user -> administrator (gaining more permissions). <strong>Horizontal escalation</strong>: user A -> user B (different account, same level). Techniques include exploiting SUID binaries (Linux), kernel exploits, DLL injection, token impersonation, and misconfigured services.',
wrong_fb:'<strong>Privilege escalation = gaining higher permissions</strong>. Types: Vertical (user -> admin/root), Horizontal (user to another user\'s level). Common methods: exploiting vulnerable SUID/SGID binaries (Linux), kernel exploits, misconfigured services, DLL hijacking (Windows), token impersonation, and abusing sudo rules. Post-escalation: the attacker typically installs persistence mechanisms (rootkits, backdoors).'},

{topic:4,diff:'easy',type:'Multiple Choice',
q:'What is a keylogger?',
opts:['A tool that logs all open network ports on a system','Software or hardware that records keystrokes, capturing passwords and sensitive data without the user\'s knowledge','A script that automatically generates strong passwords','A tool that monitors Windows event logs for security events'],
ans:1,hint:'Think about what "key" + "logger" literally means.',
correct_fb:'A <strong>keylogger</strong> records every keystroke made on a keyboard  --  capturing usernames, passwords, credit card numbers, messages, and any other typed data. <strong>Software keyloggers</strong> run as background processes (kernel-level or application-level). <strong>Hardware keyloggers</strong> are physical devices inserted between keyboard and computer. Keyloggers are commonly installed via Trojans or physical access.',
wrong_fb:'<strong>Keylogger = records all keystrokes</strong>. Types: software (process running in background  --  harder to detect), hardware (physical device between keyboard and computer  --  hardest to detect without physical inspection). Detection: antivirus, anti-spyware, process monitoring, reviewing startup items. Keyloggers are a primary way attackers steal credentials without cracking hashes.'},

// -- TOPIC 5: Malware & Trojans --
{topic:5,diff:'easy',type:'Multiple Choice',
q:'What is the key difference between a virus and a worm?',
opts:['Viruses are more dangerous than worms','A worm self-replicates and spreads across networks WITHOUT requiring human interaction; a virus requires a host file and user action to spread','Worms only attack Windows systems; viruses attack all systems','Viruses encrypt files; worms delete them'],
ans:1,hint:'The key word is "self-replicating" and "without human interaction."',
correct_fb:'A <strong>worm</strong> self-replicates and propagates across networks <strong>automatically without any user interaction</strong>  --  it exploits network services or vulnerabilities directly. A <strong>virus</strong> requires a host file and typically needs the user to execute the infected file to spread. Famous worms: WannaCry (exploited EternalBlue/MS17-010), Morris Worm, Slammer, Conficker. Worms can spread exponentially within hours.',
wrong_fb:'<strong>Worm = self-replicating, no user action needed</strong>. Virus = attaches to host file, needs user execution. Trojan = disguised as legitimate software. Rootkit = hides malware presence. Ransomware = encrypts files for ransom. Spyware = monitors user activity. Adware = delivers advertisements. The CEH exam tests all these definitions  --  know them precisely.'},

{topic:5,diff:'medium',type:'Multiple Choice',
q:'What is a Trojan horse in the context of malware, and how does it differ from a virus?',
opts:['A Trojan encrypts the hard drive; a virus deletes files','A Trojan disguises itself as legitimate software to trick users into installing it; unlike a virus, it does NOT self-replicate','A Trojan only infects network devices; a virus infects workstations','A Trojan and virus are identical  --  just different names for the same thing'],
ans:1,hint:'The mythological Trojan horse hid warriors inside a gift  --  same concept.',
correct_fb:'A <strong>Trojan horse</strong> disguises itself as legitimate, useful software (a game, tool, PDF) to trick users into installing it. Unlike viruses, Trojans do <strong>NOT self-replicate</strong>. Once installed, Trojans can: create backdoors, log keystrokes, capture screenshots, install additional malware, or exfiltrate data. Examples: RATs (Remote Access Trojans) like DarkComet, njRAT. Distribution: phishing emails, fake downloads, software bundles.',
wrong_fb:'<strong>Trojan = disguised as legitimate software, no self-replication</strong>. Virus = attaches to files, requires user execution to spread, self-replicates. Key Trojan types: RAT (Remote Access Trojan, full control), banking Trojans (steal financial credentials), downloader Trojans (install other malware), proxy Trojans (route traffic through victim). Detection: behavior-based AV, network monitoring for unusual outbound connections.'},

{topic:5,diff:'hard',type:'Multiple Choice',
q:'What is a rootkit, and what makes it particularly dangerous?',
opts:['A tool for remotely accessing routers; dangerous because it uses default credentials','Malware that hides itself and other malware at the OS kernel level; dangerous because it can remain undetected indefinitely and survives reboots','Software that creates fake root accounts; dangerous because it allows unauthorized admin access','A type of ransomware that encrypts the boot sector; dangerous because it prevents startup'],
ans:1,hint:'Think about where "root" access is on a system and what "kit" implies.',
correct_fb:'A <strong>rootkit</strong> operates at the deepest OS level (kernel) to <strong>hide its presence and other malware</strong>. It intercepts OS calls to conceal files, processes, network connections, and registry entries. Highly dangerous because: antivirus tools can\'t detect what the OS hides, it survives reboots, and removing it without reinstalling the OS is extremely difficult. Types: kernel-mode, user-mode, bootloader (bootkits), hypervisor (virtual machine-based).',
wrong_fb:'<strong>Rootkit = stealth malware at kernel level</strong>. It hides itself by intercepting system calls: "show me running processes" -> rootkit removes itself from the list. Types: Kernel-mode (ring 0, most powerful), User-mode (ring 3, easier to detect), Bootloader/MBR rootkits, Hypervisor rootkits (run OS inside VM). Detection: boot from external media, integrity checking, memory forensics. Removal: typically requires OS reinstallation.'},

{topic:5,diff:'medium',type:'Multiple Choice',
q:'What is ransomware, and what was the name of the 2017 ransomware that exploited the EternalBlue vulnerability?',
opts:['Software that demands payment for stolen data; NotPetya','Malware that encrypts victim files and demands payment for the decryption key; WannaCry','A Trojan that deletes files unless a ransom is paid; Mirai','Software that locks the screen; Stuxnet'],
ans:1,hint:'EternalBlue was an NSA exploit leaked by Shadow Brokers in 2017.',
correct_fb:'<strong>Ransomware</strong> encrypts victim files and demands payment (usually cryptocurrency) for the decryption key. <strong>WannaCry</strong> (2017) used the <strong>EternalBlue exploit (MS17-010)</strong>  --  an NSA tool leaked by Shadow Brokers  --  to spread like a worm across unpatched Windows SMB services. It infected 200,000+ systems in 150 countries. Mitigation: patching, offline backups, network segmentation, disabling SMBv1.',
wrong_fb:'<strong>WannaCry = ransomware + EternalBlue (SMBv1 exploit)</strong>. Other notable malware: NotPetya (2017, destructive ransomware also using EternalBlue), Stuxnet (nation-state ICS/SCADA worm targeting Iranian nuclear centrifuges), Mirai (IoT botnet used for DDoS). The CEH exam tests major malware incidents and their technical mechanisms. Always know: EternalBlue = MS17-010 = SMBv1 vulnerability.'},

{topic:5,diff:'hard',type:'Multiple Choice',
q:'A Command and Control (C2) server is used by malware for what purpose?',
opts:['To store encrypted copies of stolen files','To receive instructions from and report data back to the attacker, controlling infected systems (bots)','To decrypt ransomware payments from victims','To patch vulnerabilities on infected systems'],
ans:1,hint:'Think of C2 as the attacker\'s remote control infrastructure.',
correct_fb:'A <strong>C2 (Command and Control)</strong> server is the attacker\'s infrastructure for managing compromised systems (bots/zombies). Malware "phones home" to C2 for: new commands, additional payload downloads, exfiltrating stolen data, and receiving updates. C2 channels include HTTP/S (blends with normal traffic), DNS (covert), social media platforms, and encrypted channels. Detection: monitor for unusual outbound connections and DNS queries.',
wrong_fb:'<strong>C2 = attacker\'s remote management of infected machines</strong>. The botnet (network of compromised systems) awaits commands from C2. Common C2 channels: HTTPS (mimics normal traffic), DNS tunneling (hides in DNS queries), Tor (anonymous), social media APIs (Twitter/GitHub used as C2). Detection: anomalous outbound connections, beaconing patterns, unusual DNS queries. Disrupting C2 breaks the attacker\'s control of the botnet.'},

{topic:5,diff:'easy',type:'Multiple Choice',
q:'What is spyware?',
opts:['Software that displays unwanted advertisements','Malware that secretly monitors user activity and transmits information to a third party','A virus that spreads through email attachments','Software that denies access to a system until ransom is paid'],
ans:1,hint:'Spy + ware = software that spies on you.',
correct_fb:'<strong>Spyware</strong> secretly monitors user activity  --  tracking web browsing, capturing keystrokes, recording screenshots, monitoring application usage  --  and transmits this data to a third party without the user\'s knowledge or consent. It differs from adware (which displays ads). Spyware is often bundled with "free" software. Detection: anti-spyware tools, process monitoring. Examples: FinSpy, FlexiSpy, Pegasus (mobile spyware).',
wrong_fb:'<strong>Spyware = secretly monitors and transmits user activity</strong>. Adware = displays advertisements (may be unwanted but not necessarily malicious). Ransomware = encrypts files. Virus = self-replicating code requiring host file. Spyware types: keyloggers (capture keystrokes), screen recorders, browser hijackers, system monitors. Often installed via drive-by downloads, Trojans, or bundled with free software.'},

// -- TOPIC 6: Wireless Hacking --
{topic:6,diff:'easy',type:'Multiple Choice',
q:'Which wireless security protocol is considered completely broken and should never be used?',
opts:['WPA2-Enterprise','WPA3','WEP','WPA-TKIP'],
ans:2,hint:'This protocol from the late 1990s has been cryptographically broken for decades.',
correct_fb:'<strong>WEP (Wired Equivalent Privacy)</strong> is cryptographically broken. It uses a short 24-bit IV (Initialization Vector), RC4 encryption with flawed key scheduling, and static shared keys. An attacker can crack WEP in minutes by capturing sufficient IVs using tools like Aircrack-ng. WEP was deprecated in 2004. Never use WEP on any network. Use WPA2-AES or WPA3 minimum.',
wrong_fb:'<strong>WEP = completely broken</strong> (crackable in minutes). Security progression: WEP (broken) -> WPA-TKIP (deprecated, vulnerable) -> WPA2-AES (current standard) -> WPA3 (newest, strongest). WEP vulnerabilities: 24-bit IV (too short, reuses quickly), RC4 with weak key scheduling, no per-packet authentication, CRC-32 integrity check easily bypassed. Aircrack-ng can crack WEP with ~50,000 captured IVs.'},

{topic:6,diff:'medium',type:'Multiple Choice',
q:'Which wireless hacking tool is used to capture WPA2 handshakes and crack passwords?',
opts:['Kismet','Aircrack-ng','NetStumbler','Reaver'],
ans:1,hint:'This suite includes airodump-ng for capture and aircrack-ng for cracking.',
correct_fb:'<strong>Aircrack-ng</strong> is the primary wireless password cracking suite. Workflow: (1) airmon-ng to enable monitor mode, (2) airodump-ng to capture traffic and WPA2 4-way handshakes, (3) aireplay-ng for deauthentication attacks (force clients to reconnect, capturing handshakes), (4) aircrack-ng to crack the handshake using dictionary/brute-force. Requires capture of the WPA2 4-way authentication handshake.',
wrong_fb:'<strong>Aircrack-ng = WPA/WEP cracking suite</strong>. Kismet = passive wireless scanner/sniffer (discovers networks without transmitting). NetStumbler = Windows-based WiFi discovery tool (cannot monitor 802.11n). Reaver = WPS PIN brute-force attack (exploits WPS vulnerability). For WPA2: capture handshake with airodump-ng, crack offline with aircrack-ng + wordlist. Know all these tools for the CEH exam.'},

{topic:6,diff:'medium',type:'Multiple Choice',
q:'A victim connects to a malicious access point at a coffee shop that mimics the legitimate network. This is an example of which attack?',
opts:['Jamming signal attack','Evil twin (rogue access point) attack','Bluejacking','War driving'],
ans:1,hint:'The attacker creates a fake AP that looks identical to the real one.',
correct_fb:'An <strong>evil twin attack</strong> (also called a rogue access point or honeypot AP) creates a malicious wireless access point that impersonates a legitimate network. Victims connect thinking it\'s the real coffee shop WiFi. The attacker then performs MITM  --  capturing all traffic, injecting malicious responses, and stealing credentials. Tools: hostapd, airbase-ng, WiFi Pineapple. Prevention: VPN usage on public networks, certificate verification.',
wrong_fb:'<strong>Evil twin = fake AP impersonating legitimate network</strong>. Rogue AP (unauthorized AP on corporate network) and evil twin are closely related but: evil twin specifically mimics an existing network to deceive users. Jamming = disrupting wireless signals (DoS). Bluejacking = sending unsolicited Bluetooth messages. War driving = driving around scanning for wireless networks. The WiFi Pineapple is a popular evil twin tool.'},

{topic:6,diff:'hard',type:'Multiple Choice',
q:'Which of the following statements about WPA2 is TRUE?',
opts:['WPA2 uses RC4 encryption like WEP','WPA2-Personal uses a Pre-Shared Key (PSK) while WPA2-Enterprise uses 802.1X/EAP authentication','WPA2 is vulnerable to IV collision attacks like WEP','WPA2 cannot be cracked using dictionary attacks'],
ans:1,hint:'Two flavors of WPA2 exist  --  one for homes, one for enterprises.',
correct_fb:'<strong>WPA2-Personal (PSK)</strong>: uses a pre-shared passphrase, suitable for home/small business. The 4-way handshake can be captured and the PSK cracked offline via dictionary attack. <strong>WPA2-Enterprise</strong>: uses 802.1X with EAP (RADIUS server), provides per-user authentication with unique credentials  --  no PSK to crack. AES-CCMP encryption (not RC4). KRACK attack affected WPA2 but was mitigated by patching.',
