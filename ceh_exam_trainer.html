<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEH Master Exam Trainer</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1117;--bg2:#161b22;--bg3:#1c2333;--bdr:#30363d;--bdr2:#484f58;--tx:#e6edf3;--tx2:#8b949e;--tx3:#6e7681;--ac:#58a6ff;--acd:#1f3554;--gn:#3fb950;--gnd:#0d2f18;--rd:#f85149;--rdd:#3d1a19;--yw:#d29922;--ywd:#2e2005;--or:#e3b341;--pu:#bc8cff;--pud:#271c40;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--tx);font-family:'Sora',sans-serif;min-height:100vh;line-height:1.6;}
.shell{display:grid;grid-template-columns:260px 1fr;min-height:100vh;}
.sidebar{background:var(--bg2);border-right:1px solid var(--bdr);display:flex;flex-direction:column;}
.logo-wrap{padding:20px 20px 16px;border-bottom:1px solid var(--bdr);}
.logo-tag{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;color:var(--ac);text-transform:uppercase;margin-bottom:4px;}
.logo-title{font-size:16px;font-weight:600;letter-spacing:-.02em;}
.sb-stats{padding:16px 20px;border-bottom:1px solid var(--bdr);display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.sstat{background:var(--bg3);border:1px solid var(--bdr);border-radius:8px;padding:10px 12px;}
.sstat-val{font-size:20px;font-weight:600;font-family:'JetBrains Mono',monospace;}
.sstat-lbl{font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:.08em;margin-top:2px;}
.sb-sec-title{font-size:10px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);padding:16px 20px 8px;}
.dom-list{flex:1;overflow-y:auto;padding:0 12px 12px;}
.dom-btn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:8px 10px;border-radius:6px;border:none;background:transparent;cursor:pointer;font-family:'Sora',sans-serif;font-size:12px;color:var(--tx2);text-align:left;margin-bottom:2px;transition:background .15s,color .15s;}
.dom-btn:hover{background:var(--bg3);color:var(--tx);}
.dom-btn.active{background:var(--acd);color:var(--ac);}
.dom-cnt{font-family:'JetBrains Mono',monospace;font-size:10px;background:var(--bg);padding:1px 6px;border-radius:10px;color:var(--tx3);}
.dom-btn.active .dom-cnt{background:var(--acd);color:var(--ac);}
.main{display:flex;flex-direction:column;min-height:100vh;}
.prog-track{height:3px;background:var(--bg3);}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--ac),var(--pu));transition:width .4s ease;}
.topbar{background:var(--bg2);border-bottom:1px solid var(--bdr);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.topbar-l{display:flex;align-items:center;gap:10px;}
.badge{font-size:11px;font-family:'JetBrains Mono',monospace;padding:3px 10px;border-radius:4px;font-weight:500;}
.bdg-dom{background:var(--pud);color:var(--pu);border:1px solid #3d2970;}
.bdg-easy{background:var(--gnd);color:var(--gn);border:1px solid #1a4a28;}
.bdg-medium{background:var(--ywd);color:var(--yw);border:1px solid #4a3500;}
.bdg-hard{background:var(--rdd);color:var(--rd);border:1px solid #5a2020;}
.timer{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:500;padding:5px 14px;border-radius:6px;background:var(--bg3);border:1px solid var(--bdr);color:var(--tx);min-width:68px;text-align:center;transition:background .3s,border-color .3s;}
.timer.warn{background:var(--ywd);border-color:#6a4800;color:var(--or);}
.timer.danger{background:var(--rdd);border-color:#7a2020;color:var(--rd);animation:pulse .5s ease-in-out infinite alternate;}
@keyframes pulse{from{opacity:1}to{opacity:.6}}
.content{flex:1;padding:28px;max-width:760px;width:100%;margin:0 auto;}
.q-num{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--tx3);margin-bottom:14px;letter-spacing:.06em;}
.q-text{font-size:16px;font-weight:500;line-height:1.7;margin-bottom:22px;padding:20px 22px;background:var(--bg2);border:1px solid var(--bdr);border-radius:10px;border-left:3px solid var(--ac);}
.options{display:flex;flex-direction:column;gap:10px;margin-bottom:20px;}
.opt{display:flex;align-items:flex-start;gap:14px;padding:13px 16px;border:1px solid var(--bdr);border-radius:8px;background:var(--bg2);cursor:pointer;transition:border-color .15s,background .15s;text-align:left;width:100%;font-family:'Sora',sans-serif;}
.opt:hover:not(:disabled){border-color:var(--bdr2);background:var(--bg3);}
.opt-key{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;width:24px;height:24px;border-radius:4px;display:flex;align-items:center;justify-content:center;border:1px solid var(--bdr2);color:var(--tx3);flex-shrink:0;margin-top:1px;}
.opt-text{font-size:14px;color:var(--tx);line-height:1.55;}
.opt.correct{border-color:#2a6e3a;background:var(--gnd);}
.opt.correct .opt-key{border-color:var(--gn);color:var(--gn);background:#0a2014;}
.opt.wrong{border-color:#7a2020;background:var(--rdd);}
.opt.wrong .opt-key{border-color:var(--rd);color:var(--rd);background:#2a0c0c;}
.opt:disabled{cursor:default;}
.explain{padding:16px 18px;background:var(--bg3);border:1px solid var(--bdr);border-radius:8px;border-top:2px solid var(--ac);font-size:13px;color:var(--tx2);line-height:1.7;margin-bottom:20px;animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.explain strong{color:var(--ac);font-weight:500;}
.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.feedback{font-size:13px;font-family:'JetBrains Mono',monospace;font-weight:500;}
.feedback.ok{color:var(--gn);}
.feedback.fail{color:var(--rd);}
.feedback.timeout{color:var(--yw);}
.btn{padding:9px 20px;border-radius:6px;border:1px solid var(--bdr2);background:transparent;cursor:pointer;font-family:'Sora',sans-serif;font-size:13px;font-weight:500;color:var(--tx2);transition:background .15s,color .15s;}
.btn:hover{background:var(--bg3);color:var(--tx);}
.btn-p{background:var(--acd);color:var(--ac);border-color:#2a5a8a;}
.btn-p:hover{background:#1a4a7a;color:#79c0ff;}
.btn-g{background:var(--gnd);color:var(--gn);border-color:#1a4a28;}
.btn-g:hover{background:#0d2e1c;}
.home-hero{text-align:center;padding:40px 20px 32px;}
.home-hero h1{font-size:28px;font-weight:600;letter-spacing:-.03em;margin-bottom:8px;}
.home-hero p{font-size:14px;color:var(--tx2);max-width:480px;margin:0 auto;}
.exam-info{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0;}
.info-card{background:var(--bg2);border:1px solid var(--bdr);border-radius:10px;padding:16px;text-align:center;}
.info-card-val{font-size:22px;font-weight:600;font-family:'JetBrains Mono',monospace;color:var(--ac);}
.info-card-lbl{font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.08em;margin-top:4px;}
.sess-cfg{background:var(--bg2);border:1px solid var(--bdr);border-radius:10px;padding:20px;margin-bottom:20px;}
.sess-cfg h3{font-size:13px;color:var(--tx2);font-weight:500;margin-bottom:14px;letter-spacing:.04em;text-transform:uppercase;}
.cfg-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
.cfg-lbl{font-size:12px;color:var(--tx3);min-width:90px;}
.cfg-btn{font-size:12px;font-family:'JetBrains Mono',monospace;padding:5px 14px;border-radius:4px;border:1px solid var(--bdr2);background:transparent;color:var(--tx2);cursor:pointer;transition:background .1s,color .1s;}
.cfg-btn:hover{background:var(--bg3);color:var(--tx);}
.cfg-btn.active{background:var(--acd);color:var(--ac);border-color:#2a5a8a;}
.start-btn{width:100%;padding:13px;border-radius:8px;border:1px solid #2a5a8a;background:var(--acd);color:var(--ac);font-family:'Sora',sans-serif;font-size:15px;font-weight:600;cursor:pointer;letter-spacing:.02em;transition:background .15s;}
.start-btn:hover{background:#1a4a7a;}
.res-wrap{text-align:center;padding:32px 0 20px;}
.score-circ{width:130px;height:130px;border-radius:50%;border:3px solid var(--bdr);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 20px;}
.score-circ.pass{border-color:var(--gn);box-shadow:0 0 24px #0d2f1860;}
.score-circ.fail{border-color:var(--rd);box-shadow:0 0 24px #3d1a1960;}
.score-pct{font-size:36px;font-weight:600;font-family:'JetBrains Mono',monospace;}
.score-pct.pass{color:var(--gn);}
.score-pct.fail{color:var(--rd);}
.score-sub{font-size:11px;color:var(--tx3);font-family:'JetBrains Mono',monospace;letter-spacing:.06em;margin-top:2px;}
.res-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0;}
.rstat{background:var(--bg2);border:1px solid var(--bdr);border-radius:8px;padding:14px;text-align:center;}
.rstat-val{font-size:22px;font-weight:600;font-family:'JetBrains Mono',monospace;}
.rstat-lbl{font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:.08em;margin-top:3px;}
.dom-breakdown{background:var(--bg2);border:1px solid var(--bdr);border-radius:10px;padding:16px;margin-bottom:20px;text-align:left;}
.db-title{font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:14px;font-weight:500;}
.db-row{margin-bottom:10px;}
.db-row-top{display:flex;justify-content:space-between;font-size:12px;color:var(--tx2);margin-bottom:4px;}
.db-bg{height:4px;background:var(--bg3);border-radius:2px;overflow:hidden;}
.db-fill{height:100%;border-radius:2px;transition:width .5s ease;}
.res-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.hist-box{margin-top:20px;background:var(--bg2);border:1px solid var(--bdr);border-radius:10px;padding:16px;}
.hist-title{font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:12px;font-weight:500;}
.hist-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:3px;}
@media(max-width:720px){.shell{grid-template-columns:1fr;}.sidebar{display:none;}.content{padding:16px;}.topbar{padding:12px 16px;}}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="logo-wrap">
      <div class="logo-tag">EC-Council</div>
      <div class="logo-title">CEH Master Trainer</div>
    </div>
    <div class="sb-stats">
      <div class="sstat"><div class="sstat-val" id="ss-total">0</div><div class="sstat-lbl">Attempted</div></div>
      <div class="sstat"><div class="sstat-val" id="ss-correct">0</div><div class="sstat-lbl">Correct</div></div>
      <div class="sstat"><div class="sstat-val" id="ss-score">&mdash;</div><div class="sstat-lbl">Score</div></div>
      <div class="sstat"><div class="sstat-val" id="ss-bank">0</div><div class="sstat-lbl">In bank</div></div>
    </div>
    <div class="sb-sec-title">Domains</div>
    <div class="dom-list" id="dom-list"></div>
  </aside>
  <div class="main">
    <div class="prog-track"><div class="prog-fill" id="prog" style="width:0%"></div></div>
    <div class="topbar">
      <div class="topbar-l" id="tb-badges"></div>
      <div style="display:flex;align-items:center;gap:12px;">
        <span id="tb-counter" style="font-family:'JetBrains Mono',monospace;font-size:12px;color:#6e7681;"></span>
        <div class="timer" id="timer">&mdash;</div>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>
<script>
var QB = [{"d": "Footprinting & Recon", "diff": "medium", "q": "A penetration tester wants to harvest email addresses and employee names from a target organization using OSINT. Which tool is designed specifically for this purpose?", "o": ["Nmap", "Maltego", "theHarvester", "Shodan"], "c": 2, "e": "theHarvester collects email addresses, subdomains, hosts, and employee names from public sources including search engines, LinkedIn, and PGP key servers. Maltego is a link-analysis platform, Nmap is a port scanner, and Shodan searches for internet-connected devices."}, {"d": "Footprinting & Recon", "diff": "easy", "q": "Which DNS record type identifies the authoritative mail servers for a domain?", "o": ["A", "CNAME", "MX", "NS"], "c": 2, "e": "MX (Mail Exchanger) records specify which mail servers handle email delivery for a domain. During footprinting, MX records reveal the email infrastructure such as Exchange or Google Workspace, which can indicate the organization security posture."}, {"d": "Footprinting & Recon", "diff": "medium", "q": "An attacker uses Google dorking with site:target.com filetype:pdf to find sensitive files. What category of reconnaissance is this?", "o": ["Active Recon", "Passive Recon", "Social Engineering", "Network Scanning"], "c": 1, "e": "Google dorking is passive reconnaissance because it queries publicly available search engine indexes without directly touching the target systems. Active reconnaissance involves direct interaction with target systems such as port scanning."}, {"d": "Footprinting & Recon", "diff": "hard", "q": "Which WHOIS database stores registration records for .com and .net domains?", "o": ["ARIN", "RIPE NCC", "VeriSign/Internic", "APNIC"], "c": 2, "e": "VeriSign through Internic is the authoritative WHOIS database for .com and .net generic top-level domains. ARIN manages IP allocations in North America, RIPE NCC covers Europe and the Middle East, and APNIC covers Asia-Pacific."}, {"d": "Footprinting & Recon", "diff": "medium", "q": "A tester runs traceroute against a target and observes each hop. What information is primarily gathered?", "o": ["Open ports on the target", "Network path and router IPs", "Target OS fingerprint", "Active directory structure"], "c": 1, "e": "Traceroute maps the network path between source and target by sending packets with incrementing TTL values. Each hop reveals routers and network infrastructure, which can help identify firewalls, load balancers, and ISP boundaries."}, {"d": "Footprinting & Recon", "diff": "hard", "q": "Which tool is used for passive DNS reconnaissance and can reveal historical DNS record changes for a domain?", "o": ["DNSRecon", "PassiveDNS and SecurityTrails", "dig", "host"], "c": 1, "e": "Passive DNS services like SecurityTrails, CIRCL Passive DNS, and Farsight DNSDB store historical DNS data collected from sensors, allowing researchers to see previous IP addresses, subdomains, and record changes without actively querying the target."}, {"d": "Footprinting & Recon", "diff": "easy", "q": "What technique involves searching job postings from a target company to learn about their technology stack?", "o": ["OPSEC Analysis", "Competitive Intelligence", "Job Site Recon", "Banner Grabbing"], "c": 2, "e": "Analyzing job postings reveals the target technology stack, security tools in use, and staff expertise levels. For example a job ad requiring knowledge of Cisco ASA and Splunk reveals defensive tools in use. This is a passive footprinting technique requiring no interaction with the target."}, {"d": "Footprinting & Recon", "diff": "medium", "q": "Maltego is primarily used during which phase of ethical hacking?", "o": ["Gaining Access", "Footprinting and Reconnaissance", "Maintaining Access", "Covering Tracks"], "c": 1, "e": "Maltego is a visual link-analysis and data-mining tool used during footprinting to map relationships between people, companies, domains, IP addresses, and other entities using OSINT data sources."}, {"d": "Footprinting & Recon", "diff": "hard", "q": "An attacker uses Shodan to find internet-connected industrial control systems. What makes Shodan different from traditional search engines?", "o": ["It indexes web page content", "It crawls the dark web", "It scans and indexes internet-connected device banners and services", "It only indexes social media profiles"], "c": 2, "e": "Shodan continuously scans the entire IPv4 internet space and indexes banners and metadata from responding services including HTTP, FTP, SSH, Telnet, and SCADA. Unlike Google which indexes web content, Shodan indexes device and service metadata."}, {"d": "Footprinting & Recon", "diff": "medium", "q": "Which footprinting technique involves collecting information from social media platforms about a target organization employees?", "o": ["Network Footprinting", "Social Media OSINT", "Competitive Intelligence", "Website Footprinting"], "c": 1, "e": "Social media OSINT involves collecting information from platforms like LinkedIn, Twitter, Facebook, and Instagram. This can reveal employee names, roles, travel schedules, technologies used, and information inadvertently disclosed through posts."}, {"d": "Footprinting & Recon", "diff": "hard", "q": "What is the primary purpose of performing a DNS zone transfer (AXFR) during footprinting?", "o": ["Find open ports on DNS servers", "Enumerate all DNS records for a domain", "Perform a DoS on the DNS server", "Hijack DNS queries"], "c": 1, "e": "A DNS zone transfer replicates all DNS records from a primary to a secondary DNS server. If misconfigured to allow transfers from any host, attackers can enumerate all subdomains, mail servers, and IP addresses for a complete map of the target infrastructure."}, {"d": "Scanning Networks", "diff": "medium", "q": "During a TCP SYN scan, an attacker receives a SYN-ACK response. What does the attacker send next to remain stealthy?", "o": ["ACK", "FIN", "RST", "SYN"], "c": 2, "e": "In a SYN half-open scan, after receiving a SYN-ACK the attacker sends RST to tear down the connection before it fully establishes. This avoids the connection being logged by many application-layer logging systems since the TCP handshake never completes."}, {"d": "Scanning Networks", "diff": "easy", "q": "What Nmap flag enables OS detection?", "o": ["-sV", "-O", "-sS", "-A"], "c": 1, "e": "The -O flag enables OS detection in Nmap using TCP/IP stack fingerprinting. The -sV flag performs service version detection, -sS is a SYN scan, and -A enables aggressive mode combining OS detection, version detection, scripts, and traceroute."}, {"d": "Scanning Networks", "diff": "hard", "q": "An attacker sends TCP packets with the FIN, URG, and PSH flags all set simultaneously. What type of scan is this?", "o": ["NULL Scan", "FIN Scan", "Xmas Scan", "Maimon Scan"], "c": 2, "e": "An Xmas scan sets FIN, URG, and PSH flags simultaneously. On closed ports RFC-compliant systems respond with RST. On open ports there is no response. This scan does not work reliably on Windows systems."}, {"d": "Scanning Networks", "diff": "medium", "q": "Which Nmap scan sends no flags in the TCP header to probe for open ports?", "o": ["FIN Scan", "NULL Scan", "Xmas Scan", "ACK Scan"], "c": 1, "e": "A NULL scan sends TCP packets with no flags set. On closed ports RFC-compliant systems respond with RST. On open or filtered ports there is no response. Like Xmas scans, NULL scans bypass some stateless firewalls but do not work reliably on Windows."}, {"d": "Scanning Networks", "diff": "medium", "q": "What does an ACK scan primarily help determine?", "o": ["Which ports are open", "Which services are running", "Whether a firewall is stateful or stateless", "The OS of the target"], "c": 2, "e": "ACK scans are used to map firewall rules. If an RST is received the port is unfiltered. If no response or ICMP unreachable is received, the port is filtered. ACK scans cannot distinguish between open and closed ports."}, {"d": "Scanning Networks", "diff": "easy", "q": "Which protocol does Nmap use by default when performing a ping sweep on a local network to discover live hosts?", "o": ["TCP SYN", "UDP", "ICMP Echo Request", "ARP"], "c": 3, "e": "On a local network, Nmap uses ARP requests for host discovery since ARP is highly reliable at the LAN level and cannot be blocked by host firewalls. On remote networks Nmap uses ICMP echo, TCP SYN to port 443, TCP ACK to port 80, and ICMP timestamp."}, {"d": "Scanning Networks", "diff": "hard", "q": "An attacker uses a zombie host to perform a port scan so their IP address is never revealed. What is this technique called?", "o": ["Decoy Scan", "Idle/IPID Scan", "Proxy Scan", "Fragmented Scan"], "c": 1, "e": "The Idle IPID scan uses a zombie host with a predictable IP ID sequence. The attacker sends spoofed SYN packets appearing to come from the zombie to the target, then probes the zombie IPID counter. Changes in IPID reveal which target ports are open without the attacker IP ever contacting the target."}, {"d": "Scanning Networks", "diff": "medium", "q": "What is the primary purpose of a vulnerability scanner like Nessus during the scanning phase?", "o": ["Exploit vulnerabilities automatically", "Identify and categorize known vulnerabilities in target systems", "Perform password cracking", "Map network topology"], "c": 1, "e": "Vulnerability scanners like Nessus, OpenVAS, and Qualys identify, categorize, and prioritize known vulnerabilities in systems and applications by comparing discovered service versions and configurations against CVE databases and vendor advisories."}, {"d": "Scanning Networks", "diff": "hard", "q": "Which technique involves sending packets split across multiple fragments to evade IDS and firewall inspection during scanning?", "o": ["Decoy Scanning", "IP Fragmentation", "TTL Manipulation", "Source Routing"], "c": 1, "e": "IP fragmentation splits packets into smaller pieces. Some IDS and firewalls may not reassemble fragments before inspection, potentially missing signatures that span fragment boundaries. The Nmap -f flag enables fragment scanning for this purpose."}, {"d": "Scanning Networks", "diff": "medium", "q": "A tester discovers a port responding but cannot determine if it is open or filtered. What Nmap state represents this?", "o": ["Closed", "Open", "Open|Filtered", "Unresponsive"], "c": 2, "e": "Nmap reports open|filtered when it cannot determine whether a port is open or filtered, typically with UDP scans, FIN/NULL/Xmas scans, and other types where an open port and a filtered port produce the same response (no response)."}, {"d": "Scanning Networks", "diff": "easy", "q": "Which Nmap command performs a full TCP connect scan on all 65535 ports with service version detection?", "o": ["nmap -sS -p-", "nmap -sT -p- -sV", "nmap -sU -sV", "nmap -O -p 1-1024"], "c": 1, "e": "nmap -sT -p- -sV performs a full TCP connect scan on all ports with service version detection. A full connect scan completes the three-way handshake and is reliable but more easily detected and logged than a SYN scan."}, {"d": "Enumeration", "diff": "hard", "q": "Which SNMP versions transmit community strings in cleartext?", "o": ["SNMPv1 only", "SNMPv3 only", "Both SNMPv1 and SNMPv2c", "SNMPv2c and SNMPv3"], "c": 2, "e": "Both SNMPv1 and SNMPv2c transmit community strings in plaintext, making them vulnerable to network sniffing. SNMPv3 introduced authentication (MD5/SHA) and encryption (DES/AES) to address these weaknesses."}, {"d": "Enumeration", "diff": "medium", "q": "Which tools are commonly used to enumerate NetBIOS names, users, and shares on Windows systems?", "o": ["Nmap", "enum4linux", "nbtscan", "Both enum4linux and nbtscan"], "c": 3, "e": "Both enum4linux and nbtscan are used for Windows/Samba enumeration. Enum4linux wraps smbclient, rpcclient, and net to enumerate users, shares, groups, and policies. Nbtscan scans networks for NetBIOS name information."}, {"d": "Enumeration", "diff": "easy", "q": "What protocol on port 389 is commonly targeted during enumeration to extract directory information?", "o": ["SNMP", "LDAP", "NTP", "SMTP"], "c": 1, "e": "LDAP (Lightweight Directory Access Protocol) on port 389 stores directory information including user accounts, groups, computers, and policies. Unauthenticated LDAP queries or weak anonymous binds can expose sensitive directory data."}, {"d": "Enumeration", "diff": "medium", "q": "What type of information can be gathered by establishing a null session to the IPC$ share on older Windows systems?", "o": ["Kernel version", "User accounts, share names, and group policies", "Encryption keys", "Browser history"], "c": 1, "e": "A null session connecting to the IPC$ share with empty credentials on older Windows systems allows unauthenticated enumeration of users, groups, shares, password policies, and local security policy. Modern Windows defaults deny null session enumeration."}, {"d": "Enumeration", "diff": "hard", "q": "During NFS enumeration, an attacker discovers a share exported with no_root_squash. What security risk does this present?", "o": ["The share allows anonymous access", "Root on the attacker system has root access on the NFS share", "The share is read-only", "NFS encryption is disabled"], "c": 1, "e": "no_root_squash means that root on the client machine is also treated as root on the NFS server rather than being mapped to nfsnobody. This allows an attacker with root on their system to read and write files as root on the NFS share."}, {"d": "Enumeration", "diff": "medium", "q": "Which tool performs SMTP enumeration by testing VRFY, EXPN, and RCPT TO commands to discover valid email addresses?", "o": ["smtp-user-enum", "Metasploit smtp_enum", "Nmap smtp-enum-users script", "All of the above"], "c": 3, "e": "SMTP enumeration can be performed with smtp-user-enum, Metasploit smtp_enum module, and Nmap smtp-enum-users NSE script. These tools use VRFY, EXPN, and RCPT TO commands to determine if specific usernames exist on the mail server."}, {"d": "Enumeration", "diff": "easy", "q": "Which Windows command displays all active connections, listening ports, and their associated process IDs?", "o": ["ipconfig /all", "netstat -ano", "nbtstat -a", "arp -a"], "c": 1, "e": "netstat -ano displays all active TCP connections, shows addresses numerically, and includes process IDs. This helps identify listening services, established connections, and the processes behind them."}, {"d": "Enumeration", "diff": "hard", "q": "What is DNSSEC zone walking and why is it a security concern?", "o": ["Sending recursive DNS queries to enumerate records", "Exploiting NSEC records to enumerate all zone records", "Poisoning DNS cache to redirect traffic", "Performing a DoS on authoritative DNS servers"], "c": 1, "e": "DNSSEC uses NSEC (Next Secure) records to provide authenticated denial of existence. However NSEC records form a chain linking all records alphabetically. Attackers can walk this chain to enumerate all DNS names in the zone without performing a zone transfer."}, {"d": "Enumeration", "diff": "medium", "q": "Which protocol on port 123 can be queried to potentially reveal a list of internal IP addresses that have recently synchronized with a server?", "o": ["NTP", "SNMP", "NetBIOS", "RPC"], "c": 0, "e": "NTP on port 123 can be queried using the monlist command which returns a list of the last 600 hosts that synchronized with the NTP server, potentially revealing internal IP addresses and network infrastructure. This was also abused in NTP amplification DDoS attacks."}, {"d": "Enumeration", "diff": "hard", "q": "What does an exposed portmapper service on port 111 allow an attacker to enumerate?", "o": ["Gain direct root access", "RPC service names mapped to their port numbers", "Enable MITM attacks", "Allow DNS hijacking"], "c": 1, "e": "The portmapper/rpcbind service on port 111 maps RPC program numbers to the actual port numbers where services are listening. This allows attackers to enumerate all RPC services such as NFS, NIS, and mountd even if those services are on high or random ports."}, {"d": "Enumeration", "diff": "medium", "q": "Which command enumerates Windows shares via SMB from a Linux system?", "o": ["nmap -p 445 target", "smbclient -L //target", "net view target", "nessus -scan target"], "c": 1, "e": "smbclient -L //target enumerates shared resources via SMB from a Linux system. From Windows you would use net view. Nmap can also list shares using the smb-enum-shares NSE script with nmap --script smb-enum-shares target."}, {"d": "System Hacking", "diff": "medium", "q": "An attacker captures an NTLM hash and authenticates to a service without cracking it. What is this technique?", "o": ["Brute Force", "Pass-the-Hash", "Replay Attack", "Golden Ticket"], "c": 1, "e": "Pass-the-Hash uses captured NTLM hash values to authenticate directly to network services without needing the plaintext password. Mimikatz and Impacket psexec.py are commonly used tools. It exploits the NTLM challenge-response mechanism."}, {"d": "System Hacking", "diff": "hard", "q": "Which file must be obtained alongside the SAM database to decrypt Windows password hashes?", "o": ["NTDS.dit", "SYSTEM hive", "SECURITY hive", "passwd"], "c": 1, "e": "The SAM database is encrypted using the SysKey which is derived from the SYSTEM registry hive. Both the SAM file and the SYSTEM hive are required to extract and crack NTLM password hashes. The SECURITY hive contains cached domain credentials."}, {"d": "System Hacking", "diff": "medium", "q": "A hacker installs a keylogger and uploads captured data to a remote server every hour. Which phase of the hacking methodology does this represent?", "o": ["Gaining Access", "Escalation of Privilege", "Maintaining Access", "Covering Tracks"], "c": 2, "e": "Installing a keylogger and establishing persistence represents the Maintaining Access phase. This involves deploying backdoors, keyloggers, remote access tools, and rootkits to ensure continued access even if the initial vulnerability is patched."}, {"d": "System Hacking", "diff": "hard", "q": "Which Metasploit Meterpreter command moves the session into another running process for stability?", "o": ["run post/multi/manage/migrate", "migrate PID", "load incognito", "getsystem"], "c": 1, "e": "The migrate command in Meterpreter moves the session into another running process. Migrating to a stable process like explorer.exe or svchost.exe provides persistence if the exploited application crashes and can grant higher privileges if migrating to a SYSTEM-level process."}, {"d": "System Hacking", "diff": "medium", "q": "What is the purpose of privilege escalation in the system hacking phase?", "o": ["To crash the target system", "To gain higher-level permissions than initially obtained", "To hide malicious activities", "To maintain access after a reboot"], "c": 1, "e": "Privilege escalation involves gaining higher-level permissions than initially obtained. Vertical escalation moves from low-privileged user to admin or root. Horizontal escalation moves laterally to access other user accounts at the same privilege level."}, {"d": "System Hacking", "diff": "hard", "q": "Which Windows vulnerability allows a low-privileged user to gain SYSTEM privileges by abusing unquoted service paths?", "o": ["DLL Hijacking", "Unquoted Service Path", "Token Impersonation", "Scheduled Task Abuse"], "c": 1, "e": "When a Windows service executable path contains spaces and is not enclosed in quotes, Windows searches for the executable from the leftmost space. An attacker can place a malicious executable in an intermediate path and have it execute as SYSTEM when the service starts."}, {"d": "System Hacking", "diff": "easy", "q": "Which tool is used to dump password hashes and credentials from Windows memory?", "o": ["Wireshark", "Mimikatz", "Netcat", "John the Ripper"], "c": 1, "e": "Mimikatz is a credential-dumping tool that extracts plaintext passwords, NTLM hashes, and Kerberos tickets from Windows memory via the LSASS process. It is used for Pass-the-Hash and Pass-the-Ticket attacks."}, {"d": "System Hacking", "diff": "medium", "q": "An attacker deletes Windows event logs and command history after compromising a system. What phase is this?", "o": ["Gaining Access", "Maintaining Access", "Covering Tracks", "Scanning"], "c": 2, "e": "Deleting log files represents the Covering Tracks phase. Attackers clear Windows Event Logs, delete command history, remove installed tools, and use techniques like log tampering, timestomping, and rootkits to hide evidence of compromise."}, {"d": "System Hacking", "diff": "hard", "q": "Which Windows security feature uses virtualization-based security to isolate LSASS and prevent credential dumping?", "o": ["BitLocker", "Windows Defender", "Credential Guard", "AppLocker"], "c": 2, "e": "Windows Credential Guard uses virtualization-based security and a hypervisor to isolate the LSASS process in a protected virtual environment. This prevents tools like Mimikatz from extracting NTLM hashes and Kerberos tickets from memory."}, {"d": "System Hacking", "diff": "medium", "q": "What is a Golden Ticket attack in Kerberos?", "o": ["Forging a TGS to access specific services", "Forging a TGT using the krbtgt hash to gain unlimited access", "Replaying a captured TGS to authenticate", "Brute-forcing the KDC password"], "c": 1, "e": "A Golden Ticket attack involves forging a Kerberos TGT using the krbtgt account NTLM hash. Since the KDC trusts TGTs signed with the krbtgt hash, a forged ticket grants the attacker any privileges for any service in the domain, often persisting even after password changes."}, {"d": "System Hacking", "diff": "hard", "q": "Which Linux privilege escalation technique exploits SUID binaries?", "o": ["Writing to /etc/passwd", "Finding SUID files that can execute arbitrary commands", "Modifying crontabs", "Abusing sudo misconfigurations"], "c": 1, "e": "SUID binaries run with the file owner privileges (often root) regardless of who executes them. If a SUID binary has a vulnerability such as calling system() without a full path or is a known GTFOBin, an attacker can exploit it to execute arbitrary commands as root."}, {"d": "Malware Threats", "diff": "easy", "q": "Which type of malware disguises itself as legitimate software but executes malicious code once installed?", "o": ["Worm", "Virus", "Trojan Horse", "Spyware"], "c": 2, "e": "A Trojan Horse masquerades as legitimate or useful software. Unlike viruses and worms it does not self-replicate. Once executed it can create backdoors, download additional malware, steal data, or give the attacker remote control."}, {"d": "Malware Threats", "diff": "medium", "q": "What distinguishes a worm from a traditional virus?", "o": ["Worms require user interaction to spread", "Worms self-replicate across networks without requiring a host file", "Worms always encrypt user data", "Worms only target mobile devices"], "c": 1, "e": "A worm self-replicates and spreads across networks autonomously without needing to attach to a host file or requiring user interaction. Famous examples include WannaCry, Slammer, and Conficker. A traditional virus requires a host file and typically needs user action to spread."}, {"d": "Malware Threats", "diff": "hard", "q": "Which type of rootkit operates in ring 0 kernel mode and is the most difficult to detect?", "o": ["User-mode Rootkit", "Kernel-mode Rootkit", "Hypervisor Rootkit", "Bootloader Rootkit"], "c": 1, "e": "Kernel-mode rootkits run at the same privilege level as the OS kernel. They can intercept and modify kernel calls, hide processes, files, and network connections at the kernel level. Detection typically requires out-of-band analysis or booting from trusted media."}, {"d": "Malware Threats", "diff": "medium", "q": "A malware sample checks for VM registry keys like VBOX and VMware before executing its payload. What technique is this?", "o": ["Code Obfuscation", "Anti-Debugging", "Anti-VM/Sandbox Evasion", "Polymorphism"], "c": 2, "e": "Anti-VM/sandbox evasion techniques detect virtualized environments used by security researchers and AV sandboxes. Checks include CPUID responses, hardware identifiers, registry keys, running processes, and MAC address prefixes. If a VM is detected, the malware may stay dormant or self-delete."}, {"d": "Malware Threats", "diff": "hard", "q": "What is the difference between a polymorphic and a metamorphic virus?", "o": ["Polymorphic is larger; metamorphic is smaller", "Polymorphic encrypts its code with a changing key; metamorphic rewrites its entire code each generation", "Metamorphic uses a fixed encryption key; polymorphic changes file names", "They are identical"], "c": 1, "e": "Polymorphic malware encrypts its payload with a different key each generation but retains a detectable decryption routine. Metamorphic malware completely rewrites its own code each generation by changing instructions, reordering code, and substituting equivalents with no fixed decryption stub."}, {"d": "Malware Threats", "diff": "medium", "q": "Which C2 technique embeds malicious communications within normal DNS queries to evade detection?", "o": ["HTTP Beaconing", "DNS Tunneling", "ICMP Tunneling", "SMB C2"], "c": 1, "e": "DNS tunneling embeds malicious data in DNS query and response fields. Since DNS traffic is rarely blocked and seldom deeply inspected it is an effective exfiltration and C2 channel. Tools like iodine and dnscat2 implement DNS tunneling."}, {"d": "Malware Threats", "diff": "easy", "q": "What is ransomware primarily designed to do?", "o": ["Steal credentials", "Encrypt user data and demand payment for decryption", "Monitor user activity", "Spread to all network devices"], "c": 1, "e": "Ransomware encrypts victim files or locks systems and demands a ransom in cryptocurrency for the decryption key. Modern ransomware-as-a-service variants like LockBit also exfiltrate data, threatening to publish it if the ransom is not paid."}, {"d": "Malware Threats", "diff": "hard", "q": "Which malware analysis technique involves executing the sample in an isolated environment and monitoring its behavior?", "o": ["Static Analysis", "Dynamic Analysis", "Code Signing", "Fuzzing"], "c": 1, "e": "Dynamic behavioral analysis executes the malware in a controlled isolated environment such as Cuckoo, Any.run, or Joe Sandbox, and monitors file system changes, registry modifications, network connections, and API calls to understand the malware behavior."}, {"d": "Malware Threats", "diff": "medium", "q": "A Trojan creates a scheduled task to run at startup. Which Windows artifact would an analyst examine first?", "o": ["HKLM CurrentControlSet Services", "Task Scheduler at C:\\Windows\\System32\\Tasks", "Windows Firewall rules", "Browser history"], "c": 1, "e": "Windows Task Scheduler and task XML files in the System32/Tasks directory are key persistence locations. Analysts also check HKLM and HKCU Run keys, startup folders, services, WMI subscriptions, and DLL hijacking paths."}, {"d": "Malware Threats", "diff": "hard", "q": "What is fileless malware and why is it particularly difficult to detect?", "o": ["Malware with no icon or UI", "Malware that operates entirely in memory using legitimate system tools", "Malware stored in hidden partitions", "Malware that deletes itself after execution"], "c": 1, "e": "Fileless malware operates entirely in memory and leverages legitimate system tools like PowerShell or WMI to execute malicious code without writing to disk. Since it never writes a file, traditional file-based antivirus scans miss it. Detection requires memory forensics and behavioral analytics."}, {"d": "Malware Threats", "diff": "medium", "q": "Which network behavior most strongly indicates a compromised host is part of a botnet?", "o": ["Increased CPU usage", "Regular beaconing to a C2 server at periodic intervals", "Unusual registry modifications", "Large file creation"], "c": 1, "e": "Botnet-compromised hosts exhibit regular beaconing - periodic outbound connections to a C2 server at consistent intervals. Network monitoring tools can detect this pattern through flow analysis. C2 communications are often disguised as legitimate HTTP or DNS traffic."}, {"d": "Sniffing", "diff": "medium", "q": "Which sniffing attack sends gratuitous ARP replies to associate the attacker MAC address with a legitimate IP address?", "o": ["MAC Flooding", "DNS Poisoning", "ARP Poisoning", "DHCP Starvation"], "c": 2, "e": "ARP Poisoning sends unsolicited ARP replies mapping the attacker MAC address to a legitimate IP such as the default gateway. Victims update their ARP cache, redirecting traffic to the attacker. This enables MitM attacks on switched networks using tools like Ettercap and arpspoof."}, {"d": "Sniffing", "diff": "hard", "q": "In a MAC flooding attack, what is the attacker trying to achieve on a network switch?", "o": ["Crash the switch", "Force the switch into hub mode to broadcast all frames", "Overload the switch with large frames", "Corrupt the switch firmware"], "c": 1, "e": "CAM table flooding sends thousands of frames with random fake MAC addresses, filling the switch Content Addressable Memory table. When the CAM table is full the switch fails open and forwards frames out all ports, behaving like a hub and allowing passive sniffing."}, {"d": "Sniffing", "diff": "medium", "q": "Which tool is the most widely used for network packet capture and protocol analysis?", "o": ["Nmap", "Wireshark", "Burp Suite", "Aircrack-ng"], "c": 1, "e": "Wireshark is the industry-standard network protocol analyzer. It captures packets in real-time or reads from saved pcap files and can decode hundreds of protocols. It includes filters, statistics tools, and can reconstruct TCP streams to recover transferred files or credentials."}, {"d": "Sniffing", "diff": "hard", "q": "An attacker sets up a rogue DHCP server on a network. What attack does this most directly facilitate?", "o": ["MAC Flooding", "DHCP Starvation", "Default Gateway Hijacking and MitM", "ARP Cache Poisoning"], "c": 2, "e": "A rogue DHCP server can hand out malicious network configuration including a spoofed default gateway pointing to the attacker machine. Clients route all their traffic through the attacker, enabling a passive MitM without needing ARP poisoning."}, {"d": "Sniffing", "diff": "medium", "q": "Which scenario allows an attacker to capture credentials transmitted on a network without any encryption?", "o": ["HTTP Basic Auth over HTTP", "HTTPS connections", "SSL/TLS encrypted sessions", "SFTP file transfers"], "c": 0, "e": "HTTP Basic Authentication transmits credentials as a Base64-encoded string in the Authorization header. On unencrypted HTTP this can be trivially captured and decoded by anyone performing a passive sniff on the network segment. HTTPS encrypts this traffic."}, {"d": "Sniffing", "diff": "easy", "q": "What network device prevents passive sniffing by forwarding frames only to the intended recipient MAC address?", "o": ["Hub", "Router", "Switch", "Repeater"], "c": 2, "e": "Switches use MAC address tables to forward frames only to the port where the destination MAC address resides, unlike hubs which broadcast all frames. This prevents passive sniffing in switched networks, forcing attackers to use active techniques like ARP poisoning."}, {"d": "Sniffing", "diff": "hard", "q": "What is SSL stripping and which tool is commonly associated with this attack?", "o": ["Cracking SSL certificates via brute force", "Downgrading HTTPS to HTTP transparently using sslstrip", "Replacing the server certificate with a forged one", "Exploiting weak cipher suites"], "c": 1, "e": "SSL stripping performs a MitM attack where HTTPS links are replaced with HTTP equivalents. The attacker maintains an HTTPS connection with the server while the victim communicates over plain HTTP, allowing the attacker to read plaintext credentials. The sslstrip tool automates this."}, {"d": "Sniffing", "diff": "medium", "q": "Which Wireshark display filter correctly shows only HTTP GET requests?", "o": ["http.request", "http.request.method eq GET", "tcp.port == 80", "http.method == GET"], "c": 1, "e": "The correct Wireshark display filter for HTTP GET requests is http.request.method eq GET (or http.request.method == \"GET\"). Display filters use dot notation to access protocol field values. tcp.port == 80 shows all TCP traffic on port 80."}, {"d": "Sniffing", "diff": "hard", "q": "What countermeasure prevents ARP poisoning attacks on managed switches?", "o": ["Dynamic ARP Inspection (DAI)", "Port Security", "Static ARP entries", "Both DAI and Static ARP entries"], "c": 3, "e": "Both Dynamic ARP Inspection on managed switches and static ARP entries prevent ARP spoofing. DAI validates ARP packets against a DHCP snooping binding table, dropping packets with invalid IP-to-MAC mappings. Static ARP entries are unaffected by gratuitous ARP replies."}, {"d": "Sniffing", "diff": "medium", "q": "Which attack intercepts HTTPS traffic by positioning between client and server before TLS is established?", "o": ["Replay Attack", "SSL/TLS MitM Interception", "Padding Oracle Attack", "BEAST Attack"], "c": 1, "e": "SSL/TLS MitM interception occurs when an attacker presents a forged certificate to the client via ARP poisoning or a rogue AP. If the client accepts it the attacker decrypts all TLS traffic. Corporate proxies use legitimate versions of this for DLP inspection."}, {"d": "Social Engineering", "diff": "easy", "q": "An attacker calls a help desk impersonating an executive to request a password reset. What social engineering technique is used?", "o": ["Phishing", "Vishing", "Pretexting", "Baiting"], "c": 2, "e": "Pretexting involves creating a fabricated scenario to manipulate a target. The attacker creates a believable backstory posing as an executive to establish credibility and justify the request. Unlike vishing which is specifically phone-based phishing, pretexting refers to the invented scenario itself."}, {"d": "Social Engineering", "diff": "medium", "q": "An attacker sends a targeted email to a CFO impersonating the CEO, requesting an urgent wire transfer. What attack type is most precisely described?", "o": ["Spear Phishing", "Whaling", "BEC - Business Email Compromise", "Pharming"], "c": 2, "e": "Business Email Compromise involves impersonating executives or vendors via email to defraud organizations through fraudulent wire transfers or gift card requests. The FBI defines BEC as financially motivated executive impersonation fraud, making it the most precise term here."}, {"d": "Social Engineering", "diff": "easy", "q": "An attacker leaves infected USB drives in a company parking lot hoping employees will plug them in. What technique is this?", "o": ["Phishing", "Tailgating", "Baiting", "Piggybacking"], "c": 2, "e": "Baiting uses physical media like USB drives left in conspicuous locations. The attacker relies on human curiosity. This physical baiting technique was part of the preparation for the Stuxnet attack on Iranian nuclear facilities."}, {"d": "Social Engineering", "diff": "medium", "q": "Which social engineering attack redirects users to a fake website by poisoning DNS cache or modifying host files?", "o": ["Phishing", "Spear Phishing", "Vishing", "Pharming"], "c": 3, "e": "Pharming attacks redirect users to malicious websites without requiring the user to click a link. DNS cache poisoning at the ISP level affects many users while host file modification targets individual machines. Both redirect legitimate domain lookups to attacker-controlled IPs."}, {"d": "Social Engineering", "diff": "hard", "q": "What psychological principle does an attacker exploit when claiming only 3 spots remain to pressure a victim into acting quickly?", "o": ["Social Proof", "Authority", "Scarcity", "Reciprocity"], "c": 2, "e": "Cialdini principle of Scarcity states that people value things more when they are rare or diminishing. Attackers create urgency with limited time offers to pressure victims into bypassing critical thinking. Other key principles include Authority, Social Proof, Liking, Reciprocity, and Commitment."}, {"d": "Social Engineering", "diff": "medium", "q": "An attacker physically follows an authorized employee through a secured door without badging in. What is this called?", "o": ["Tailgating or Piggybacking", "Shoulder Surfing", "Dumpster Diving", "Baiting"], "c": 0, "e": "Tailgating involves following an authorized person through a physical access control point without using credentials. Countermeasures include mantraps, security awareness training, and turnstiles. Shoulder surfing involves observing someone screen or keyboard from nearby."}, {"d": "Social Engineering", "diff": "hard", "q": "Which social engineering technique combines OSINT research with personalized manipulation using targets personal details?", "o": ["Cold Call Vishing", "Spear Phishing", "OSINT-Based Social Engineering", "Watering Hole Attack"], "c": 2, "e": "OSINT-based social engineering combines open-source intelligence gathering with social engineering. Attackers research targets on LinkedIn, Facebook, and Twitter to learn colleague names, recent projects, and personal interests to craft hyper-personalized attacks."}, {"d": "Social Engineering", "diff": "easy", "q": "What type of phishing targets a specific known individual with personalized information?", "o": ["Vishing", "Spear Phishing", "Smishing", "Pharming"], "c": 1, "e": "Spear phishing targets a specific individual using personalized information such as name, job title, and colleague names to make the email appear legitimate. This significantly increases success rates compared to bulk phishing campaigns. Whaling is a subset targeting senior executives."}, {"d": "Social Engineering", "diff": "medium", "q": "A hacker pretends to be an IT support technician and visits an office to install a network update. What social engineering category is this?", "o": ["Remote Social Engineering", "Impersonation and Physical Social Engineering", "Vishing", "Insider Threat"], "c": 1, "e": "Physical social engineering and impersonation involves in-person manipulation. The attacker assumes a trusted role such as IT support, courier, or auditor to gain physical access or have employees perform actions. This bypasses technical controls entirely and relies on human trust."}, {"d": "Social Engineering", "diff": "hard", "q": "Which defense is most effective at reducing the success rate of social engineering attacks?", "o": ["Firewalls and IDS", "Security Awareness Training", "Multi-factor Authentication", "Antivirus Software"], "c": 1, "e": "Security awareness training is the primary countermeasure against social engineering since it exploits human psychology not technical vulnerabilities. Training that includes phishing simulations and clear reporting procedures has the highest impact. MFA helps but does not prevent a victim from voluntarily providing credentials."}, {"d": "Denial of Service", "diff": "medium", "q": "Which DoS attack exhausts a server connection table by sending half-open TCP connections?", "o": ["UDP Flood", "SYN Flood", "Ping of Death", "Teardrop Attack"], "c": 1, "e": "A SYN flood sends large numbers of SYN packets with spoofed IPs. The server allocates resources for each half-open connection and sends SYN-ACK replies. Without receiving the final ACK the server connection queue fills preventing legitimate connections. SYN cookies are the primary defense."}, {"d": "Denial of Service", "diff": "hard", "q": "In a Smurf attack, what is the source IP of the ICMP echo request set to?", "o": ["The attacker IP", "A random internet IP", "The victim IP", "The broadcast address"], "c": 2, "e": "In a Smurf attack the attacker sends ICMP echo requests to a network broadcast address with the source IP spoofed to the victim IP. All hosts on the broadcast domain reply to the victim, amplifying the attack. The amplification factor equals the number of hosts on the broadcast network."}, {"d": "Denial of Service", "diff": "easy", "q": "What is the key difference between a DoS and a DDoS attack?", "o": ["DoS is illegal; DDoS is not", "DDoS uses multiple distributed sources; DoS uses a single source", "DoS targets networks; DDoS targets applications", "They are identical"], "c": 1, "e": "A Denial of Service attack originates from a single source. A Distributed Denial of Service attack uses many distributed sources often via a botnet simultaneously. DDoS attacks are much harder to block since traffic comes from thousands of unique IPs."}, {"d": "Denial of Service", "diff": "hard", "q": "What is a DNS amplification attack and what amplification factor can it achieve?", "o": ["DNS poisoning with 2-5x amplification", "Sending small DNS queries to open resolvers that return large responses with up to 100x amplification", "Flooding DNS servers from a botnet with no amplification", "Exploiting DNS zone transfers for 10x amplification"], "c": 1, "e": "DNS amplification is a reflection/amplification DDoS attack. The attacker sends small queries spoofed to the victim IP to open DNS resolvers. Resolvers send large responses to the victim. EDNS0 and ANY queries can achieve 100x amplification making it one of the highest-bandwidth DDoS methods."}, {"d": "Denial of Service", "diff": "medium", "q": "Which countermeasure protects against SYN flood attacks by avoiding full connection-state allocation until the handshake is complete?", "o": ["Rate Limiting", "SYN Cookies", "Ingress Filtering", "Black Hole Routing"], "c": 1, "e": "SYN cookies allow servers to handle SYN flood attacks without storing connection state. The server encodes connection parameters into the ISN in the SYN-ACK. State is only allocated when the final ACK is received with a valid cookie, making the server immune to SYN flooding."}, {"d": "Denial of Service", "diff": "medium", "q": "A legacy Ping of Death attack involved sending ICMP packets larger than what size limit?", "o": ["512 bytes", "1024 bytes", "65535 bytes", "32768 bytes"], "c": 2, "e": "The Ping of Death involved sending ICMP echo request packets larger than the maximum IP packet size of 65535 bytes. When oversized fragments were reassembled a buffer overflow occurred causing crashes or reboots on vulnerable systems. Modern operating systems are patched against this."}, {"d": "Denial of Service", "diff": "hard", "q": "What is a Slowloris attack and which type of server does it primarily target?", "o": ["A physical attack on server racks", "An HTTP DoS attack that holds connections open by sending partial requests", "A DNS flood attack", "An application-layer brute force"], "c": 1, "e": "Slowloris opens many connections to a web server and keeps them alive by sending partial HTTP headers very slowly, never completing the request. This ties up the server connection pool without requiring much bandwidth. Apache servers were historically vulnerable; Nginx is more resistant."}, {"d": "Denial of Service", "diff": "easy", "q": "Which DDoS attack type floods the target with massive traffic to saturate bandwidth rather than targeting application logic?", "o": ["Application Layer Attack", "Protocol Attack", "Volumetric Attack", "Slow and Low Attack"], "c": 2, "e": "Volumetric attacks at Layer 3 and 4 flood the target with massive traffic to saturate bandwidth. Examples include UDP floods, ICMP floods, and amplification attacks measured in Gbps. Application layer attacks use fewer packets targeting web application logic, measured in requests per second."}, {"d": "Denial of Service", "diff": "hard", "q": "Which NTP command was abused in NTP amplification attacks and what approximate amplification ratio could it achieve?", "o": ["DNS ANY queries with 100x amplification", "NTP monlist command with approximately 5000x amplification", "SNMP GetBulk with 650x amplification", "SSDP M-SEARCH with 30x amplification"], "c": 1, "e": "NTP amplification exploits the monlist command in older NTP implementations. Monlist returns up to 600 IP addresses that recently synced. Small 8-byte queries generate responses up to 48KB, approximately 5000x amplification. NTP version 4.2.7p26 and RFC 7822 mitigate this."}, {"d": "Denial of Service", "diff": "medium", "q": "What is the primary mechanism by which cloud DDoS protection services like Cloudflare mitigate large DDoS attacks?", "o": ["They patch server vulnerabilities", "They filter and absorb attack traffic using anycast networks before it reaches the origin server", "They automatically identify and prosecute attackers", "They increase server hardware capacity"], "c": 1, "e": "Cloud-based DDoS scrubbing services use globally distributed anycast networks to absorb volumetric attacks close to their source, filtering malicious traffic before it reaches the origin server. They can absorb terabit-scale attacks that would overwhelm any single organization infrastructure."}, {"d": "Session Hijacking", "diff": "medium", "q": "Which session hijacking type allows an attacker to take over an active session in real time?", "o": ["Passive Hijacking", "Active Hijacking", "Man-in-the-Browser", "Blind Hijacking"], "c": 1, "e": "Active session hijacking involves intercepting and taking control of a live session, typically via predicted TCP sequence numbers or ARP poisoning for MitM positioning. Passive hijacking involves only monitoring without taking control. Blind hijacking injects commands without seeing responses."}, {"d": "Session Hijacking", "diff": "hard", "q": "What TCP property must an attacker predict to perform session hijacking without being in the network path?", "o": ["Source Port", "TTL value", "Sequence Number", "Window Size"], "c": 2, "e": "TCP sequence numbers uniquely identify bytes in a stream. If an attacker can predict the next sequence number they can inject spoofed TCP segments the recipient will accept. Modern OS TCP implementations use cryptographically random ISNs per RFC 6528 to prevent this."}, {"d": "Session Hijacking", "diff": "medium", "q": "What HTTP cookie attribute prevents client-side JavaScript from accessing session cookies, mitigating XSS-based session theft?", "o": ["Secure", "HttpOnly", "SameSite", "Path"], "c": 1, "e": "The HttpOnly cookie attribute prevents JavaScript from accessing the cookie value via document.cookie. This is the primary defense against XSS-based session token theft. The Secure attribute ensures cookies are only sent over HTTPS, and SameSite controls cross-site request behavior."}, {"d": "Session Hijacking", "diff": "medium", "q": "In an XSS-based session hijacking attack, what does the attacker inject to steal session cookies?", "o": ["SQL payload to dump the database", "Malicious JavaScript that sends the victim cookie to an attacker server", "A reverse shell payload", "A CSRF token forger"], "c": 1, "e": "In XSS-based session hijacking the attacker injects malicious JavaScript into a vulnerable web page. When a victim visits the page their browser executes the script and transmits their session cookie to the attacker server. The HttpOnly flag prevents this specific attack."}, {"d": "Session Hijacking", "diff": "hard", "q": "Which browser-based attack injects malicious code into the browser process to manipulate transactions after authentication, bypassing server-side security?", "o": ["Stored XSS", "Man-in-the-Browser (MitB)", "Clickjacking", "Session Fixation"], "c": 1, "e": "Man-in-the-Browser attacks use trojans to inject code into the browser process via browser helper objects or extensions. The malware can manipulate web transactions after TLS decryption, for example changing beneficiary account numbers in online banking while showing legitimate data to the user."}, {"d": "Session Hijacking", "diff": "medium", "q": "What is session fixation?", "o": ["Forcing a session timeout to disconnect a user", "Tricking a user into authenticating with a session ID the attacker already knows", "Stealing a session cookie via XSS", "Predicting session tokens using timing analysis"], "c": 1, "e": "Session fixation occurs when an attacker sets a known session ID before the victim authenticates. When the victim logs in the server associates their authenticated session with the attacker known ID. Defense: always issue a new session ID upon successful authentication."}, {"d": "Session Hijacking", "diff": "easy", "q": "Why is HTTPS across an entire website important for preventing session hijacking?", "o": ["It prevents SQL injection", "It encrypts session cookies in transit so they cannot be sniffed", "It blocks XSS attacks", "It prevents brute force attacks"], "c": 1, "e": "HTTPS encrypts traffic between client and server using TLS, preventing passive sniffing of session cookies transmitted in HTTP headers. Without HTTPS, session cookies can be captured by anyone monitoring an unencrypted connection such as on open WiFi."}, {"d": "Session Hijacking", "diff": "hard", "q": "Which attack exploits predictable session token generation to forge valid session IDs?", "o": ["Brute Force", "Session Token Prediction", "Replay Attack", "Session Fixation"], "c": 1, "e": "Session token prediction attacks succeed when session IDs are generated using weak random number generators or predictable algorithms based on timestamps or user IDs. Tools like Burp Sequencer analyze token randomness. NIST recommends session tokens of at least 128 bits of entropy."}, {"d": "Evading IDS/Firewalls", "diff": "hard", "q": "An attacker sends TCP packets with overlapping IP fragments containing different data at each receiver. What evasion technique is this?", "o": ["Session Splicing", "TTL Manipulation", "IP Fragmentation Overlap", "Covert Channel"], "c": 2, "e": "Overlapping IP fragmentation exploits differences in how OS and IDS implementations reassemble IP fragments. By sending fragments with overlapping offsets containing different data, the attacker crafts payloads that reassemble differently at the IDS versus the target host."}, {"d": "Evading IDS/Firewalls", "diff": "medium", "q": "What is session splicing in the context of IDS evasion?", "o": ["Breaking a TCP session into multiple separate connections", "Splitting an attack payload across many very small TCP segments below the IDS minimum reassembly size", "Manipulating TTL to expire packets at the IDS", "Encrypting traffic to bypass IDS inspection"], "c": 1, "e": "Session splicing splits an attack payload across many very small TCP segments. If the IDS has a minimum buffer threshold and does not reassemble small segments, the attack signature may not be detected even though the target host properly reassembles the stream."}, {"d": "Evading IDS/Firewalls", "diff": "hard", "q": "An attacker sets packet TTL so packets expire just after passing the IDS but reach the target intact. What technique is this?", "o": ["IP Fragmentation", "TTL Manipulation", "Source Routing", "Decoy Traffic"], "c": 1, "e": "TTL manipulation exploits the distance difference between the IDS and the target. The attacker sends a decoy packet with a TTL that expires at the IDS followed by the real packet that reaches the target. The IDS sees the decoy expire and thinks the packet was dropped."}, {"d": "Evading IDS/Firewalls", "diff": "medium", "q": "Which firewall type inspects the state of network connections and tracks active sessions?", "o": ["Packet Filter Firewall", "Stateful Inspection Firewall", "Application-Layer Firewall", "Circuit-Level Gateway"], "c": 1, "e": "Stateful inspection firewalls maintain a connection state table tracking established TCP connections, UDP pseudo-connections, and ICMP exchanges. They make more intelligent allow/deny decisions based on connection state rather than just individual packet headers."}, {"d": "Evading IDS/Firewalls", "diff": "easy", "q": "What is the primary difference between an IDS and an IPS?", "o": ["IDS is software; IPS is hardware", "IDS only detects and alerts; IPS actively blocks malicious traffic", "IDS is for external traffic; IPS for internal", "They are identical"], "c": 1, "e": "An IDS monitors traffic, detects suspicious activity, and generates alerts but is passive. An IPS is inline and can actively block, drop, or modify malicious traffic in real time. IPS introduces the risk of blocking legitimate traffic which IDS does not."}, {"d": "Evading IDS/Firewalls", "diff": "hard", "q": "Which technique uses alternate Unicode or URL encoding of attack strings to evade signature-based IDS?", "o": ["Fragmentation", "Obfuscation and Encoding", "TTL Manipulation", "Session Splicing"], "c": 1, "e": "Encoding-based evasion transforms attack strings into alternate representations such as URL encoding or Unicode that the IDS signature does not match but the target application normalizes and interprets as the original attack string. Protocol normalization in modern NGIPS mitigates this."}, {"d": "Evading IDS/Firewalls", "diff": "medium", "q": "What type of IDS detection method looks for deviations from a statistical baseline of normal behavior rather than known attack signatures?", "o": ["Signature-Based Detection", "Anomaly-Based Detection", "Policy-Based Detection", "Heuristic Detection"], "c": 1, "e": "Anomaly-based IDS creates a statistical baseline of normal network behavior and flags deviations. This can detect zero-day attacks that have no known signature. The disadvantage is a higher false positive rate and the difficulty of defining normal in dynamic environments."}, {"d": "Evading IDS/Firewalls", "diff": "hard", "q": "Which firewall architecture places public-facing servers in a DMZ between two separate firewalls?", "o": ["Screened Host Architecture", "Screened Subnet Architecture", "Dual-Homed Host", "Packet Filtering Architecture"], "c": 1, "e": "The screened subnet architecture places public-facing servers in a DMZ between an external firewall connected to the internet and an internal firewall protecting the internal network. Even if the DMZ is compromised the internal firewall provides a second layer of defense."}, {"d": "Evading IDS/Firewalls", "diff": "medium", "q": "What is the main advantage of a Next-Generation Firewall over a traditional stateful firewall?", "o": ["Higher throughput", "Application-aware inspection and identity-based policies", "Lower cost", "Simpler configuration"], "c": 1, "e": "NGFWs add application-layer inspection beyond traditional stateful inspection, enabling policies based on applications not just ports, user identities, SSL inspection, IPS, and URL filtering. Traditional stateful firewalls operate only at Layers 3 and 4."}, {"d": "Evading IDS/Firewalls", "diff": "hard", "q": "Why is an attacker using HTTPS for C2 traffic particularly difficult for traditional IDS to detect?", "o": ["HTTPS traffic is too fast to inspect", "Traditional IDS cannot inspect encrypted traffic without SSL decryption capabilities", "HTTPS traffic never triggers alerts", "Firewalls always allow HTTPS"], "c": 1, "e": "Traditional IDS cannot inspect encrypted HTTPS traffic without SSL/TLS decryption capabilities. NGFW platforms perform SSL decryption using a trusted CA certificate, re-encrypt traffic, and inspect it. This requires additional infrastructure and raises privacy concerns in some jurisdictions."}, {"d": "Web Application Hacking", "diff": "medium", "q": "An attacker injects OR 1=1-- into a login form username field. What vulnerability is being exploited?", "o": ["XSS", "CSRF", "SQL Injection", "Command Injection"], "c": 2, "e": "This is a SQL Injection attack. The payload manipulates the SQL WHERE clause to always evaluate as true, potentially bypassing authentication. This occurs when user input is concatenated directly into SQL queries without parameterization or prepared statements."}, {"d": "Web Application Hacking", "diff": "medium", "q": "A web application reflects user input from a URL parameter directly in the HTTP response without sanitization. What vulnerability is this?", "o": ["Stored XSS", "Reflected XSS", "DOM-based XSS", "CSRF"], "c": 1, "e": "Reflected (Non-Persistent) XSS occurs when user input is immediately echoed back in the server response without sanitization. The payload exists only in the URL and is not stored server-side. Victims are exploited when they click a malicious link containing the crafted payload."}, {"d": "Web Application Hacking", "diff": "hard", "q": "An attacker exploits a web application to make the server request internal resources unavailable from the internet. What vulnerability is this?", "o": ["Remote File Inclusion", "Server-Side Request Forgery (SSRF)", "XML External Entity (XXE)", "Path Traversal"], "c": 1, "e": "SSRF allows attackers to make the vulnerable server perform HTTP requests to arbitrary destinations including internal services and cloud metadata APIs. A critical SSRF vector is the AWS Instance Metadata Service at 169.254.169.254 which can expose IAM credentials."}, {"d": "Web Application Hacking", "diff": "hard", "q": "An attacker uploads a file to an image upload feature and accesses it via URL to execute server-side commands. What vulnerability is this?", "o": ["Path Traversal", "Unrestricted File Upload", "Remote Code Execution via SQLi", "XXE Injection"], "c": 1, "e": "Unrestricted File Upload allows attackers to upload web shells by bypassing insufficient validation. Attackers bypass filters by changing extension, MIME type spoofing, or null byte injection. Defenses include storing uploads outside webroot, content-based validation, and randomizing filenames."}, {"d": "Web Application Hacking", "diff": "medium", "q": "Which OWASP Top 10 category covers SQL injection, LDAP injection, and OS command injection?", "o": ["A01 Broken Access Control", "A03 Injection", "A07 Identification and Authentication Failures", "A05 Security Misconfiguration"], "c": 1, "e": "OWASP A03:2021 Injection covers SQL injection, OS command injection, LDAP injection, NoSQL injection, and other cases where untrusted data is sent to an interpreter as part of a command or query. Prevention requires parameterized queries, input validation, and least-privilege database accounts."}, {"d": "Web Application Hacking", "diff": "hard", "q": "Which attack tricks an authenticated user browser into sending forged requests to the target application without the user knowledge?", "o": ["XSS", "SQL Injection", "CSRF", "Clickjacking"], "c": 2, "e": "Cross-Site Request Forgery tricks an authenticated user browser into sending forged requests to the target application. Since the request comes from the victim browser with valid session cookies the server cannot distinguish it from legitimate requests. CSRF tokens prevent this attack."}, {"d": "Web Application Hacking", "diff": "medium", "q": "Which tool is the industry standard for intercepting and manipulating HTTP/HTTPS requests during web application penetration testing?", "o": ["Wireshark", "Burp Suite", "Metasploit", "Nessus"], "c": 1, "e": "Burp Suite by PortSwigger is the de-facto standard web application security testing platform. It includes a proxy to intercept requests, scanner for vulnerability detection, Intruder for fuzzing, Repeater for manual testing, Decoder, Sequencer, and Collaborator for out-of-band testing."}, {"d": "Web Application Hacking", "diff": "hard", "q": "What is blind SQL injection and how does it differ from regular SQL injection?", "o": ["It targets databases that do not use SQL", "The attacker cannot see query output but infers results from application behavior or timing", "It uses blind guessing of SQL keywords", "It only works on MSSQL databases"], "c": 1, "e": "In blind SQLi the application does not return query results or error messages. The attacker infers information from behavioral differences (Boolean-based blind) or response timing (Time-based blind using SLEEP or WAITFOR DELAY). Tools like sqlmap automate extraction."}, {"d": "Web Application Hacking", "diff": "medium", "q": "Which HTTP security header prevents a web page from being loaded in an iframe, mitigating clickjacking attacks?", "o": ["Content-Security-Policy", "X-Frame-Options", "Strict-Transport-Security", "X-Content-Type-Options"], "c": 1, "e": "The X-Frame-Options response header with DENY or SAMEORIGIN instructs browsers not to render the page in a frame or iframe. This prevents clickjacking attacks. The Content-Security-Policy frame-ancestors directive provides more granular control."}, {"d": "Web Application Hacking", "diff": "hard", "q": "A web application uses the path /download?file=report.pdf for file access. What attack could an attacker attempt?", "o": ["SQL Injection", "Path Traversal and Directory Traversal", "SSRF", "XXE"], "c": 1, "e": "Path traversal exploits insufficient validation of file path input. An attacker changes the parameter to traverse up directories and read arbitrary files. URL encoding can bypass naive filters. Defense: use absolute paths, whitelist filenames, and sandbox file access."}, {"d": "Web Application Hacking", "diff": "medium", "q": "What does the Secure attribute on a cookie ensure?", "o": ["The cookie cannot be read by JavaScript", "The cookie is only transmitted over HTTPS connections", "The cookie is encrypted at rest", "The cookie cannot be forged"], "c": 1, "e": "The Secure attribute instructs the browser to only transmit the cookie over HTTPS connections, never over HTTP. This prevents cookie theft via network sniffing on unencrypted connections. Combined with HttpOnly and SameSite attributes, these three provide comprehensive cookie security."}, {"d": "Cryptography", "diff": "easy", "q": "Which encryption algorithm supports 128, 192, and 256-bit keys and replaced DES as the US federal standard?", "o": ["3DES", "RSA", "AES", "Blowfish"], "c": 2, "e": "AES (Advanced Encryption Standard) based on Rijndael was adopted by NIST in 2001 as FIPS 197, replacing DES. It is a symmetric block cipher operating on 128-bit blocks. AES-256 is approved for TOP SECRET information by the NSA."}, {"d": "Cryptography", "diff": "medium", "q": "Which cryptographic attack uses precomputed tables mapping hash values to plaintext passwords?", "o": ["Brute Force", "Dictionary Attack", "Rainbow Table Attack", "Birthday Attack"], "c": 2, "e": "Rainbow table attacks use precomputed tables mapping password hashes to plaintext values, trading storage for computation time. Rainbow tables use reduction functions to store more chains compactly. Password salting defeats rainbow table attacks by making each hash unique."}, {"d": "Cryptography", "diff": "hard", "q": "What is the purpose of a digital signature?", "o": ["To encrypt the message for confidentiality", "To verify the sender identity and ensure message integrity", "To compress the message for transmission", "To generate a shared encryption key"], "c": 1, "e": "A digital signature provides authentication (verifying sender identity), non-repudiation (sender cannot deny signing), and integrity (message was not altered). It works by hashing the message and encrypting the hash with the sender private key. Recipients decrypt with the public key and compare hashes."}, {"d": "Cryptography", "diff": "medium", "q": "Which protocol allows two parties to establish a shared secret over an insecure channel without transmitting the secret itself?", "o": ["RSA", "Diffie-Hellman", "AES", "SHA-256"], "c": 1, "e": "Diffie-Hellman key exchange allows two parties to establish a shared secret over an insecure channel. Each party generates public/private values and through mathematical operations on exchanged public values both arrive at the same shared secret. This is used in TLS, SSH, and IPsec."}, {"d": "Cryptography", "diff": "hard", "q": "What type of cipher uses a repeating keyword to apply different substitution shifts to each letter of plaintext?", "o": ["Caesar Cipher", "Vigenere Cipher", "Transposition Cipher", "One-Time Pad"], "c": 1, "e": "The Vigenere cipher is a polyalphabetic substitution cipher using a repeating keyword. Each plaintext letter is shifted by the corresponding keyword letter. It was considered unbreakable for centuries but can be broken using Kasiski examination or index of coincidence analysis."}, {"d": "Cryptography", "diff": "medium", "q": "Which hashing algorithm produces a 256-bit digest and is part of the SHA-2 family?", "o": ["MD5", "SHA-1", "SHA-256", "SHA-3"], "c": 2, "e": "SHA-256 is part of the SHA-2 family designed by the NSA and published by NIST. It produces a 256-bit hash digest. MD5 produces 128-bit digests and is considered insecure. SHA-1 produces 160-bit digests and is deprecated. SHA-3 is a separate algorithm family based on Keccak."}, {"d": "Cryptography", "diff": "hard", "q": "What is a collision attack in cryptography?", "o": ["Finding an input that produces a specific hash output", "Finding two different inputs that produce the same hash output", "Reversing a hash to find the original input", "Predicting the next hash in a sequence"], "c": 1, "e": "A collision attack finds two distinct inputs that produce the same hash output. MD5 collisions were demonstrated in 2004 and SHA-1 was broken in 2017 by the Google SHAttered attack. These attacks can forge digital signatures and SSL certificates. SHA-256 and SHA-3 are currently collision-resistant."}, {"d": "Cryptography", "diff": "medium", "q": "Which AES block cipher mode XORs each plaintext block with the previous ciphertext block before encryption?", "o": ["ECB Electronic Codebook", "CBC Cipher Block Chaining", "CTR Counter Mode", "CFB Cipher Feedback"], "c": 1, "e": "CBC mode XORs each plaintext block with the previous ciphertext block before encryption creating data-dependent ciphertext. ECB encrypts each block independently producing identical ciphertext for identical plaintext blocks. CBC requires an initialization vector."}, {"d": "Cryptography", "diff": "hard", "q": "What is Perfect Forward Secrecy (PFS) and why is it important in TLS?", "o": ["Using longer encryption keys for better security", "Generating ephemeral session keys so past sessions cannot be decrypted even if the server private key is later compromised", "Ensuring backward compatibility with older TLS versions", "Using certificate pinning to prevent MitM attacks"], "c": 1, "e": "PFS uses ephemeral Diffie-Hellman or ECDHE key exchange to generate unique session keys that are discarded after the session. Even if an attacker later compromises the server private key they cannot decrypt previously captured sessions. TLS 1.3 mandates PFS."}, {"d": "Cryptography", "diff": "easy", "q": "What type of encryption uses the same key for both encryption and decryption?", "o": ["Asymmetric", "Public Key", "Symmetric", "Quantum"], "c": 2, "e": "Symmetric encryption uses a single shared secret key for both encryption and decryption. Examples include AES, DES, 3DES, and RC4. It is fast and efficient for bulk data encryption but requires secure key distribution. Asymmetric encryption uses mathematically linked public/private key pairs."}, {"d": "Cryptography", "diff": "hard", "q": "Which PKI component is responsible for issuing and signing digital certificates?", "o": ["Registration Authority (RA)", "Certificate Authority (CA)", "Certificate Revocation List (CRL)", "Online Certificate Status Protocol (OCSP)"], "c": 1, "e": "A Certificate Authority issues, signs, and revokes digital certificates that bind a public key to an identity. The RA handles identity verification on behalf of the CA. CRLs and OCSP are mechanisms to check if a certificate has been revoked. Root CAs are trusted by operating systems and browsers."}, {"d": "Cloud Computing", "diff": "medium", "q": "Which model defines security responsibilities shared between the cloud provider and the customer?", "o": ["Zero Trust", "Defense in Depth", "Shared Responsibility Model", "Cloud Security Alliance Model"], "c": 2, "e": "The Shared Responsibility Model divides security obligations: the provider secures infrastructure of the cloud including physical hardware and hypervisors,
