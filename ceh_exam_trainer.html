 while the customer secures what is in the cloud including data, applications, and IAM. Responsibilities shift by service model IaaS, PaaS, and SaaS."}, {"d": "Cloud Computing", "diff": "hard", "q": "A cloud attacker exploits a hypervisor vulnerability to break out of their VM and access other VMs on the same physical host. What is this called?", "o": ["Cloud Hopping", "VM Escape", "Cross-Tenant Attack", "Hypervisor Rootkit"], "c": 1, "e": "VM escape exploits hypervisor vulnerabilities to break out of a guest VM isolation boundary and interact with the hypervisor or other VMs on the same physical host. VENOM (CVE-2015-3456) targeting QEMU is a high-profile example. This is a critical cloud security concern in multi-tenant environments."}, {"d": "Cloud Computing", "diff": "medium", "q": "Which AWS service feature is commonly targeted during cloud reconnaissance to expose IAM credentials?", "o": ["S3 bucket policies", "EC2 Instance Metadata Service (IMDS) at 169.254.169.254", "CloudTrail logs", "VPC security groups"], "c": 1, "e": "The AWS Instance Metadata Service at 169.254.169.254 provides EC2 instances with IAM role credentials. SSRF vulnerabilities in web applications on EC2 are frequently exploited to access the IMDS and steal IAM credentials enabling lateral movement in AWS."}, {"d": "Cloud Computing", "diff": "easy", "q": "What cloud deployment model combines both public and private cloud resources?", "o": ["Community Cloud", "Hybrid Cloud", "Multi-Cloud", "Distributed Cloud"], "c": 1, "e": "A hybrid cloud combines private cloud (on-premises or colocation) and public cloud (AWS, Azure, GCP) resources. Organizations use hybrid cloud for regulatory compliance keeping sensitive data on-premises while leveraging public cloud for scalability and non-sensitive workloads."}, {"d": "Cloud Computing", "diff": "hard", "q": "Which cloud attack involves misconfigured storage services like S3 buckets exposing sensitive data publicly?", "o": ["Insecure API", "Cloud Misconfiguration and Data Exposure", "Cryptojacking", "Denial of Service"], "c": 1, "e": "Cloud misconfiguration is consistently the top cause of cloud data breaches. Improperly configured object storage with public read permissions has exposed billions of records. Tools like GrayhatWarfare, BucketFinder, and S3Scanner help discover exposed buckets during pen testing engagements."}, {"d": "Cloud Computing", "diff": "medium", "q": "What is serverless computing and what unique security risks does it introduce?", "o": ["Computing without physical servers with no special security concerns", "Function-based code execution without managing servers with risks including event injection and over-privileged IAM roles", "Containers without orchestration with DDoS as the main risk", "VMs that automatically shut down when idle"], "c": 1, "e": "Serverless (FaaS) executes discrete functions in response to events. Security challenges include event data injection, insecure third-party dependencies, overly permissive IAM execution roles, and inadequate logging. AWS Lambda and Azure Functions are common serverless platforms."}, {"d": "Cloud Computing", "diff": "hard", "q": "Which attack targets Kubernetes clusters by exploiting misconfigured RBAC permissions?", "o": ["Container Escape", "RBAC Privilege Escalation", "Pod Security Policy Bypass", "Node-Level Attack"], "c": 1, "e": "Kubernetes RBAC misconfigurations including overly permissive ClusterRoles and wildcard permissions can allow attackers to escalate to cluster-admin, enabling full cluster compromise. Tools like kubectl, kubeletctl, and kube-hunter are used to enumerate and exploit Kubernetes RBAC weaknesses."}, {"d": "Cloud Computing", "diff": "medium", "q": "What is cryptojacking in a cloud environment?", "o": ["Stealing encryption keys from cloud services", "Unauthorized use of cloud compute resources to mine cryptocurrency", "Encrypting cloud data for ransom", "Exfiltrating cryptographic certificates"], "c": 1, "e": "Cryptojacking involves unauthorized use of compute resources to mine cryptocurrency. In cloud environments attackers who gain access to cloud credentials with EC2 or Compute permissions spin up high-CPU instances for crypto mining, leaving the victim with massive unexpected cloud bills."}, {"d": "Cloud Computing", "diff": "hard", "q": "Which cloud security framework provides a comprehensive control matrix aligned with NIST, ISO 27001, and COBIT?", "o": ["NIST SP 800-144", "CSA Cloud Controls Matrix (CCM)", "ISO 27017", "CIS Benchmarks for Cloud"], "c": 1, "e": "The Cloud Security Alliance Cloud Controls Matrix is a cybersecurity control framework for cloud computing aligned with NIST, ISO 27001, COBIT, and other standards. It covers 17 domains and is used for cloud provider security assessments and compliance mapping."}, {"d": "Cloud Computing", "diff": "medium", "q": "An attacker finds AWS access keys committed to a public GitHub repository. What type of exposure is this?", "o": ["Cloud Misconfiguration", "Hard-Coded Credentials and Secret Sprawl", "Social Engineering", "Insider Threat"], "c": 1, "e": "Hard-coded credentials or secret sprawl occurs when API keys and tokens are committed to code repositories. Public GitHub repositories are routinely scanned by attackers and automated bots. Tools like truffleHog, GitLeaks, and GitHub secret scanning detect exposed secrets in code."}, {"d": "IoT Hacking", "diff": "hard", "q": "An attacker installs backdoored firmware on an IoT device via an unverified update mechanism. What attack is this?", "o": ["Physical Tampering", "Supply Chain Attack", "Firmware Side-Channel Attack", "Evil Firmware Update"], "c": 3, "e": "Evil firmware update attacks exploit the lack of cryptographic signature verification in many IoT update mechanisms. If firmware is not signed and verified before installation, attackers with network access or MitM positioning can push malicious firmware that adds backdoors or disables security features."}, {"d": "IoT Hacking", "diff": "medium", "q": "Which IoT protocol is vulnerable to unauthenticated command injection due to lack of authentication by default?", "o": ["HTTPS", "MQTT", "CoAP", "Zigbee"], "c": 1, "e": "MQTT (Message Queuing Telemetry Transport) is a lightweight pub/sub protocol widely used in IoT. Many MQTT brokers are deployed without authentication, allowing unauthenticated clients to subscribe to all topics including sensitive sensor data and control commands, or publish malicious commands."}, {"d": "IoT Hacking", "diff": "easy", "q": "What is the most common default security vulnerability in consumer IoT devices?", "o": ["Lack of encryption", "Default or hardcoded credentials", "Outdated operating systems", "No firewall"], "c": 1, "e": "Default or hardcoded credentials are the number one IoT vulnerability per OWASP IoT Top 10. Devices shipped with default admin credentials that cannot be changed are trivially compromised. The Mirai botnet exploited default credentials on tens of thousands of cameras and routers."}, {"d": "IoT Hacking", "diff": "hard", "q": "Which hardware debug interface is commonly targeted for IoT firmware extraction?", "o": ["USB", "JTAG and UART", "Bluetooth", "Wi-Fi"], "c": 1, "e": "JTAG (Joint Test Action Group) and UART (Universal Asynchronous Receiver-Transmitter) are debug interfaces present on most embedded hardware. JTAG provides low-level processor access for reading flash firmware. UART often provides an unauthenticated root shell on the device serial console."}, {"d": "IoT Hacking", "diff": "medium", "q": "The Mirai botnet primarily targeted which IoT device vulnerability?", "o": ["Unpatched firmware vulnerabilities", "Default credentials via Telnet and SSH", "Physical access to devices", "Supply chain compromises"], "c": 1, "e": "Mirai (2016) scanned the internet for IoT devices with default credentials on Telnet (port 23) and SSH using approximately 60 hardcoded username and password combinations. After compromising devices it used them for massive DDoS attacks including the Dyn DNS attack affecting Twitter, Netflix, and Reddit."}, {"d": "IoT Hacking", "diff": "hard", "q": "What is a side-channel attack in the context of IoT security?", "o": ["Attacking devices from a secondary network interface", "Extracting information by analyzing physical emanations such as power consumption or EM radiation rather than exploiting software bugs", "Attacks using a secondary C2 channel", "Exploiting secondary firmware partitions"], "c": 1, "e": "Side-channel attacks extract cryptographic keys by analyzing physical emanations during cryptographic operations including power consumption, electromagnetic radiation, and timing variations. These attacks bypass cryptographic algorithm security entirely without needing to break the algorithm."}, {"d": "IoT Hacking", "diff": "medium", "q": "Which OWASP IoT vulnerability involves exposing unnecessary network services that increase the attack surface?", "o": ["Insecure Update Mechanism", "Unnecessary Open Ports and Attack Surface", "Lack of Encryption", "Insufficient Physical Hardening"], "c": 1, "e": "Unnecessary open ports and services (OWASP IoT number 4) increase the attack surface. Many IoT devices run Telnet, FTP, HTTP admin panels, or debug services never needed in production. Default deny policies and port scanning during device assessment identify this exposure."}, {"d": "IoT Hacking", "diff": "hard", "q": "What technique is used to extract firmware from an IoT device when no OTA update mechanism is available?", "o": ["Cold Boot Attack", "NAND/NOR Flash extraction via JTAG or physical desoldering", "ARP Spoofing", "Replay Attack"], "c": 1, "e": "Physical firmware extraction involves direct hardware access: reading flash memory via JTAG or SPI interfaces, desoldering the flash chip for reading with a programmer such as CH341A, or using a logic analyzer to capture firmware during boot. Extracted firmware is analyzed with Binwalk and reverse engineering tools."}, {"d": "IoT Hacking", "diff": "easy", "q": "Which organization published the IoT Top 10 vulnerability list used to guide IoT security testing?", "o": ["EC-Council", "OWASP", "NIST", "IEEE"], "c": 1, "e": "OWASP (Open Web Application Security Project) maintains the OWASP IoT Top 10 which identifies critical IoT security vulnerabilities including default credentials, insecure network services, insecure ecosystem interfaces, lack of secure update mechanisms, and insufficient physical hardening."}, {"d": "IoT Hacking", "diff": "medium", "q": "Which industrial protocols used in building automation and OT environments lack authentication in their original specification?", "o": ["Modbus only", "BACnet only", "Both Modbus and BACnet", "MQTT only"], "c": 2, "e": "Both Modbus (developed in 1979) and BACnet lack authentication in their original specifications. Modbus has no authentication or encryption. These protocols were designed for isolated OT networks but are increasingly internet-connected, creating significant security risks."}];

var DOMAINS = [];
QB.forEach(function(q){if(DOMAINS.indexOf(q.d)<0)DOMAINS.push(q.d);});

var S = {
  domain:'All', sessLen:20, questions:[], idx:0,
  answered:false, selected:-1, score:0, total:0,
  timerSec:90, timerInterval:null, history:[], phase:'home'
};

function shuffle(arr){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=a[i];a[i]=a[j];a[j]=t;
  }
  return a;
}

function prepQ(){
  var pool = S.domain==='All' ? QB : QB.filter(function(q){return q.d===S.domain;});
  var chosen = shuffle(pool).slice(0, Math.min(S.sessLen, pool.length));
  return chosen.map(function(q){
    var opts = q.o.map(function(text,i){return {text:text, orig:i};});
    var sh = shuffle(opts);
    var nc = sh.findIndex(function(o){return o.orig===q.c;});
    return {d:q.d, diff:q.diff, q:q.q, e:q.e, sh:sh, nc:nc};
  });
}

function startExam(){
  clearInterval(S.timerInterval);
  S.questions=prepQ(); S.idx=0; S.answered=false; S.selected=-1;
  S.score=0; S.total=0; S.history=[]; S.phase='exam';
  startTimer(); render();
}

function startTimer(){
  clearInterval(S.timerInterval);
  S.timerSec=90; updateTimer();
  S.timerInterval=setInterval(function(){
    S.timerSec--;updateTimer();
    if(S.timerSec<=0){clearInterval(S.timerInterval);if(!S.answered)timeOut();}
  },1000);
}

function updateTimer(){
  var el=document.getElementById('timer');
  if(!el)return;
  var m=Math.floor(S.timerSec/60), s=S.timerSec%60;
  el.textContent=m+':'+(s<10?'0':'')+s;
  el.className='timer'+(S.timerSec<=10?' danger':S.timerSec<=20?' warn':'');
}

function timeOut(){
  S.answered=true; S.selected=-1; S.total++;
  S.history.push({ok:false,d:S.questions[S.idx].d});
  render();
}

function selectAnswer(i){
  if(S.answered)return;
  clearInterval(S.timerInterval);
  S.answered=true; S.selected=i;
  var ok=i===S.questions[S.idx].nc;
  if(ok)S.score++;
  S.total++;
  S.history.push({ok:ok,d:S.questions[S.idx].d});
  render();
}

function nextQ(){
  if(S.idx<S.questions.length-1){
    S.idx++;S.answered=false;S.selected=-1;startTimer();render();
  } else {
    clearInterval(S.timerInterval);S.phase='results';render();
  }
}

function goHome(){clearInterval(S.timerInterval);S.phase='home';render();}
function setDomain(d){S.domain=d;render();}
function setLen(n){S.sessLen=n;render();}

function render(){
  updateSidebar(); updateTopbar();
  var c=document.getElementById('content');
  if(S.phase==='home')c.innerHTML=renderHome();
  else if(S.phase==='exam')c.innerHTML=renderExam();
  else c.innerHTML=renderResults();
  updateProg();
  if(S.phase==='exam')updateTimer();
}

function updateSidebar(){
  document.getElementById('ss-total').textContent=S.total||0;
  document.getElementById('ss-correct').textContent=S.score||0;
  document.getElementById('ss-score').textContent=S.total>0?Math.round(S.score/S.total*100)+'%':'&mdash;';
  document.getElementById('ss-score').innerHTML=S.total>0?Math.round(S.score/S.total*100)+'%':'&mdash;';
  document.getElementById('ss-bank').textContent=QB.length;
  var html='<button class="dom-btn'+(S.domain==='All'?' active':'')+'" onclick="setDomain(\'All\')"><span>All domains</span><span class="dom-cnt">'+QB.length+'</span></button>';
  DOMAINS.forEach(function(d){
    var cnt=QB.filter(function(q){return q.d===d;}).length;
    html+='<button class="dom-btn'+(S.domain===d?' active':'')+'" onclick="setDomain(\''+d.replace(/'/g,"\\'")+'\')" title="'+d+'"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px;">'+d+'</span><span class="dom-cnt">'+cnt+'</span></button>';
  });
  document.getElementById('dom-list').innerHTML=html;
}

function updateTopbar(){
  var badges=document.getElementById('tb-badges');
  var counter=document.getElementById('tb-counter');
  var timerEl=document.getElementById('timer');
  if(S.phase==='exam'&&S.questions.length){
    var q=S.questions[S.idx];
    badges.innerHTML='<span class="badge bdg-dom">'+q.d+'</span><span class="badge bdg-'+q.diff+'">'+q.diff+'</span>';
    counter.textContent=(S.idx+1)+' / '+S.questions.length;
    timerEl.style.display='';
  } else {
    badges.innerHTML='<span style="font-size:13px;font-weight:500;color:#8b949e;font-family:\'JetBrains Mono\',monospace;letter-spacing:.04em;">CEH MASTER TRAINER</span>';
    counter.textContent='';
    timerEl.innerHTML='&mdash;'; timerEl.className='timer';
    timerEl.style.display=S.phase==='home'?'none':'';
  }
}

function updateProg(){
  var f=document.getElementById('prog');
  if(S.phase==='exam'&&S.questions.length) f.style.width=(S.idx/S.questions.length*100)+'%';
  else if(S.phase==='results') f.style.width='100%';
  else f.style.width='0%';
}

function renderHome(){
  var pool=S.domain==='All'?QB.length:QB.filter(function(q){return q.d===S.domain;}).length;
  var histHtml='';
  if(S.total>0){
    histHtml='<div class="hist-box"><div class="hist-title">Session History</div><div class="hist-grid">'
      +'<div class="rstat"><div class="rstat-val">'+S.total+'</div><div class="rstat-lbl">Attempted</div></div>'
      +'<div class="rstat"><div class="rstat-val">'+S.score+'</div><div class="rstat-lbl">Correct</div></div>'
      +'<div class="rstat"><div class="rstat-val">'+(S.total-S.score)+'</div><div class="rstat-lbl">Incorrect</div></div>'
      +'<div class="rstat"><div class="rstat-val">'+Math.round(S.score/S.total*100)+'%</div><div class="rstat-lbl">Score</div></div>'
      +'</div></div>';
  }
  var lenBtns=[10,15,20,30];
  if(pool>30)lenBtns.push(50);
  var lenHtml=lenBtns.map(function(n){return '<button class="cfg-btn'+(S.sessLen===n?' active':'')+'" onclick="setLen('+n+')">'+n+'</button>';}).join('');
  return '<div class="home-hero"><h1>CEH Master Exam Trainer</h1><p>Official EC-Council exam: 125 questions &bull; 4 hours &bull; ~70% passing score<br>This trainer covers all '+DOMAINS.length+' CEH domains with '+QB.length+' exam-aligned questions.</p></div>'
    +'<div class="exam-info"><div class="info-card"><div class="info-card-val">'+QB.length+'</div><div class="info-card-lbl">Question Bank</div></div><div class="info-card"><div class="info-card-val">'+DOMAINS.length+'</div><div class="info-card-lbl">Domains</div></div><div class="info-card"><div class="info-card-val">90s</div><div class="info-card-lbl">Per Question</div></div></div>'
    +'<div class="sess-cfg"><h3>Session Configuration</h3><div class="cfg-row"><span class="cfg-lbl">Questions</span>'+lenHtml+'</div><div style="font-size:11px;color:#6e7681;padding-left:98px;margin-top:4px;">'+Math.min(S.sessLen,pool)+' questions available from current filter ('+pool+' in pool)</div></div>'
    +'<button class="start-btn" onclick="startExam()">Start Session &rarr;</button>'
    +histHtml;
}

function renderExam(){
  var q=S.questions[S.idx];
  var labels=['A','B','C','D'];
  var opts=q.sh.map(function(opt,i){
    var cls='opt';
    if(S.answered){
      if(i===q.nc)cls+=' correct';
      else if(i===S.selected)cls+=' wrong';
    }
    return '<button class="'+cls+'" onclick="selectAnswer('+i+')"'+(S.answered?' disabled':'')+'>'+
      '<span class="opt-key">'+labels[i]+'</span>'+
      '<span class="opt-text">'+opt.text+'</span>'+
      '</button>';
  }).join('');
  var explainHtml='';
  var feedbackHtml='';
  if(S.answered){
    var ok=S.selected===q.nc;
    var cls2=S.selected===-1?'timeout':ok?'ok':'fail';
    var msg=S.selected===-1?'TIME UP':ok?'CORRECT':'INCORRECT';
    feedbackHtml='<span class="feedback '+cls2+'">'+msg+'</span>';
    explainHtml='<div class="explain"><strong>Explanation:</strong> '+q.e+'</div>';
  }
  return '<div class="q-num">Question '+(S.idx+1)+' of '+S.questions.length+'</div>'
    +'<div class="q-text">'+q.q+'</div>'
    +'<div class="options">'+opts+'</div>'
    +explainHtml
    +'<div class="controls"><button class="btn" onclick="goHome()">&larr; Exit Session</button>'
    +'<div style="display:flex;align-items:center;gap:14px;">'+feedbackHtml
    +(S.answered?'<button class="btn btn-p" onclick="nextQ()">'+(S.idx<S.questions.length-1?'Next &rarr;':'See Results')+'</button>':'')
    +'</div></div>';
}

function renderResults(){
  var pct=Math.round(S.score/S.questions.length*100);
  var pass=pct>=70;
  var domStats={};
  S.history.forEach(function(h){
    if(!domStats[h.d])domStats[h.d]={ok:0,n:0};
    domStats[h.d].n++;
    if(h.ok)domStats[h.d].ok++;
  });
  var rows=Object.keys(domStats).map(function(d){
    var s=domStats[d];
    var dp=Math.round(s.ok/s.n*100);
    var col=dp>=70?'#3fb950':dp>=50?'#d29922':'#f85149';
    return '<div class="db-row"><div class="db-row-top"><span>'+d+'</span><span style="font-family:\'JetBrains Mono\',monospace;">'+s.ok+'/'+s.n+' ('+dp+'%)</span></div><div class="db-bg"><div class="db-fill" style="width:'+dp+'%;background:'+col+';"></div></div></div>';
  }).join('');
  return '<div class="res-wrap"><div class="score-circ '+(pass?'pass':'fail')+'"><div class="score-pct '+(pass?'pass':'fail')+'">'+pct+'%</div><div class="score-sub">'+(pass?'PASSING':'FAILING')+'</div></div>'
    +'<p style="color:#8b949e;font-size:14px;margin-bottom:20px;">'+S.score+' correct out of '+S.questions.length+' questions &bull; CEH passing: ~70%</p>'
    +'<div class="res-grid"><div class="rstat"><div class="rstat-val">'+S.score+'</div><div class="rstat-lbl">Correct</div></div><div class="rstat"><div class="rstat-val">'+(S.questions.length-S.score)+'</div><div class="rstat-lbl">Incorrect</div></div><div class="rstat"><div class="rstat-val">'+pct+'%</div><div class="rstat-lbl">Score</div></div></div></div>'
    +'<div class="dom-breakdown"><div class="db-title">Performance by domain</div>'+rows+'</div>'
    +'<div class="res-btns"><button class="btn btn-g" onclick="startExam()">Retake (reshuffled)</button><button class="btn btn-p" onclick="goHome()">Back to menu</button></div>';
}

render();
</script>
</body>
