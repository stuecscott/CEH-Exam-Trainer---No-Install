correct_fb:'In cloud multi-tenant environments, multiple VMs share physical hardware. A <strong>side-channel attack</strong> exploits this shared infrastructure: a malicious VM monitors timing, power consumption, or <strong>CPU cache behavior</strong> (Flush+Reload, Prime+Probe) to extract information from a co-resident VM. Spectre and Meltdown (2018) are hardware-level side-channel vulnerabilities affecting all cloud providers. Mitigation: hardware mitigations, hypervisor isolation, avoid co-residency with untrusted tenants.',
wrong_fb:'<strong>Side-channel = exploit shared physical resources between VMs</strong>. Classic cloud side-channels: CPU cache timing (Flush+Reload), memory bus contention, power analysis. Spectre/Meltdown (2018): speculative execution side-channels in Intel/AMD CPUs affected every major cloud provider. Emergency patches caused 5-30% performance degradation. Defense: process isolation, hardware mitigations (microcode updates), avoiding cross-VM information leakage in hypervisor design.'},

{topic:11,diff:'easy',type:'Multiple Choice',
q:'What is the primary security recommendation for default credentials on IoT devices?',
opts:['Default credentials are secure and do not need to be changed','Always change default usernames and passwords immediately upon deployment  --  default credentials are publicly known and the first thing attackers try','IoT devices do not have credentials and cannot be compromised via login','Default credentials only need changing on internet-facing devices'],
ans:1,hint:'Defaults are designed for setup convenience, not security.',
correct_fb:'<strong>Change ALL default credentials immediately</strong>. Default IoT credentials (admin/admin, admin/password, root/root) are published in manuals, online databases, and exploited by automated tools like Mirai. The Mirai botnet used only 61 default username/password combinations to compromise 600,000+ IoT devices. Changing defaults is the single most impactful security action for IoT. Additional steps: disable unnecessary services, segment IoT devices on dedicated VLANs.',
wrong_fb:'<strong>Default credentials = first attack vector against IoT</strong>. Mirai botnet: used 61 default credential pairs to compromise cameras, DVRs, and routers, building a botnet that launched 620 Gbps DDoS. Default credential databases: Shodan shows internet-connected devices with default logins, routerpasswords.com lists router defaults. Defense: change defaults, disable unnecessary services, firmware updates, network segmentation (IoT VLAN), monitor for unauthorized connections.'},
// -- TOPIC 0: Ethical Hacking Essentials --
{topic:0,diff:'medium',type:'Multiple Choice',
q:'What is the difference between a vulnerability scan and a penetration test?',
opts:['They are the same thing','A vulnerability scan identifies potential weaknesses using automated tools; a penetration test actively exploits them to demonstrate real impact','A vulnerability scan is manual; a penetration test is automated','A vulnerability scan tests physical security; a penetration test tests digital systems'],
ans:1,hint:'One finds holes; the other also goes through them.',
correct_fb:'<strong>Vulnerability scan</strong>: automated tool (Nessus, Qualys, OpenVAS) identifies and reports potential vulnerabilities  --  no exploitation occurs. Fast and comprehensive but produces false positives. <strong>Penetration test</strong>: a skilled tester actively exploits vulnerabilities, chains attacks, bypasses controls, and achieves defined objectives (e.g., domain admin access). Pen tests prove exploitability and demonstrate real business risk.',
wrong_fb:'<strong>Vulnerability scan = find and report (no exploitation)</strong>. <strong>Penetration test = find AND exploit</strong>. Vuln scans are broader, faster, cheaper. Pen tests are deeper, slower, more expensive, and provide proof of impact. Both are necessary: vuln scans for continuous monitoring; pen tests for periodic depth assessments. Many organizations run both: quarterly vuln scans + annual pen tests.'},

{topic:0,diff:'hard',type:'Multiple Choice',
q:'In the CEH framework, what is "dumpster diving" and which attack phase does it belong to?',
opts:['Dumping database contents during exploitation; Gaining Access phase','Physically searching through an organization\'s trash for sensitive information; Reconnaissance phase','Clearing log files after an attack; Covering Tracks phase','Downloading large amounts of data from a compromised server; Maintaining Access phase'],
ans:1,hint:'Physical trash can contain digital gold.',
correct_fb:'<strong>Dumpster diving</strong> is physically searching through an organization\'s discarded materials  --  trash, recycling bins, shredder bins  --  for sensitive information. It belongs to the <strong>Reconnaissance</strong> phase. Valuable finds include: printed documents with credentials, old hard drives, network diagrams, internal memos, organizational charts, and sticky notes with passwords. Countermeasure: cross-cut shredding of all documents, secure hard drive destruction.',
wrong_fb:'<strong>Dumpster diving = Reconnaissance phase physical OSINT</strong>. Organizations often throw away extremely sensitive information. High-value dumpster finds: printed spreadsheets with employee lists, network topology diagrams, post-it notes with passwords, old hard drives with undeleted data, internal phone directories. Defense: mandatory shredding policy (cross-cut shredder, not strip-cut), physical security around disposal areas, hard drive degaussing or destruction.'},

{topic:0,diff:'easy',type:'Multiple Choice',
q:'What does "non-repudiation" mean in information security?',
opts:['The ability to encrypt data so it cannot be read','The assurance that someone cannot deny having performed an action or sent a message  --  digital signatures provide this','The process of verifying a user\'s identity before granting access','Preventing unauthorized users from accessing a system'],
ans:1,hint:'Non = not, repudiation = denial. So non-repudiation = cannot deny.',
correct_fb:'<strong>Non-repudiation</strong> ensures that a party cannot deny having performed an action. In digital communications: digital signatures provide non-repudiation  --  the sender cannot later claim they didn\'t send a message (since only they have the private key used to sign it). This is critical for financial transactions, legal contracts, and audit trails. It\'s one of the core security objectives alongside confidentiality, integrity, and availability.',
wrong_fb:'<strong>Non-repudiation = cannot deny performing an action</strong>. Achieved through: digital signatures (private key proves sender identity), audit logs (timestamped records of actions), PKI certificates (binds identity to key), and blockchain (immutable transaction record). The CIA triad + non-repudiation forms the core security objectives tested throughout the CEH exam.'},

{topic:0,diff:'medium',type:'Multiple Choice',
q:'What is the primary purpose of a "Rules of Engagement" (ROE) document in a pen test?',
opts:['To document all vulnerabilities discovered during the test','To define the boundaries and limitations of the test  --  what is and isn\'t allowed, timing, scope, and escalation procedures','To establish payment terms between the tester and client','To list all tools the tester is permitted to use'],
ans:1,hint:'Rules = boundaries. Engagement = the pen test.',
correct_fb:'The <strong>Rules of Engagement (ROE)</strong> document defines: testing scope (which systems/IPs are in and out of scope), testing windows (when testing can occur), permitted techniques (what attacks are allowed), escalation procedures (what to do if a critical vulnerability is found or a system crashes), emergency contacts, and any restrictions (e.g., no DoS testing in production). Without ROE, testers risk legal liability for actions outside the agreed scope.',
wrong_fb:'<strong>ROE = boundaries and procedures for the pen test engagement</strong>. Critical elements: in-scope vs out-of-scope systems (specific IP ranges, domains), testing schedule (business hours only vs 24/7), allowed techniques (no DoS? No social engineering?), escalation path (if you find live breach evidence), emergency stop procedures. The ROE protects both the tester (legal coverage) and the client (prevents disruption to production systems).'},

{topic:0,diff:'hard',type:'Multiple Choice',
q:'What is "threat modeling" and why is it performed early in the security lifecycle?',
opts:['Creating fake threats to test security teams during incident response drills','Systematically identifying potential threats, attack vectors, and vulnerabilities to prioritize security controls before systems are deployed','Building threat actor profiles from captured malware samples','Modeling network traffic patterns to detect anomalies'],
ans:1,hint:'Model the threats before building, so you design security in from the start.',
correct_fb:'<strong>Threat modeling</strong> systematically identifies: assets worth protecting, potential threats and threat actors, attack vectors and attack surfaces, and existing/needed controls. Performed early (design phase), it\'s far cheaper to fix security issues than after deployment. Frameworks: STRIDE (Microsoft), PASTA, DREAD. Output: prioritized list of threats with risk ratings and recommended mitigations. The SDLC should include threat modeling at every major design phase.',
wrong_fb:'<strong>Threat modeling = proactive security analysis during design</strong>. STRIDE model: Spoofing, Tampering, Repudiation, Information disclosure, Denial of service, Elevation of privilege. DREAD model rates: Damage potential, Reproducibility, Exploitability, Affected users, Discoverability. Performing threat modeling early prevents costly redesigns and ensures security is built in, not bolted on  --  a fundamental secure SDLC principle.'},

{topic:0,diff:'medium',type:'Multiple Choice',
q:'Which term describes the process of converting plaintext to ciphertext?',
opts:['Decryption','Hashing','Encryption','Encoding'],
ans:2,hint:'Cipher + text = the output of this process.',
correct_fb:'<strong>Encryption</strong> converts plaintext (readable) into ciphertext (unreadable without the key) using a cryptographic algorithm and key. <strong>Decryption</strong> reverses the process. <strong>Hashing</strong> is one-way transformation producing a fixed-size digest (not reversible). <strong>Encoding</strong> (Base64, URL encoding) is NOT encryption  --  it\'s just reformatting and easily reversed without a key. Encoding provides zero security.',
wrong_fb:'<strong>Encryption = plaintext -> ciphertext (reversible with key)</strong>. Hashing = plaintext -> digest (one-way, no key needed to compute, not reversible). Encoding = reformatting (Base64 = not security). A common mistake: treating Base64 encoding as security  --  it is not encryption and offers no protection. Always use proper encryption (AES, RSA) for sensitive data protection.'},

{topic:0,diff:'easy',type:'Multiple Choice',
q:'What is the CIA triad in information security?',
opts:['Certified Information Assurance  --  a security certification framework','Confidentiality, Integrity, and Availability  --  the three core security objectives','Central Intelligence Architecture  --  a government security model','Cyber Incident Assessment  --  a threat evaluation process'],
ans:1,hint:'Three properties that secure systems must provide  --  CIA stands for three words.',
correct_fb:'The <strong>CIA Triad</strong>: <strong>Confidentiality</strong> (only authorized parties can access information  --  encryption, access controls), <strong>Integrity</strong> (information is accurate and unmodified  --  hashing, digital signatures, checksums), <strong>Availability</strong> (systems and data are accessible when needed  --  redundancy, backups, DDoS protection). Every security control maps to one or more of these objectives. The opposite is the DAD triad: Disclosure, Alteration, Destruction.',
wrong_fb:'<strong>CIA = Confidentiality + Integrity + Availability</strong>. Confidentiality: prevent unauthorized disclosure (encryption, access control). Integrity: prevent unauthorized modification (hashing, digital signatures). Availability: ensure systems work when needed (redundancy, backups, DDoS mitigation). Security policies and controls should be evaluated against all three  --  sometimes they are in tension (e.g., strong encryption improves confidentiality but may slightly reduce availability).'},

// -- TOPIC 1: Reconnaissance --
{topic:1,diff:'medium',type:'Multiple Choice',
q:'What is "Google hacking" (Google dorking) and which database catalogs useful dorks?',
opts:['Hacking Google\'s internal systems to extract search data','Using advanced Google search operators to find sensitive information on public websites; cataloged in the Google Hacking Database (GHDB)','Injecting malicious searches into Google to poison search results','Using Google Analytics to track target users'],
ans:1,hint:'GHDB = Google Hacking Database  --  maintained by Offensive Security.',
correct_fb:'<strong>Google hacking/dorking</strong> uses advanced search operators to find sensitive information accidentally indexed: exposed configuration files, login pages, vulnerable servers, camera feeds, password files. The <strong>GHDB (Google Hacking Database)</strong>, maintained at exploit-db.com/google-hacking-database, catalogs thousands of useful dorks. Key operators: site:, filetype:, intitle:, inurl:, intext:, cache:, link:.',
wrong_fb:'<strong>Google dorking = advanced operators to find sensitive public data</strong>. Example dorks: "filetype:pdf site:target.com" (find PDFs), "intitle:\"index of\"" (find directory listings), "inurl:admin" (find admin pages), "filetype:sql" (find database dumps). The GHDB at exploit-db.com contains thousands of categorized dorks. All legal  --  you\'re only searching publicly indexed content. Acting on findings without authorization is illegal.'},

{topic:1,diff:'easy',type:'Multiple Choice',
q:'What is the purpose of the "dig" command in Linux?',
opts:['To physically excavate network cables for physical pen testing','To perform DNS queries  --  looking up records for domains including A, MX, NS, TXT, and SOA records','To scan ports on a remote system','To capture network packets for analysis'],
ans:1,hint:'dig = Domain Information Groper  --  a DNS lookup tool.',
correct_fb:'<strong>dig (Domain Information Groper)</strong> is a flexible DNS query tool used for: forward lookups (dig A target.com), reverse lookups (dig -x 1.2.3.4), specific record types (dig MX target.com), zone transfers (dig axfr @ns1.target.com target.com), and nameserver queries (dig NS target.com). More powerful and scriptable than nslookup. Essential reconnaissance tool for DNS enumeration.',
wrong_fb:'<strong>dig = DNS query tool</strong>. Key dig commands: "dig target.com" (A record), "dig MX target.com" (mail servers), "dig NS target.com" (nameservers), "dig axfr @nameserver target.com" (zone transfer attempt), "dig -x 1.2.3.4" (reverse lookup). Compare with nslookup (Windows-friendly, interactive mode). The CEH exam tests DNS record types and tools for DNS reconnaissance extensively.'},

{topic:1,diff:'hard',type:'Multiple Choice',
q:'What is competitive intelligence gathering, and what legal concerns apply?',
opts:['Hacking competitor systems to steal trade secrets  --  always illegal','Collecting publicly available information about competitors (financial reports, job postings, press releases, patents)  --  legal when using public sources; illegal if involving unauthorized access','Installing keyloggers on competitor employee computers  --  a gray area legally','Wiretapping competitor phone calls with a court order  --  legal with authorization'],
ans:1,hint:'The key distinction is public vs private sources.',
correct_fb:'<strong>Competitive intelligence (CI)</strong> collects publicly available information about competitors: SEC filings, annual reports, job postings (reveal tech stack), patent applications, press releases, LinkedIn data, conference presentations, and product teardowns. This is entirely legal. CI becomes illegal when it involves: accessing private systems, wiretapping, theft of trade secrets, or bribery of employees. Ethical CI uses only public sources.',
wrong_fb:'<strong>Legal CI = public sources only</strong>. Legal: annual reports, SEC filings, LinkedIn, job ads, patents, press releases, product teardowns, conference talks, news articles. Illegal: accessing private systems/emails, economic espionage (stealing trade secrets  --  federal crime), wiretapping without authorization. Job postings are a treasure trove of CI: they reveal what technologies the target uses, what they\'re building, and their organizational structure.'},

{topic:1,diff:'medium',type:'Multiple Choice',
q:'Which tool is described as a "visual link analysis" tool that maps connections between people, domains, IPs, and organizations?',
opts:['Nmap','Wireshark','Maltego','Metasploit'],
ans:2,hint:'This tool is famous for its graph-based visualization of OSINT relationships.',
correct_fb:'<strong>Maltego</strong> is an OSINT and threat intelligence platform that creates visual graphs mapping relationships between entities: people, email addresses, domains, IP addresses, phone numbers, social media profiles, and organizations. "Transforms" query external data sources (WHOIS, DNS, social media, Shodan, LinkedIn) to populate and expand the graph. Used for reconnaissance, threat intelligence, fraud investigation, and law enforcement.',
wrong_fb:'<strong>Maltego = visual OSINT relationship mapping</strong>. Key concept: "transforms" are API calls to external data sources that expand the entity graph automatically. Input one email address -> Maltego finds associated domains, social profiles, IP addresses, and related persons. Available in Community Edition (free, limited) and commercial versions. Competitors: SpiderFoot (more automated), Recon-ng (command-line, modular).'},

{topic:1,diff:'easy',type:'Multiple Choice',
q:'What is the difference between active and passive reconnaissance?',
opts:['Active uses computers; passive uses human intelligence','Passive gathers information without touching the target (public sources, OSINT); active directly interacts with target systems (scanning, probing)  --  passive is undetectable, active may be logged','Active is legal; passive is illegal','Passive is more thorough than active reconnaissance'],
ans:1,hint:'Active = you touch the target. Passive = you never touch the target.',
correct_fb:'<strong>Passive reconnaissance</strong>: gathering information without directly interacting with the target  --  WHOIS, DNS lookups against public servers, Google dorking, social media research, Shodan searches. Target cannot detect it. <strong>Active reconnaissance</strong>: directly interacting with target systems  --  port scanning, banner grabbing, sending probes. May generate logs, IDS alerts, and firewall entries. The CEH exam requires knowing which techniques are passive vs active.',
wrong_fb:'<strong>Passive = no direct target contact (undetectable)</strong>. <strong>Active = direct target contact (detectable)</strong>. Passive examples: WHOIS, DNS (public servers), Google hacking, Shodan, LinkedIn/social media, theHarvester. Active examples: Nmap port scan, banner grabbing (netcat/telnet to open ports), traceroute, OS fingerprinting (sending crafted packets). Always start with passive to avoid detection, then move to active once you understand the target.'},

// -- TOPIC 2: Scanning & Enumeration --
{topic:2,diff:'medium',type:'Multiple Choice',
q:'What Nmap flag enables aggressive scanning (OS detection + version detection + script scanning + traceroute)?',
opts:['-sS','-sV','-O','-A'],
ans:3,hint:'One flag does it all  --  aggressive mode.',
correct_fb:'<strong>Nmap -A</strong> enables "aggressive mode": OS detection (-O) + version detection (-sV) + default NSE scripts (-sC) + traceroute (--traceroute). It\'s the comprehensive reconnaissance option. Important: -A is very noisy  --  it generates significantly more traffic than a simple port scan and will almost certainly trigger IDS alerts. Use -sS for stealth; -A when thoroughness matters more than detection.',
wrong_fb:'<strong>Nmap -A = aggressive scan (all-in-one)</strong>. Individual flags: -sS (SYN scan), -sV (version detection), -O (OS detection), -sC (default scripts), --traceroute. -A combines them all. Nmap NSE (Nmap Scripting Engine) scripts extend functionality: vulnerability checks, brute-force, discovery, exploitation. "nmap --script vuln" runs all vulnerability detection scripts. Know the individual flags and what -A combines.'},

{topic:2,diff:'easy',type:'Multiple Choice',
q:'What does a port showing as "filtered" in Nmap mean?',
opts:['The port is open and accepting connections','The port is closed  --  the service is not running','A firewall or filter is blocking Nmap\'s probe  --  neither open nor closed can be determined','The port was filtered by Nmap due to false positive detection'],
ans:2,hint:'Filtered = something is blocking the probe  --  could be open or closed behind the filter.',
correct_fb:'<strong>Filtered</strong> means Nmap\'s probe was blocked  --  typically by a firewall, packet filter, or IDS dropping the packet. Nmap cannot determine if the port is open or closed. It receives no response (firewall drops/ignores) or an ICMP "administratively prohibited" message. Filtered doesn\'t mean the port is closed  --  it could be a listening service protected by a firewall. Use ACK scan (-sA) to further investigate filtering rules.',
wrong_fb:'Nmap port states: <strong>Open</strong> (service listening, SYN-ACK received), <strong>Closed</strong> (RST received, port reachable but no service), <strong>Filtered</strong> (probe blocked, firewall dropping packets  --  state unknown), <strong>Unfiltered</strong> (reachable but state undetermined  --  ACK scan result), <strong>Open|Filtered</strong> (either open or filtered  --  UDP/Xmas/NULL scan result on open ports), <strong>Closed|Filtered</strong> (either closed or filtered).'},

{topic:2,diff:'hard',type:'Multiple Choice',
q:'SMTP enumeration can be used to verify valid email addresses using which two commands?',
opts:['HELO and EHLO','VRFY and EXPN','MAIL FROM and RCPT TO','AUTH and LOGIN'],
ans:1,hint:'These commands were designed for administrative purposes but are abused for enumeration.',
correct_fb:'<strong>VRFY (Verify)</strong> checks if a user exists: "VRFY jsmith" -> "250 John Smith <jsmith@company.com>" (exists) or "550 No such user" (doesn\'t exist). <strong>EXPN (Expand)</strong> expands mailing list aliases to reveal all members. Both are SMTP commands used for email address enumeration. Most hardened mail servers disable VRFY and EXPN. Tool: smtp-user-enum. Nmap NSE script: smtp-enum-users.',
wrong_fb:'<strong>VRFY + EXPN = SMTP enumeration commands</strong>. VRFY confirms individual user existence. EXPN reveals all members of an email list/alias. Use: "telnet target.com 25" -> "EHLO test" -> "VRFY admin" -> observe response. Disabled on most modern mail servers for security. Detection: any VRFY/EXPN commands in mail logs should be investigated. Alternative: RCPT TO enumeration (some servers distinguish between valid/invalid recipients in bounce messages).'},

{topic:2,diff:'medium',type:'Multiple Choice',
q:'What is the default port for HTTPS?',
opts:['80','443','8080','8443'],
ans:1,hint:'HTTP uses 80; HTTPS adds security and uses the next well-known port.',
correct_fb:'<strong>HTTPS uses port 443</strong> by default. Important ports to memorize for CEH: HTTP=80, HTTPS=443, FTP=20/21, SSH=22, Telnet=23, SMTP=25, DNS=53, DHCP=67/68, POP3=110, IMAP=143, SNMP=161/162, LDAP=389, SMB=445, RDP=3389, MySQL=3306, PostgreSQL=5432, VNC=5900. The exam tests port numbers extensively.',
wrong_fb:'HTTPS = <strong>port 443</strong>. Critical port numbers for CEH: FTP=21, SSH=22, Telnet=23, SMTP=25, DNS=53, HTTP=80, HTTPS=443, SMB=445, LDAP=389, RDP=3389, SNMP=161. 8080 and 8443 are common alternative HTTP/HTTPS ports for web apps but are NOT the default standard ports. Memorize all well-known ports  --  the CEH exam tests them in scan output interpretation questions.'},

{topic:2,diff:'hard',type:'Multiple Choice',
q:'What is NetBIOS and on which ports does it operate?',
opts:['A routing protocol operating on ports 179 and 520','A Windows networking protocol operating on ports 137 (UDP/name services), 138 (UDP/datagram), and 139 (TCP/session)','A database protocol operating on port 1433','A remote desktop protocol operating on port 3389'],
ans:1,hint:'NetBIOS predates TCP/IP integration and uses three specific ports.',
correct_fb:'<strong>NetBIOS (Network Basic Input/Output System)</strong>: port <strong>137/UDP</strong> (Name Service  --  NetBIOS name registration and resolution), port <strong>138/UDP</strong> (Datagram Service  --  connectionless communication), port <strong>139/TCP</strong> (Session Service  --  connection-oriented communication). NetBIOS over TCP/IP (NBT) enables Windows file and printer sharing. Enumeration tool: nbtstat. Modern networks prefer SMB direct on port 445.',
wrong_fb:'NetBIOS ports: <strong>137/UDP</strong> (name service), <strong>138/UDP</strong> (datagram), <strong>139/TCP</strong> (session). Commands: "nbtstat -A [IP]" shows NetBIOS name table for remote system, "nbtstat -a [name]" resolves name to IP. NetBIOS enumeration reveals: computer name, domain/workgroup, logged-in user, MAC address, and running services. SMB over port 445 is the modern replacement but 139 remains for backward compatibility.'},

{topic:2,diff:'easy',type:'Multiple Choice',
q:'What is the purpose of the "nmap -sV" flag?',
opts:['Enables verbose output mode','Probes open ports to determine service versions and software running','Performs a stealth SYN scan','Scans only specific vulnerabilities'],
ans:1,hint:'V = Version detection.',
correct_fb:'<strong>Nmap -sV</strong> (Version Detection) sends additional probes to open ports and analyzes responses to determine: the service type, version number, and sometimes the OS/hostname. Example output: "80/tcp open http Apache httpd 2.4.41 ((Ubuntu))". This information enables targeted vulnerability research (CVE lookup for specific versions). Combine with -O for comprehensive target profiling: "nmap -sV -O target.com".',
wrong_fb:'<strong>Nmap -sV = service version detection</strong>. Without -sV, Nmap identifies ports as open based on protocol behavior. With -sV, it interrogates each open port to identify the specific software and version. More probes = more noise. Intensity: --version-intensity 0 (lightest) to 9 (most aggressive). Default is 7. The version info is critical for finding CVEs: knowing "Apache 2.4.41" lets you search for known vulnerabilities in that specific version.'},

// -- TOPIC 3: Sniffing & Evasion --
{topic:3,diff:'medium',type:'Multiple Choice',
q:'What is "session splicing" as an IDS evasion technique?',
opts:['Physically cutting network cables to disable IDS sensors','Splitting attack payloads across multiple small TCP segments that the IDS processes individually but reassembles incorrectly','Spoofing the TCP session source to confuse IDS correlation','Injecting fake sessions into IDS logs to create confusion'],
ans:1,hint:'Splice = split. The payload is divided across many tiny TCP segments.',
correct_fb:'<strong>Session splicing</strong> splits attack payloads across multiple small TCP segments. If the IDS inspects packets individually but uses a different TCP stream reassembly algorithm than the target host, it may miss the attack. Example: send "GET /c" in one segment, "gi-bin/attack.pl" in the next  --  IDS sees harmless fragments; target reassembles the complete attack. Tool: fragrouter. Modern IDS/NGFW perform full stream reassembly to counter this.',
wrong_fb:'<strong>Session splicing = payload split across tiny TCP segments</strong>. IDS evasion techniques: session splicing (tiny TCP segments), IP fragmentation (split across IP fragments), Unicode encoding (encode attack characters as unicode), polymorphic shellcode (change signature while keeping function), TTL manipulation (fragments expire at IDS but reach target), false positive flooding (overwhelming IDS alert queue). Modern NGFW/IDPS reassemble streams before inspection.'},

{topic:3,diff:'easy',type:'Multiple Choice',
q:'What is "promiscuous mode" on a network interface card?',
opts:['A mode that increases the NIC\'s transmission power','A mode where the NIC accepts ALL frames on the network segment, not just those addressed to its MAC address','A mode that encrypts all outgoing traffic','A diagnostic mode that disables the NIC\'s error checking'],
ans:1,hint:'Promiscuous = accepting everything  --  no filtering by destination MAC.',
correct_fb:'In <strong>promiscuous mode</strong>, the NIC accepts ALL frames on the segment regardless of destination MAC address. Normally, NICs only accept frames addressed to their MAC or broadcast. Promiscuous mode is required for packet sniffers (Wireshark, tcpdump) to capture network traffic. Detection: "ifconfig" shows "PROMISC" flag. Wireless equivalent: "monitor mode" captures all wireless frames regardless of BSSID.',
wrong_fb:'<strong>Promiscuous mode = accept all frames, not just your own MAC</strong>. Without promiscuous mode, the NIC hardware drops frames not addressed to it  --  before the OS or sniffer sees them. Enabling promiscuous mode lets Wireshark see all traffic (on a hub or via SPAN port). Switches limit promiscuous sniffing to your port only. To detect sniffers on a network: look for NICs in promiscuous mode (switch port monitoring, sending non-broadcast pings to watch for responses).'},

{topic:3,diff:'hard',type:'Multiple Choice',
q:'How does Ettercap perform ARP poisoning, and what can an attacker do once in a MITM position?',
opts:['Ettercap floods the network with SYN packets then intercepts responses','Ettercap sends gratuitous ARP replies poisoning victim and gateway ARP caches, redirecting traffic through the attacker  --  who can then sniff, inject, or modify traffic','Ettercap uses DNS poisoning to redirect traffic then intercepts it','Ettercap exploits ARP\'s authentication mechanism to steal session tokens'],
ans:1,hint:'Ettercap = the definitive ARP poisoning / MITM tool.',
correct_fb:'<strong>Ettercap</strong> sends <strong>gratuitous ARP replies</strong> to both the victim ("the gateway\'s MAC is mine") and the gateway ("the victim\'s MAC is mine"). Both update their ARP caches and route traffic through the attacker. Once in MITM position, Ettercap can: capture credentials (HTTP, FTP, Telnet), inject content into web pages, strip SSL (sslstrip plugin), perform DNS spoofing, and filter/modify traffic in real time.',
wrong_fb:'<strong>Ettercap = ARP poisoning -> MITM -> credential capture</strong>. ARP has no authentication  --  any host can send "I am 192.168.1.1, my MAC is XX:XX:XX:XX:XX:XX" and others will believe it. Ettercap automates this for both victim and gateway. MITM capabilities: credential sniffing (cleartext protocols), SSL stripping (downgrade HTTPS to HTTP), content injection (inject malicious JavaScript into HTTP pages), DNS spoofing. Defense: dynamic ARP inspection (DAI) on managed switches.'},

{topic:3,diff:'medium',type:'Multiple Choice',
q:'What is the purpose of Wireshark\'s "Follow TCP Stream" feature?',
opts:['To trace the TCP route packets take through the network','To reconstruct and display the complete conversation of a TCP session in human-readable form','To filter TCP packets by port number','To export TCP streams to a file for later analysis'],
ans:1,hint:'Stream = entire conversation, reconstructed from individual packets.',
correct_fb:'<strong>Follow TCP Stream</strong> reassembles all packets belonging to a single TCP connection and displays the complete application-layer conversation in order. This is essential for analyzing: HTTP requests/responses (including cleartext credentials), Telnet sessions, FTP commands, email content, and any other TCP-based protocol. To use: right-click any packet -> Follow -> TCP Stream. Displays client data (red) and server data (blue).',
wrong_fb:'<strong>Follow TCP Stream = reconstruct complete TCP conversation</strong>. Without this feature, you see individual packets which are hard to interpret. With it, you see the full HTTP request, the server response, any credentials passed, and the complete interaction. Key Wireshark skills for CEH: capture filters (before capture), display filters (after capture), Follow TCP/UDP/HTTP Stream, Export Objects (save files transferred), and Statistics menu for traffic analysis.'},

// -- TOPIC 4: System Hacking --
{topic:4,diff:'medium',type:'Multiple Choice',
q:'What is "credential dumping" and what tool is most commonly used for it on Windows?',
opts:['Exporting browser saved passwords using a browser extension; Chrome Password Exporter','Extracting authentication credentials from OS memory, registry, or files; Mimikatz','Brute-forcing Active Directory accounts; Hydra','Capturing credentials over the network using a sniffer; Wireshark'],
ans:1,hint:'Dumping = extracting from the system itself, not over the network.',
correct_fb:'<strong>Credential dumping</strong> extracts authentication credentials stored in OS memory, registry, or files. <strong>Mimikatz</strong> is the primary Windows credential dumping tool  --  it extracts from LSASS (Local Security Authority Subsystem Service): NTLM hashes (for pass-the-hash), Kerberos tickets (for pass-the-ticket), plaintext passwords (if WDigest enabled), and DPAPI keys. Requires administrator/SYSTEM privileges. Defenders use Credential Guard and LSA Protection to mitigate.',
wrong_fb:'<strong>Credential dumping = extracting stored credentials from OS</strong>. Windows credential storage locations: LSASS process memory (Mimikatz target), SAM database (hashed local account passwords), NTDS.dit (Active Directory database  --  domain account hashes), LSA secrets (registry), browser saved passwords. Mimikatz command: "sekurlsa::logonpasswords" dumps all current session credentials. Defense: Credential Guard (VBS-isolated LSASS), LSA Protection (PPL), JEA (Just Enough Administration).'},

{topic:4,diff:'easy',type:'Multiple Choice',
q:'What is "covering tracks" in the CEH attack methodology?',
opts:['Installing encryption on compromised systems to prevent forensic analysis','The final phase where attackers clear logs, delete files, and hide evidence of their presence to avoid detection and forensic analysis','Creating a false trail leading investigators to an innocent party','Installing backdoors for future access in a hidden directory'],
ans:1,hint:'It\'s the last thing an attacker does  --  remove evidence of the attack.',
correct_fb:'<strong>Covering tracks</strong> is the final CEH attack phase where attackers attempt to eliminate evidence of their activity: clearing Windows Event Logs, clearing bash/shell history (.bash_history), modifying file timestamps (timestomping), deleting log files, removing installed tools, and hiding malware. Tools: Metasploit\'s clearev command, Windows "wevtutil" utility. Defenders counter with: centralized log management (forward logs to SIEM immediately  --  local deletion is too late).',
wrong_fb:'<strong>Covering tracks = eliminating evidence of attack</strong>. Techniques: log clearing (wevtutil cl Application, Security, System), bash history wiping (history -c, unset HISTFILE), timestomping (modify file creation/modification times), rootkits (hide files/processes from OS), steganography (hide data in innocent files). Defense: real-time log forwarding to SIEM makes local log clearing useless  --  logs are already shipped. Immutable audit logs are the gold standard.'},

{topic:4,diff:'hard',type:'Multiple Choice',
q:'What is a "fileless malware" attack and why is it difficult to detect?',
opts:['Malware stored on very small files below antivirus detection thresholds','Malware that executes entirely in memory using legitimate system tools (PowerShell, WMI, certutil) without writing to disk  --  no file signature for traditional AV to scan','Malware hidden inside encrypted compressed archives','Malware that deletes itself after execution, leaving no traces on the file system'],
ans:1,hint:'No file = nothing for file-based antivirus to scan.',
correct_fb:'<strong>Fileless malware</strong> executes entirely in memory using legitimate Windows tools: PowerShell, WMI, certutil, mshta, regsvr32. No executable is written to disk  --  traditional signature-based AV has no file to scan. The attack lives in RAM and uses "living off the land" (LOLBins). Detection requires: behavioral analysis (EDR), memory scanning, PowerShell logging, and monitoring for unusual use of legitimate tools (e.g., PowerShell making outbound connections).',
wrong_fb:'<strong>Fileless malware = memory-only, uses legitimate tools</strong>. "Living off the land" (LOLBin) techniques: PowerShell (Invoke-Expression, DownloadString), WMI (persistence via WMI subscriptions), certutil (download files), regsvr32 (execute remote scripts), mshta (run HTML applications). Traditional AV fails because there\'s no malicious file. Detection: EDR (Endpoint Detection and Response), PowerShell ScriptBlock logging, Sysmon, behavioral anomaly detection.'},

{topic:4,diff:'medium',type:'Multiple Choice',
q:'What is Active Directory and why is it a primary target for attackers?',
opts:['A web server directory listing feature; targeted because it reveals file structure','Microsoft\'s centralized identity and access management system for Windows networks; targeted because compromising it gives an attacker control over ALL users, computers, and resources in the domain','A database server that stores all Windows passwords in plaintext; targeted for easy credential harvesting','A network scanning tool used for reconnaissance; targeted to disable detection capabilities'],
ans:1,hint:'Compromise the identity system = compromise everything it controls.',
correct_fb:'<strong>Active Directory (AD)</strong> is Microsoft\'s centralized LDAP-based directory service managing: user accounts, computer accounts, groups, GPOs (Group Policy), and authentication (Kerberos). Attackers target AD because: a Domain Admin account grants complete control over all systems in the domain, NTDS.dit (the AD database) contains all domain password hashes, and Kerberos tickets enable lateral movement and privilege escalation (Golden Ticket, Silver Ticket, DCSync attacks).',
wrong_fb:'<strong>Active Directory = domain control center</strong>. Compromising AD = game over for the defender. Key AD attack techniques: Pass-the-Hash (NTLM), Pass-the-Ticket (Kerberos TGT), Kerberoasting (crack service account hashes), AS-REP Roasting (crack accounts without Kerberos pre-auth), DCSync (replicate AD as a domain controller to extract all hashes), Golden Ticket (forge Kerberos TGT using KRBTGT hash). Tools: BloodHound (AD attack path mapping), Impacket, Mimikatz.'},

// -- TOPIC 5: Malware --
{topic:5,diff:'medium',type:'Multiple Choice',
q:'What is "polymorphic malware" and how does it evade detection?',
opts:['Malware that can infect multiple operating systems simultaneously','Malware that changes its code signature with each infection while maintaining its malicious functionality  --  evading signature-based detection','Malware that spreads through multiple infection vectors (email, USB, network)','Malware that affects multiple system components simultaneously'],
ans:1,hint:'Polymorphic = changes form. Signature-based AV looks for fixed patterns.',
correct_fb:'<strong>Polymorphic malware</strong> uses an encryption engine to re-encrypt its payload with a different key on each infection, changing its binary signature while preserving its malicious function. Each copy looks different to signature-based antivirus scanners. The mutation engine itself may also change. <strong>Metamorphic malware</strong> goes further  --  it rewrites its entire code logic, not just encrypting it. Both evade traditional signature-based AV.',
wrong_fb:'<strong>Polymorphic = changes signature on each infection (encrypted body, changing key)</strong>. <strong>Metamorphic</strong> = completely rewrites code logic each time (harder to detect). Traditional AV uses signatures (hashes of known malware)  --  if the signature changes, AV misses it. Defense: behavioral detection (EDR watches what code does, not what it looks like), sandboxing (detonate in isolated environment and observe behavior), heuristic analysis. Known polymorphic families: Storm Worm, Virut, Sality.'},

{topic:5,diff:'hard',type:'Multiple Choice',
q:'What is a "Remote Access Trojan" (RAT) and what capabilities does it typically provide?',
opts:['A Trojan that only provides read-only access to the infected system','A Trojan that provides an attacker with complete remote control over the infected machine: keylogging, webcam access, screen capture, file access, and command execution','A Trojan that remotely encrypts files for ransomware delivery','A Trojan that installs legitimate remote access software like TeamViewer'],
ans:1,hint:'RAT = full remote control as if sitting at the keyboard.',
correct_fb:'A <strong>RAT (Remote Access Trojan)</strong> provides the attacker with comprehensive covert remote control: keylogging, webcam/microphone capture, screen recording, file system access (upload/download), command execution, credential harvesting, process manipulation, and registry access. Notable RATs: DarkComet, njRAT, Gh0st RAT, Poison Ivy, QuasarRAT. Distribution: phishing emails, malicious downloads, drive-by downloads. Communication: typically encrypted C2 channel over HTTP/HTTPS.',
wrong_fb:'<strong>RAT = complete covert remote control</strong>. Capabilities: full keyboard/mouse control, screen viewing, keylogging, webcam/mic access, file management, command shell, process manipulation. Unlike legitimate remote tools (TeamViewer, RDP), RATs are covert  --  the victim doesn\'t know they\'re installed. Detection: endpoint monitoring for unusual outbound connections, process hollowing detection, behavioral analysis. Nation-state RATs: PlugX, Turla, HAMMERTOSS (use cloud services as C2 for stealth).'},

{topic:5,diff:'easy',type:'Multiple Choice',
q:'What type of malware is specifically designed to encrypt victim files and demand payment for decryption?',
opts:['Spyware','Adware','Ransomware','Rootkit'],
ans:2,hint:'Ransom + ware = software that demands a ransom.',
correct_fb:'<strong>Ransomware</strong> encrypts victim files (or locks the entire system) and demands payment  --  typically cryptocurrency  --  for the decryption key. Modern ransomware uses strong asymmetric encryption (RSA) to encrypt a symmetric key (AES), making brute-force decryption infeasible without the attacker\'s private key. Famous ransomware: WannaCry, NotPetya, REvil, DarkSide (Colonial Pipeline attack), LockBit. Recovery: offline backups, incident response, or ransom payment (not recommended).',
wrong_fb:'<strong>Ransomware = encrypt files + demand ransom</strong>. Evolution: early ransomware = screen lockers (easy to bypass). Modern = file-encrypting + double extortion (threaten to publish stolen data). Triple extortion = add DDoS threat. Business model: Ransomware-as-a-Service (RaaS)  --  developers provide ransomware kit; affiliates do the attacks; split the proceeds. Defense: offline/immutable backups, network segmentation, endpoint protection, email filtering, MFA.'},

// -- TOPIC 6: Wireless --
{topic:6,diff:'medium',type:'Multiple Choice',
q:'What is a "deauthentication attack" in wireless hacking and what does it enable?',
opts:['Permanently disabling wireless cards on nearby devices','Sending spoofed 802.11 deauthentication frames to force clients to disconnect from their AP  --  enabling capture of the WPA2 4-way handshake when they reconnect','Blocking all wireless communication in an area to perform a DoS attack','Bypassing WPA2 encryption by forcing the client to use WEP instead'],
ans:1,hint:'Force a disconnect, capture the reconnection  --  that reconnection has the handshake.',
correct_fb:'A <strong>deauthentication (deauth) attack</strong> sends spoofed 802.11 management frames telling clients they have been deauthenticated from the AP. Since 802.11 management frames are unauthenticated (pre-802.11w), clients accept them regardless of source. When clients reconnect, they perform the WPA2 4-way handshake  --  which the attacker captures with airodump-ng. Tool: aireplay-ng -0. WPA3 and 802.11w (Management Frame Protection) prevent this.',
wrong_fb:'<strong>Deauth attack = force disconnect -> capture reconnection handshake</strong>. Command: "aireplay-ng -0 5 -a [AP-MAC] -c [Client-MAC] mon0" (send 5 deauth frames). Clients disconnect and reconnect -> 4-way WPA2 handshake captured by airodump-ng. Then crack offline: "aircrack-ng capture.cap -w wordlist.txt". Defense: 802.11w (Protected Management Frames/MF Protection)  --  makes deauth frames cryptographically protected; WPA3-SAE is immune. Enable MFP on all modern APs.'},

{topic:6,diff:'hard',type:'Multiple Choice',
q:'What is WPA3 and how does it improve on WPA2?',
opts:['WPA3 is simply WPA2 with a longer password requirement','WPA3 introduces SAE (Simultaneous Authentication of Equals) replacing PSK  --  providing forward secrecy, resistance to offline dictionary attacks, and protection against KRACK-type attacks','WPA3 removes encryption entirely in favor of MAC address filtering','WPA3 is only for enterprise networks and cannot be used for home networks'],
ans:1,hint:'SAE is the key innovation  --  a fundamentally different handshake.',
correct_fb:'<strong>WPA3</strong> introduces <strong>SAE (Simultaneous Authentication of Equals)</strong>  --  a Diffie-Hellman-based authentication replacing PSK. Key improvements: (1) <strong>Forward secrecy</strong>  --  capturing the handshake doesn\'t help crack the password even if the password is known later, (2) <strong>Offline dictionary attack resistance</strong>  --  SAE requires interaction with the AP for each guess (no offline cracking), (3) <strong>KRACK resistance</strong>, (4) Protected Management Frames mandatory.',
wrong_fb:'<strong>WPA3-SAE vs WPA2-PSK</strong>: WPA2 PSK handshake can be captured and cracked offline (just need the 4-way handshake + wordlist). WPA3 SAE requires an interaction with the AP for every password attempt  --  offline cracking is impossible. WPA3-Enterprise adds 192-bit security. WPA3-Personal uses SAE with a new "password element" per session. Transitional mode allows WPA2 and WPA3 clients simultaneously. Dragonblood attack (2019) found some SAE vulnerabilities  --  since patched.'},

{topic:6,diff:'easy',type:'Multiple Choice',
q:'What is "war chalking"?',
opts:['Writing malware on a chalkboard for educational purposes','Marking symbols on sidewalks or walls to indicate nearby wireless network characteristics (open, secured, speed) discovered during war driving','Using chalk to mark physical entry points during a physical security assessment','Drawing network diagrams with chalk to plan a wireless attack'],
ans:1,hint:'War driving discovers networks; war chalking marks what was discovered.',
correct_fb:'<strong>War chalking</strong> involves drawing symbols in public places (sidewalks, walls, curbs) to indicate nearby wireless networks discovered during war driving: open circle = open network (SSID, bandwidth), half circles back-to-back = closed network, circle with W inside = WEP-protected. Originated as a community practice (sharing free WiFi locations) but obviously useful for attackers. Largely obsolete with smartphone apps that display the same info digitally.',
wrong_fb:'<strong>War chalking = physical marking of discovered wireless networks</strong>. Related activities: War driving (mobile wireless discovery), War walking (on foot), War flying (from aircraft), War chalking (marking discoveries). All primarily passive reconnaissance. Wigle.net maps discovered networks globally  --  a massive passive wireless intelligence database. Modern equivalent: WiFi analyzer apps that show all networks, signal strength, encryption type, and channel info.'},

// -- TOPIC 7: Web App Attacks --
{topic:7,diff:'medium',type:'Multiple Choice',
q:'What is the OWASP Top 10 and why is it significant?',
opts:['A list of the 10 most powerful hacking tools','A list of the 10 most critical web application security risks maintained by OWASP  --  the industry-standard reference for web app security','A ranking of the top 10 web application firewall vendors','A list of 10 mandatory security controls for web applications'],
ans:1,hint:'OWASP = Open Web Application Security Project  --  they maintain the definitive web vulnerability list.',
correct_fb:'The <strong>OWASP Top 10</strong> is the industry-standard awareness document listing the most critical web application security risks. Current (2021) Top 10: A01-Broken Access Control, A02-Cryptographic Failures, A03-Injection (SQLi/LDAP), A04-Insecure Design, A05-Security Misconfiguration, A06-Vulnerable Components, A07-Authentication Failures, A08-Integrity Failures, A09-Logging Failures, A10-SSRF. Used by developers, testers, and organizations worldwide as a security baseline.',
wrong_fb:'<strong>OWASP Top 10 = most critical web app vulnerabilities</strong>. 2021 list: Broken Access Control (#1  --  overtaking Injection), Cryptographic Failures (#2), Injection (#3  --  SQLi, LDAP, OS command), Insecure Design (#4  --  new category), Security Misconfiguration (#5), Vulnerable/Outdated Components (#6), Identification/Authentication Failures (#7), Software/Data Integrity Failures (#8), Logging/Monitoring Failures (#9), SSRF (#10  --  new). The CEH exam references OWASP extensively for web application security.'},

{topic:7,diff:'hard',type:'Multiple Choice',
q:'What is Server-Side Request Forgery (SSRF) and why was it added to the OWASP Top 10?',
opts:['A client-side attack where the browser is tricked into making requests','A vulnerability where an attacker tricks the server into making HTTP requests to internal resources  --  bypassing firewalls and accessing internal services not exposed to the internet','A forged SSL certificate attack targeting servers','An attack that spoofs server responses to manipulate client-side data'],
ans:1,hint:'The SERVER makes the forged request  --  to resources the attacker can\'t reach directly.',
correct_fb:'<strong>SSRF (Server-Side Request Forgery)</strong>: the attacker tricks a server into making HTTP requests to an internal target. Example: a web app fetches URLs provided by users (image loading, webhooks, PDF generators). Attacker provides: "http://169.254.169.254/latest/meta-data/" (AWS metadata service) -> server fetches it -> returns cloud credentials to attacker. SSRF can reach: internal APIs, admin panels, cloud metadata, and services behind firewalls.',
wrong_fb:'<strong>SSRF = server fetches attacker-specified internal URLs</strong>. Classic target: AWS EC2 metadata (169.254.169.254)  --  returns IAM credentials for the instance. Other targets: internal admin panels (http://localhost:8080/admin), internal APIs, Redis/Memcached (accessing cache), SMTP relay (internal email server). Defense: validate/whitelist allowed URLs, block outbound requests to internal ranges (169.254.x.x, 10.x, 172.16-31.x, 192.168.x), use cloud IMDSv2 (requires token).'},

{topic:7,diff:'medium',type:'Multiple Choice',
q:'What is HTTP response splitting and what attack does it enable?',
opts:['Splitting the HTTP response between multiple servers for load balancing','Injecting CRLF characters into HTTP headers to inject malicious content into responses  --  enabling cache poisoning, XSS, and session hijacking','Splitting responses across multiple packets to evade IDS inspection','Dividing HTTP traffic between multiple paths for redundancy'],
ans:1,hint:'CRLF = Carriage Return Line Feed  --  what happens when you inject these into HTTP headers?',
correct_fb:'<strong>HTTP Response Splitting</strong> injects <strong>CRLF (\\r\\n) characters</strong> into HTTP response headers. HTTP uses CRLF to separate headers and body  --  injecting them lets attackers control the response structure, injecting additional headers or creating entirely new HTTP responses. Enables: cache poisoning (poison proxy caches to serve malicious content to all users), reflected XSS, session hijacking, and cross-user defacement.',
wrong_fb:'<strong>HTTP Response Splitting = CRLF injection into HTTP headers</strong>. The attack injects "\\r\\n" into header values, tricking the server/proxy into treating injected content as separate HTTP headers or a new HTTP response. Example: injecting into a "Location:" redirect header to add arbitrary headers. Prevention: sanitize all user input before including in HTTP response headers, specifically remove CR (\\r) and LF (\\n) characters.'},

{topic:7,diff:'easy',type:'Multiple Choice',
q:'What does "input validation" prevent and why is it the first line of defense for web applications?',
opts:['Validates that users have the correct credentials before allowing access','Ensures user-supplied data conforms to expected format, type, and range  --  preventing injection attacks (SQLi, XSS, command injection) by rejecting or sanitizing malicious input','Validates SSL certificates for HTTPS connections','Verifies that web server configurations meet security standards'],
ans:1,hint:'Validate the input before trusting it  --  never trust user input.',
correct_fb:'<strong>Input validation</strong> verifies that all user-supplied data (form fields, URL parameters, HTTP headers, API inputs) conforms to expected values before processing. Types: whitelist validation (only allow known-good patterns  --  stronger), blacklist validation (block known-bad patterns  --  weaker, can be bypassed). Prevents: SQLi (unexpected SQL characters), XSS (HTML/JavaScript characters), command injection (shell metacharacters), path traversal (../ sequences), buffer overflows (excessively long inputs).',
wrong_fb:'<strong>Input validation = never trust user input</strong>. Best approach: whitelist validation (define exactly what\'s allowed; reject everything else). Blacklisting (blocking known bad) is weaker  --  always some bypass exists. Both client-side (UX) and server-side (security  --  MUST DO BOTH) validation needed. Client-side alone is trivially bypassed (intercept with Burp Suite). Defense in depth: validate input + parameterize queries + encode output + WAF.'},

// -- TOPIC 8: Cryptography --
{topic:8,diff:'medium',type:'Multiple Choice',
q:'What is the difference between SSL and TLS?',
opts:['They are completely different protocols with no relationship','TLS is the modern successor to SSL  --  SSL has known vulnerabilities (POODLE, BEAST) and is deprecated; TLS 1.2 and 1.3 are the current secure versions','SSL is stronger than TLS because it uses larger key sizes','TLS is only for email encryption; SSL is for web traffic'],
ans:1,hint:'TLS evolved from SSL  --  SSL is now completely deprecated and broken.',
correct_fb:'<strong>TLS (Transport Layer Security)</strong> is the modern replacement for <strong>SSL (Secure Sockets Layer)</strong>. SSL was deprecated after multiple attacks: POODLE (SSLv3), BEAST (SSL 3.0/TLS 1.0), and DROWN (SSLv2 shares keys with TLS). TLS 1.0 and 1.1 are also deprecated. <strong>TLS 1.2</strong> is the minimum acceptable standard; <strong>TLS 1.3</strong> (2018) is the gold standard  --  mandatory forward secrecy, simplified handshake, removed weak algorithms.',
wrong_fb:'<strong>SSL is deprecated and broken  --  use TLS 1.2+ (TLS 1.3 preferred)</strong>. SSL/TLS attacks: POODLE (SSL 3.0), BEAST (TLS 1.0 CBC), CRIME (TLS compression), BREACH (HTTP compression), Heartbleed (OpenSSL bug, not protocol), DROWN (SSLv2), FREAK, Logjam (weak DH). TLS 1.3 eliminates many attack vectors: no RSA key exchange, no CBC mode ciphers, no compression, mandatory ECDHE (forward secrecy), simplified handshake (1-RTT). "Always use TLS 1.3" is the security best practice.'},

{topic:8,diff:'hard',type:'Multiple Choice',
q:'What is the Diffie-Hellman key exchange and what problem does it solve?',
opts:['A method for two parties to authenticate each other over an insecure channel','A method for two parties to establish a shared secret over an insecure channel without prior shared knowledge  --  solving the key distribution problem for symmetric encryption','A digital signature algorithm that proves message integrity','A key derivation function for generating encryption keys from passwords'],
ans:1,hint:'Two people, public channel, end up with the same secret that eavesdroppers can\'t determine.',
correct_fb:'<strong>Diffie-Hellman (DH)</strong> allows two parties to establish a shared secret over an insecure channel. Both parties exchange public values (g, p, public key); the math ensures they both derive the same shared secret, but an eavesdropper watching the exchange cannot compute it (discrete logarithm problem). This shared secret is then used as a symmetric key. DH doesn\'t provide authentication  --  it\'s vulnerable to MITM unless combined with signatures (ECDHE + RSA/ECDSA in TLS).',
wrong_fb:'<strong>Diffie-Hellman = key exchange, not encryption</strong>. Solves: "How do Alice and Bob agree on a symmetric key if they\'ve never met and only have an insecure channel?" DH math: both parties choose secret values, exchange public values, and independently compute the same shared secret. Eavesdropper sees the public values but computing the secret requires solving the discrete logarithm problem (computationally infeasible). ECDHE = Elliptic Curve DH Ephemeral  --  provides forward secrecy; used in TLS 1.3.'},

{topic:8,diff:'easy',type:'Multiple Choice',
q:'What is AES and why is it considered the gold standard for symmetric encryption?',
opts:['Advanced Encryption System; it uses variable-length keys making it immune to brute force','Advanced Encryption Standard; a block cipher with 128/192/256-bit key sizes, no known practical attacks, and widely implemented in hardware  --  fast and secure','Asymmetric Encryption Standard; it uses public/private key pairs for secure communication','Authenticated Encryption Scheme; it provides both encryption and authentication in one operation'],
ans:1,hint:'AES = the NIST-selected replacement for DES after a public competition.',
correct_fb:'<strong>AES (Advanced Encryption Standard)</strong> is a symmetric block cipher standardized by NIST in 2001 (replacing DES). Key sizes: 128-bit (AES-128), 192-bit (AES-192), 256-bit (AES-256). Block size: always 128 bits. No known practical attacks against AES itself (brute force requires 2^128 operations minimum). Widely implemented in hardware (AES-NI instruction set). Modes: ECB (insecure), CBC, CTR, GCM (authenticated encryption  --  preferred).',
wrong_fb:'<strong>AES = gold standard symmetric cipher</strong>. Why better than DES: DES = 56-bit key (cracked in 22 hours in 1999). 3DES = three DES passes (slow, being phased out). AES = 128/192/256-bit keys, fast hardware support, no practical attacks. AES modes: ECB (never use  --  identical plaintext blocks produce identical ciphertext blocks, reveals patterns), CBC (adds IV, better), CTR (stream mode, parallelizable), GCM (provides authenticated encryption  --  both confidentiality and integrity). Always use AES-GCM or AES-CBC with HMAC.'},

// -- TOPIC 9: Social Engineering --
{topic:9,diff:'medium',type:'Multiple Choice',
q:'What is "vishing" and why is it particularly effective?',
opts:['Video-based phishing using deepfake technology','Voice phishing  --  using phone calls to manipulate targets into revealing information or performing actions; effective because people naturally trust voice communication and feel social pressure in real-time conversations','Phishing using VPN connections to appear as internal users','Phishing through virtual reality environments'],
ans:1,hint:'Voice + phishing = a portmanteau.',
correct_fb:'<strong>Vishing (Voice Phishing)</strong> uses phone calls to social engineer victims. Attackers impersonate: IT support, bank fraud departments, IRS agents, Microsoft support, or company executives. Effectiveness: real-time conversation creates social pressure, authority is easily faked over phone, caller ID spoofing adds credibility, and people are less suspicious of phone calls vs emails. Tools: VoIP dialers, caller ID spoofing services. Mitigation: call-back verification through official numbers.',
wrong_fb:'<strong>Vishing = phone call social engineering</strong>. Classic scenarios: "This is Microsoft support  --  your computer has a virus, let me help you fix it remotely" (gets remote access), "This is IRS  --  you owe taxes, pay now or face arrest" (creates fear), "This is your bank fraud department  --  confirm your card number" (steals credentials). Defense: never give sensitive info to inbound callers; always hang up and call back through official numbers you looked up independently.'},

{topic:9,diff:'hard',type:'Multiple Choice',
q:'What is "quid pro quo" in social engineering?',
opts:['A Latin legal term used in social engineering contracts','A social engineering technique where an attacker offers a service or benefit in exchange for information or access  --  exploiting the reciprocity principle','A type of phishing email that appears to come from a legitimate business','A technique for recording conversations without detection'],
ans:1,hint:'Quid pro quo = Latin for "something for something"  --  a trade.',
correct_fb:'"<strong>Quid pro quo</strong>" social engineering offers the victim something valuable in exchange for information or access. Examples: "I\'m from IT support  --  let me fix your computer problem if you give me your login credentials," or offering free merchandise in exchange for survey responses that include personal details. Exploits the <strong>reciprocity principle</strong> (Cialdini)  --  people feel obligated to give when they receive. More active than baiting.',
wrong_fb:'<strong>Quid pro quo = offer something to get something</strong>. The attacker takes the initiative (vs baiting which passively lures). Classic quid pro quo: call random employees claiming to be IT support, offer to help with computer problems -> ask for credentials to "fix" them. Very effective because targets feel they\'re getting help AND feel obligated to reciprocate. Defense: security awareness training, no legitimate IT support will EVER ask for your password.'},

{topic:9,diff:'easy',type:'Multiple Choice',
q:'What is "phishing" and what makes a phishing email believable?',
opts:['A network scanning technique that mimics legitimate traffic','A social engineering attack using fraudulent emails that appear to come from trusted sources to trick recipients into revealing credentials or clicking malicious links','A password cracking technique that uses wordlists','A wireless attack that impersonates legitimate networks'],
ans:1,hint:'Phishing = fishing for credentials using fake bait (fraudulent emails).',
correct_fb:'<strong>Phishing</strong> sends fraudulent emails masquerading as trusted sources (banks, Microsoft, employers, colleagues). Elements that make phishing convincing: spoofed sender address (display name manipulation, similar domain names  --  "paypa1.com"), legitimate-looking logos and formatting, urgency ("Your account will be suspended"), fear ("Unauthorized access detected"), and authority ("IT Security Team  --  action required"). Targets: credentials, credit cards, malware installation.',
wrong_fb:'<strong>Phishing = fraudulent emails impersonating trusted entities</strong>. Indicators to look for: hover over links (check actual URL vs displayed text), check sender domain carefully (paypa1.com vs paypal.com), unexpected urgency or fear, requests for credentials via email (no legitimate organization does this), grammar/spelling errors (less common in sophisticated attacks). Technical defenses: SPF, DKIM, DMARC (email authentication), email security gateways, sandboxing attachments.'},

// -- TOPIC 10: DoS & Session Hijacking --
{topic:10,diff:'hard',type:'Multiple Choice',
q:'What is a "Ping of Death" attack and is it still relevant today?',
opts:['Sending millions of normal pings to overwhelm a target; still widely used','Sending an oversized ICMP packet (>65,535 bytes) that caused buffer overflows and crashes in older systems; largely patched and no longer effective against modern systems','A technique for killing network connections by sending RST packets disguised as pings','Sending pings from multiple sources simultaneously to overwhelm a target'],
ans:1,hint:'Death = it kills the target. The packet is malformed/oversized.',
correct_fb:'<strong>Ping of Death</strong>: sends ICMP Echo Request packets fragmented to exceed the maximum IP packet size (65,535 bytes). When the target reassembles the fragments, the oversized packet causes buffer overflow and system crash. This was a significant attack in the 1990s against Windows 95/NT and early Linux. Virtually all modern systems are patched against this. Still appears on CEH exam as historical knowledge.',
wrong_fb:'<strong>Ping of Death = oversized ICMP -> buffer overflow -> crash</strong>. Maximum legitimate IP packet = 65,535 bytes. Ping of Death creates fragmented packets that reassemble to exceed this limit. Patched in modern OSes. Other ICMP attacks: Smurf attack (ICMP amplification using broadcast addresses), ICMP flood (simple volumetric DoS). Modern DoS attacks: DDoS botnets, amplification attacks (DNS, NTP, Memcached), application-layer floods (HTTP flood, Slowloris).'},

{topic:10,diff:'medium',type:'Multiple Choice',
q:'What is a "Smurf attack" and which protocol/feature does it abuse?',
opts:['A DoS attack using Smurfs cartoon themed malware payloads','An amplification DoS attack that sends ICMP Echo Requests to broadcast addresses with the victim\'s spoofed IP  --  all hosts on the subnet reply to the victim, amplifying the attack traffic','A brute-force attack against Smurf cipher used in legacy wireless networks','A social engineering attack using cartoon avatars to appear non-threatening'],
ans:1,hint:'Broadcast + IP spoofing = amplification.',
correct_fb:'The <strong>Smurf attack</strong>: attacker sends ICMP Echo Requests to a network\'s <strong>broadcast address</strong> with the <strong>victim\'s IP spoofed</strong> as source. Every host on the subnet replies to the (spoofed) victim  --  potentially hundreds of replies per request (amplification). The victim is flooded with ICMP Echo Replies it never requested. Mitigation: configure routers to not forward directed broadcasts (no ip directed-broadcast on Cisco), BCP38 anti-spoofing.',
wrong_fb:'<strong>Smurf attack = ICMP broadcast amplification</strong>. Amplification factor = number of hosts on the network. 100-host network = 100x amplification of attacker\'s traffic. Mitigation: "no ip directed-broadcast" on all routers (prevents forwarding broadcast-addressed packets), BCP38 ingress filtering (prevents IP spoofing at ISP level). Now largely historical  --  most routers disable directed broadcast forwarding by default. Similar: Fraggle attack (same concept using UDP instead of ICMP).'},

{topic:10,diff:'easy',type:'Multiple Choice',
q:'What TCP flag combination indicates a connection is being properly closed (graceful termination)?',
opts:['RST+ACK sent from the server','FIN -> FIN-ACK -> ACK sequence (TCP four-way teardown) between both parties','SYN+RST sent by client','URG+PSH+FIN sent simultaneously'],
ans:1,hint:'Graceful closure is polite  --  both sides acknowledge the end.',
correct_fb:'TCP <strong>graceful termination</strong> uses a four-way FIN handshake: (1) Party A sends FIN (done sending), (2) Party B sends ACK (received your FIN), (3) Party B sends its own FIN (also done sending), (4) Party A sends ACK (received your FIN). Both sides explicitly close their half of the connection. Compare with <strong>RST</strong>: abrupt termination  --  immediately closes the connection without a graceful handshake (used for error conditions).',
wrong_fb:'<strong>Graceful TCP close = FIN -> ACK -> FIN -> ACK (four-way)</strong>. FIN = "I\'m done sending" (but can still receive). ACK = "I received your FIN." Four-way because both sides independently close. RST = abrupt/abnormal termination (connection refused, or forced close). For CEH: SYN (open), FIN (close gracefully), RST (close abruptly), ACK (acknowledge), PSH (push data immediately), URG (urgent data). Nmap uses these flags to craft various scan types.'},

// -- TOPIC 11: Cloud & IoT --
{topic:11,diff:'medium',type:'Multiple Choice',
q:'What is "insecure API" as a cloud threat and why does it matter?',
opts:['APIs that run too slowly to be secure against timing attacks','Cloud management APIs with insufficient authentication, authorization, or encryption  --  giving attackers a pathway to cloud resources that bypasses traditional network perimeter defenses','APIs that use deprecated SSL/TLS versions','APIs that expose internal database schemas to authenticated users'],
ans:1,hint:'Cloud is managed via APIs  --  unsecured APIs = unsecured cloud.',
correct_fb:'<strong>Insecure APIs</strong> are a top cloud security risk because cloud infrastructure is managed almost entirely through APIs (AWS, Azure, GCP management APIs). Vulnerabilities include: missing authentication, broken object-level authorization (BOLA), excessive data exposure, lack of rate limiting, and injection vulnerabilities in API parameters. Attackers who exploit cloud management APIs can: create/delete resources, access all stored data, escalate privileges, and move across the entire cloud estate.',
wrong_fb:'<strong>Insecure cloud APIs = complete cloud compromise risk</strong>. Cloud API threats: No authentication (open APIs), Broken authentication (weak tokens, no MFA), Broken authorization (BOLA/IDOR  --  access other users\' resources), Exposed secrets in API responses, Injection in API parameters, Missing rate limiting (brute-force). OWASP API Security Top 10 (2023) covers these. Defense: API gateway with authentication, OAuth 2.0/JWT, rate limiting, input validation, penetration testing of all APIs.'},

{topic:11,diff:'hard',type:'Multiple Choice',
q:'What is "cloud account hijacking" and how is it typically performed?',
opts:['Physically stealing server hardware from a cloud data center','Gaining unauthorized access to cloud accounts through: credential theft (phishing/credential stuffing), exploiting misconfigured IAM, stealing API keys from code repositories, or session token theft','Breaking into cloud data centers using physical social engineering','Installing malware on cloud provider infrastructure to access tenant accounts'],
ans:1,hint:'The account = the key to everything in the cloud.',
correct_fb:'<strong>Cloud account hijacking</strong> gains unauthorized access to cloud accounts  --  giving the attacker complete control over all cloud resources. Common methods: (1) Phishing for cloud console credentials, (2) Credential stuffing (reusing breached passwords), (3) Stolen API keys/access tokens committed to GitHub, (4) Misconfigured IAM (overly permissive roles/policies), (5) Session token theft, (6) MFA bypass. Impact: data exfiltration, ransomware deployment, cryptomining, resource abuse.',
wrong_fb:'<strong>Cloud account hijacking = unauthorized cloud console/API access</strong>. #1 source of cloud breaches: misconfiguration + exposed credentials. API keys in public GitHub repos are found within minutes by automated scanners (gitrob, truffleHog). Defense: MFA on all cloud accounts, rotate API keys regularly, use instance roles instead of static keys, enable AWS CloudTrail/Azure Monitor/GCP Cloud Audit Logs, alert on unusual API calls, implement least-privilege IAM policies.'},

{topic:11,diff:'easy',type:'Multiple Choice',
q:'In cloud security, what does "data at rest" encryption protect against?',
opts:['Interception of data as it moves across networks','Unauthorized access to stored data if physical storage media is stolen, improperly decommissioned, or if cloud storage is misconfigured and exposed','Timing attacks on encryption algorithms during processing','Side-channel attacks on CPU processing of data'],
ans:1,hint:'At rest = stored, not moving.',
correct_fb:'<strong>Data at rest encryption</strong> protects stored data from unauthorized access when: storage media is physically stolen, drives are improperly decommissioned (without wiping), cloud storage buckets are accidentally made public, or database files are accessed without going through the application. Examples: AES-256 encryption of S3 buckets, database transparent data encryption (TDE), full-disk encryption (BitLocker, FileVault). Compare with <strong>data in transit</strong> encryption (TLS/HTTPS  --  protects moving data).',
wrong_fb:'<strong>Data at rest = stored data encryption</strong>. Three states of data: At Rest (stored in databases, files, cloud storage), In Transit (moving over networks  --  protect with TLS), In Use (actively being processed in CPU/RAM  --  protect with secure enclaves). Cloud at-rest encryption: AWS S3 SSE (server-side encryption), Azure Storage Service Encryption, GCP Cloud Storage encryption. Always enable at-rest encryption for: databases, backups, object storage, and disk volumes containing sensitive data.'},
// -- TOPIC 0: Ethical Hacking --
{topic:0,diff:'medium',type:'Multiple Choice',
q:'What is a "zero-day vulnerability"?',
opts:['A vulnerability that has existed for zero days before being exploited','A vulnerability that is unknown to the software vendor and has no patch available  --  attackers exploit it before defenders can respond','A vulnerability rated zero on the CVSS scale, meaning it poses no risk','A vulnerability that only works on the day it is discovered'],
ans:1,hint:'Zero days = zero days of warning for the defender.',
correct_fb:'A <strong>zero-day (0-day)</strong> is a vulnerability that is <strong>unknown to the vendor</strong>  --  there are literally zero days of advance notice for defenders. No patch exists. Attackers who discover or purchase zero-days have a significant advantage. Nation-states and APT groups stockpile zero-days (e.g., NSA\'s EternalBlue). Once discovered/disclosed: it becomes a CVE, vendors race to patch, and it\'s no longer a zero-day.',
wrong_fb:'<strong>Zero-day = unknown vulnerability, no patch exists</strong>. Value: very high (sold on dark web for millions). Examples: Stuxnet used 4 simultaneous zero-days; EternalBlue (MS17-010) was an NSA zero-day leaked by Shadow Brokers. Timeline: discovery -> exploitation (0-day) -> disclosure -> patch (N-day after patch). Defense against zero-days: defense-in-depth, behavioral detection, network segmentation, least privilege (limit blast radius).'},

{topic:0,diff:'easy',type:'Multiple Choice',
q:'What does "CVSS" stand for and what does it measure?',
opts:['Certified Vulnerability Security Score; measures how many systems are affected','Common Vulnerability Scoring System; a standardized framework for rating the severity of security vulnerabilities on a 0-10 scale','Cyber Vulnerability Severity System; measures attacker sophistication required','Comprehensive Vulnerability Scanning System; measures scan coverage'],
ans:1,hint:'It\'s the industry-standard way to rate how bad a vulnerability is.',
correct_fb:'<strong>CVSS (Common Vulnerability Scoring System)</strong> rates vulnerability severity from 0.0 to 10.0. Score ranges: None (0.0), Low (0.1-3.9), Medium (4.0-6.9), High (7.0-8.9), Critical (9.0-10.0). Factors: Base metrics (attack vector, complexity, privileges needed, user interaction, impact on CIA), Temporal metrics (exploit availability, patch status), Environmental metrics (organizational context). Used universally for vulnerability prioritization.',
wrong_fb:'<strong>CVSS = standardized vulnerability severity scoring (0-10)</strong>. Critical = 9-10 (remote, no auth, high impact). High = 7-8.9. Medium = 4-6.9. Low = 0.1-3.9. CVSS v3.1 is current. Attack Vector options: Network (worst), Adjacent, Local, Physical (best). Patch prioritization: always address Critical and High first. Published in NVD (National Vulnerability Database) alongside CVE identifiers.'},

{topic:0,diff:'hard',type:'Multiple Choice',
q:'What is an APT (Advanced Persistent Threat) and what distinguishes it from opportunistic attacks?',
opts:['An automated phishing tool that persists across email platform changes','A sophisticated, long-term targeted attack  --  typically nation-state or organized crime  --  that establishes covert persistent access to a specific target for espionage or sabotage rather than immediate gain','An advanced port scanner that persists its results across multiple sessions','A persistent malware that automatically patches itself against antivirus detection'],
ans:1,hint:'Advanced = skilled, Persistent = long-term, Threat = specific actor.',
correct_fb:'An <strong>APT</strong> is characterized by: <strong>Targeted</strong> (specific organization, not random), <strong>Persistent</strong> (months/years of access, not smash-and-grab), <strong>Stealthy</strong> (evades detection, moves slowly), <strong>Well-resourced</strong> (nation-states, organized crime). Phases: Reconnaissance -> Initial compromise -> Establish foothold -> Escalate -> Internal recon -> Move laterally -> Maintain presence -> Complete mission. Examples: APT28/Fancy Bear (Russia), APT41 (China), Lazarus Group (North Korea).',
wrong_fb:'<strong>APT = targeted, long-term, stealthy, well-resourced</strong>. vs opportunistic attacks (script kiddies scanning for easy targets). APT Tactics: spear phishing for initial access, living off the land (LOLBins), custom malware, slow and low to avoid detection. Detection challenges: APTs use legitimate tools, blend with normal traffic, have long dwell times (avg 197 days before detection per Mandiant). Defense: threat hunting, behavioral analytics, zero trust architecture, network segmentation.'},

// -- TOPIC 1: Reconnaissance --
{topic:1,diff:'medium',type:'Multiple Choice',
q:'What is "footprinting" and how does it relate to reconnaissance?',
opts:['Installing tracking software on target systems','Passive information gathering about a target  --  used interchangeably with reconnaissance in CEH terminology  --  collecting data without direct system contact','Mapping the physical footprint of a data center','Creating a digital forensic footprint for legal proceedings'],
ans:1,hint:'In CEH, footprinting and reconnaissance are used interchangeably.',
correct_fb:'In <strong>CEH terminology, footprinting and reconnaissance are interchangeable</strong>. Footprinting systematically collects information about a target: IP addresses, domain information, employee names, technologies, physical locations, and organizational structure. Types: Passive (public sources, no target contact), Active (direct probing, detectable). Goal: build a comprehensive target profile to identify attack vectors before active testing begins.',
wrong_fb:'<strong>Footprinting = reconnaissance = information gathering phase</strong>. CEH specifically uses these terms interchangeably. Footprinting tools: WHOIS, DNS enumeration (dig, nslookup), Google hacking, theHarvester, Maltego, Shodan, social media analysis, job posting analysis. Result: a comprehensive target dossier used to plan subsequent scanning and exploitation phases.'},

{topic:1,diff:'hard',type:'Multiple Choice',
